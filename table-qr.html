<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>西營盤枱 QR · Mirror Burger</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Avenir Next", "PingFang HK", "Noto Sans TC", sans-serif;
            background: #f4f4f5;
            color: #111;
        }
        .toolbar {
            position: sticky; top: 0; z-index: 2;
            display: flex; gap: 8px; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            background: #111; color: #fff;
        }
        .toolbar h1 { margin: 0; font-size: 16px; }
        .toolbar p { margin: 2px 0 0; font-size: 12px; opacity: .75; }
        button {
            border: 0; border-radius: 999px; padding: 10px 16px;
            font-weight: 800; background: #FFD131; color: #111; cursor: pointer;
        }
        .note { max-width: 960px; margin: 16px auto 0; padding: 0 16px; font-size: 13px; color: #444; }
        .grid {
            max-width: 960px; margin: 16px auto 40px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px; padding: 0 16px;
        }
        .card {
            background: #fff; border: 2px solid #111; border-radius: 20px;
            padding: 18px; text-align: center;
            break-inside: avoid;
        }
        .card img { width: 220px; height: 220px; }
        .no { font-size: 42px; font-weight: 900; letter-spacing: -.04em; margin: 8px 0 0; }
        .url { font-size: 11px; font-weight: 700; color: #666; word-break: break-all; }
        .pay { margin-top: 8px; font-size: 13px; font-weight: 800; }
        @media print {
            .toolbar, .note { display: none; }
            body { background: #fff; }
            .grid { margin: 0; max-width: none; }
            .card { box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div>
            <h1>西營盤 · 1–5 號枱 QR</h1>
            <p>列印後剪開，貼喺枱面。掃完入專用點餐頁（唔係官網），送到廚房後行去櫃檯用卡機付款。</p>
        </div>
        <button type="button" onclick="window.print()">列印</button>
    </div>
    <p class="note">網址：mirrorburger.com/t/1 至 /t/5。唔經電話付款，所以堂食卡機手續費低少少。POS 撳「枱單」收款。</p>
    <div class="grid" id="grid"></div>
    <script>
        const base = 'https://mirrorburger.com';
        const grid = document.getElementById('grid');
        for (let n = 1; n <= 5; n++) {
            const url = `${base}/t/${n}`;
            const qr = `https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=8&data=${encodeURIComponent(url)}`;
            const card = document.createElement('article');
            card.className = 'card';
            card.innerHTML = `
                <div style="font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase">Mirror Burger · 西營盤</div>
                <img src="${qr}" alt="${n}號枱 QR" width="220" height="220">
                <div class="no">${n}號枱</div>
                <div class="pay">掃碼點餐 · 櫃檯付款</div>
                <div class="url">${url}</div>
            `;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
