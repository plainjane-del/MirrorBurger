<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MB Kitchen">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/kitchen-manifest.json">
    <title>Mirror Burger | Kitchen Display System</title>
    <link href="./output.css?v=2.0" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: "Avenir Next", "Helvetica Neue", "PingFang HK", "Noto Sans TC", sans-serif;
            min-height: 100dvh;
        }
        .order-card {
            animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .order-card.is-new {
            box-shadow: 0 0 0 3px #FFD131, 0 12px 40px rgba(255, 209, 49, 0.25);
        }
        @keyframes popIn {
            from { transform: translateY(-12px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .status-btn {
            min-height: 44px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
        }
        .status-btn:active { transform: scale(0.97); }
        .status-btn.is-active { outline: 3px solid #FFD131; outline-offset: 2px; }
        .branch-tab {
            min-height: 34px;
            font-weight: 800;
            font-size: 13px;
            line-height: 1.1;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .branch-tab.is-active {
            background: #FFD131;
            color: #0a0a0a;
            border-color: #FFD131;
        }
        .chip-btn {
            min-height: 34px;
            font-weight: 800;
            font-size: 12px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e5e5e5;
            white-space: nowrap;
        }
        .shift-btn {
            background: #3f3f00;
            color: #fde047;
            border-color: #854d0e;
        }
        .shift-btn.is-on {
            background: #14532d;
            color: #bbf7d0;
            border-color: #16a34a;
        }
        .store-status-btn:disabled { opacity: 0.55; }
        .store-status-btn.is-open {
            background: #14532d;
            color: #bbf7d0;
            border-color: #16a34a;
        }
        .store-status-btn.is-closed {
            background: #7f1d1d;
            color: #fecaca;
            border-color: #dc2626;
        }
        .items-scroll::-webkit-scrollbar { width: 6px; }
        .items-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 999px; }
        #conn-dot.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #conn-dot.offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .wa-notify-btn {
            min-height: 40px;
            background: #22c55e;
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.45);
            transition: transform 0.12s ease, filter 0.15s ease;
        }
        .wa-notify-btn:active { transform: scale(0.97); }
        .wa-notify-btn:hover { filter: brightness(1.08); }
        .wa-notify-btn.is-sent {
            background: #14532d;
            box-shadow: none;
            color: #bbf7d0;
        }
        .history-panel {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
        }
        .history-panel.is-open { display: block; }
        .history-panel-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
        }
        .history-panel-sheet {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: min(420px, 100%);
            background: #141414;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.22s ease;
        }
        .history-panel.is-open .history-panel-sheet { transform: translateX(0); }
        .mode-tab {
            min-height: 36px;
            font-weight: 800;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .mode-tab.is-active {
            background: #FFD131;
            color: #0a0a0a;
            border-color: #FFD131;
        }
        .board-filter {
            min-height: 38px;
            font-weight: 800;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .board-filter.is-active.new { background: #422006; color: #fde68a; border-color: #f59e0b; }
        .board-filter.is-active.prep { background: #0c4a6e; color: #bae6fd; border-color: #38bdf8; }
        .board-filter.is-active.ready { background: #14532d; color: #bbf7d0; border-color: #22c55e; }
        .board-col {
            background: #101010;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .board-col-h {
            padding: 8px 12px;
            border-bottom: 1px solid #2a2a2a;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .board-col-h.new { background: #422006; color: #fde68a; border-radius: 12px 12px 0 0; }
        .board-col-h.prep { background: #0c4a6e; color: #bae6fd; border-radius: 12px 12px 0 0; }
        .board-col-h.ready { background: #14532d; color: #bbf7d0; border-radius: 12px 12px 0 0; }
        .board-col-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }
        @media (max-width: 1023px) {
            .board-col { display: none; min-height: calc(100dvh - 168px); }
            .board-col.is-shown { display: flex; }
            .board-col-h { display: none; }
        }
        .more-sheet {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
        }
        .more-sheet.is-open { display: block; }
        .more-sheet-panel {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: #141414;
            border-top: 1px solid #333;
            border-radius: 16px 16px 0 0;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        }
        .sold-chip {
            min-height: 72px;
            border-radius: 1rem;
            border: 3px solid #333;
            background: #1a1a1a;
            font-weight: 900;
            text-align: left;
            padding: 0.75rem 1rem;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
        }
        .sold-chip:active { transform: scale(0.98); }
        .sold-chip.is-available {
            border-color: #16a34a;
            background: #052e16;
        }
        .sold-chip.is-sold {
            border-color: #dc2626;
            background: #450a0a;
            opacity: 0.95;
        }
    </style>
</head>
<body class="antialiased">

    <div id="kitchen-lock" class="fixed inset-0 z-[100] bg-kds-bg flex items-center justify-center px-6">
        <form id="kitchen-login-form" class="w-full max-w-sm space-y-5" onsubmit="return submitKitchenLogin(event)">
            <div class="text-center space-y-2">
                <img src="https://res.cloudinary.com/dnuhe2uwy/image/upload/v1777801810/logo_only_kqxyfg.png" alt="Mirror Burger" class="h-14 w-auto mx-auto">
                <h1 class="text-2xl font-black text-kds-yellow uppercase tracking-tight">Kitchen Login</h1>
                <p class="text-sm font-bold text-neutral-400">輸入廚房密碼先進入 KDS</p>
                <p class="text-[11px] font-bold text-neutral-600 tracking-widest uppercase">Kitchen · v2026.08.16c</p>
            </div>
            <input id="kitchen-password" type="password" autocomplete="current-password" required
                placeholder="Password"
                class="w-full rounded-2xl bg-kds-card border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-kds-yellow">
            <p id="kitchen-login-error" class="hidden text-sm font-bold text-red-400 text-center"></p>
            <button type="submit" id="kitchen-login-btn"
                class="w-full rounded-2xl bg-kds-yellow text-black py-4 text-base font-black uppercase tracking-widest">
                進入廚房
            </button>
        </form>
    </div>

    <div id="kitchen-app" class="hidden">
    <header class="sticky top-0 z-50 bg-kds-bg border-b border-kds-border px-3 py-2">
        <div class="flex items-center gap-2">
            <img src="https://res.cloudinary.com/dnuhe2uwy/image/upload/v1777801810/logo_only_kqxyfg.png" alt="" class="h-7 w-auto shrink-0">
            <div class="min-w-0 flex-1">
                <div class="text-sm font-black text-kds-yellow leading-none">廚房</div>
                <p class="text-[11px] text-neutral-400 font-bold mt-0.5 flex items-center gap-1.5 truncate">
                    <span id="conn-dot" class="inline-block w-2 h-2 rounded-full offline"></span>
                    <span id="conn-label">連線中…</span>
                    <span class="text-neutral-600">·</span>
                    <span id="order-count">0 單</span>
                </p>
            </div>
            <button id="store-status-btn" type="button" onclick="toggleStoreStatus()" class="chip-btn store-status-btn is-closed" disabled>…</button>
            <button type="button" id="shift-btn" onclick="unlockKitchenAudio({ quiet: false })" class="chip-btn shift-btn">開鈴</button>
            <button type="button" onclick="openMoreMenu()" class="chip-btn">更多</button>
        </div>

        <div class="mt-2 grid grid-cols-3 gap-1" role="tablist" aria-label="分店">
            <button type="button" class="branch-tab is-active" data-branch="Sai Ying Pun" onclick="selectBranch(this)">西營盤</button>
            <button type="button" class="branch-tab" data-branch="Fortress Hill" onclick="selectBranch(this)">天后</button>
            <button type="button" class="branch-tab" data-branch="Tsuen Wan (Takeaway Only)" onclick="selectBranch(this)">荃灣</button>
        </div>

        <div class="mt-2 grid grid-cols-2 gap-1" role="tablist" aria-label="模式">
            <button type="button" id="mode-orders" class="mode-tab is-active" onclick="setKitchenMode('orders')">訂單</button>
            <button type="button" id="mode-soldout" class="mode-tab" onclick="setKitchenMode('soldout')">沽清</button>
        </div>
    </header>

    <section id="view-orders" class="p-2 md:p-4">
        <div class="lg:hidden grid grid-cols-3 gap-1 mb-2">
            <button type="button" id="filter-paid" class="board-filter is-active new" onclick="setBoardFilter('PAID')">新單 <span id="count-paid-m">0</span></button>
            <button type="button" id="filter-prep" class="board-filter prep" onclick="setBoardFilter('PREPARING')">製作中 <span id="count-prep-m">0</span></button>
            <button type="button" id="filter-ready" class="board-filter ready" onclick="setBoardFilter('READY')">可取 <span id="count-ready-m">0</span></button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 md:gap-3">
            <div id="col-paid-wrap" class="board-col is-shown">
                <div class="board-col-h new">
                    <span>新單</span>
                    <span id="count-paid" class="text-xs rounded-full bg-black/30 px-2 py-0.5">0</span>
                </div>
                <div id="col-paid" class="board-col-body"></div>
            </div>
            <div id="col-prep-wrap" class="board-col">
                <div class="board-col-h prep">
                    <span>製作中</span>
                    <span id="count-prep" class="text-xs rounded-full bg-black/30 px-2 py-0.5">0</span>
                </div>
                <div id="col-prep" class="board-col-body"></div>
            </div>
            <div id="col-ready-wrap" class="board-col">
                <div class="board-col-h ready">
                    <span>可取餐</span>
                    <span id="count-ready" class="text-xs rounded-full bg-black/30 px-2 py-0.5">0</span>
                </div>
                <div id="col-ready" class="board-col-body"></div>
            </div>
        </div>
    </section>

    <section id="view-soldout" class="hidden p-4 md:p-6">
        <div class="max-w-5xl mx-auto">
            <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-2xl font-black text-kds-yellow">沽清／賣晒</h2>
                    <p class="text-sm font-bold text-neutral-400 mt-1">撳一下即可 · 即時同步顧客網站（同 Admin 同一資料）</p>
                </div>
                <button type="button" onclick="loadSoldOutMenu()" class="px-4 py-3 rounded-xl bg-neutral-800 font-black border border-neutral-600">重新載入</button>
            </div>
            <div class="flex flex-wrap gap-2 mb-4" id="soldout-cat-tabs"></div>
            <p id="soldout-msg" class="text-sm font-bold text-neutral-500 mb-3"></p>
            <div id="soldout-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        </div>
    </section>

    <div id="completed-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeCompletedToday()"></div>
        <aside class="history-panel-sheet" role="dialog" aria-label="今日已完成訂單">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow">今日已完成</h2>
                    <p id="completed-count" class="text-sm font-bold text-neutral-400 mt-0.5">0 張</p>
                </div>
                <button type="button" onclick="closeCompletedToday()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <div id="completed-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </aside>
    </div>

    <div id="stats-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeTodayStats()"></div>
        <aside class="history-panel-sheet" role="dialog" aria-label="今日統計">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow">今日統計</h2>
                    <p class="text-sm font-bold text-neutral-400 mt-0.5">依目前分店</p>
                </div>
                <button type="button" onclick="closeTodayStats()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <div id="stats-body" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </aside>
    </div>

    <div id="more-sheet" class="more-sheet" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeMoreMenu()"></div>
        <div class="more-sheet-panel">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-black">更多</h2>
                <button type="button" onclick="closeMoreMenu()" class="w-9 h-9 rounded-full bg-neutral-800 font-black">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" id="push-btn" onclick="closeMoreMenu(); enableKitchenPush({ silent: false })" class="chip-btn min-h-[44px]">開啟手機推送</button>
                <button type="button" onclick="closeMoreMenu(); unlockKitchenAudio({ quiet: false })" class="chip-btn min-h-[44px]">測試響鈴</button>
                <button type="button" onclick="closeMoreMenu(); openTodayStats()" class="chip-btn min-h-[44px]">今日統計</button>
                <button type="button" onclick="closeMoreMenu(); openCompletedToday()" class="chip-btn min-h-[44px]">今日已完成</button>
                <button type="button" onclick="logoutKitchen()" class="chip-btn min-h-[44px] col-span-2 text-red-300 border-red-900">登出</button>
            </div>
        </div>
    </div>
    </div><!-- /#kitchen-app -->

    <script>
        const SUPABASE_URL = 'https://olmoingcxkgdrqezweuf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sbW9pbmdjeGtnZHJxZXp3ZXVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTA4MTMsImV4cCI6MjA5NDY2NjgxM30.FHH8doicN8j1OKtt10BL9LS5Ta5dhLn5mSCF_cQ_pNw';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const KITCHEN_TOKEN_KEY = 'mb_kds_token';
        let kitchenBooted = false;
        // 資料庫未必已有 status 欄；偵測到唔存在就自動退回只用 payment_status
        let hasStatusColumn = true;

        function isMissingStatusColumnError(error) {
            const msg = String(error?.message || error?.details || error || '').toLowerCase();
            return msg.includes('orders.status') || (msg.includes('column') && msg.includes('status') && msg.includes('does not exist'));
        }

        // 廚房活躍狀態：已付款但未完成
        const ACTIVE_STATUSES = ['PAID', 'PREPARING', 'READY'];
        const STATUS_META = {
            PAID:       { label: '新單',     color: 'border-yellow-400',  badge: 'bg-yellow-400 text-black' },
            PREPARING:  { label: '製作中',   color: 'border-sky-400',     badge: 'bg-sky-500 text-white' },
            READY:      { label: '可取餐',   color: 'border-emerald-400', badge: 'bg-emerald-500 text-white' },
            COMPLETED:  { label: '已完成',   color: 'border-neutral-600', badge: 'bg-neutral-600 text-white' }
        };

        let currentBranch = 'Sai Ying Pun';
        let audioUnlocked = false;
        let audioCtx = null;
        const WA_NOTIFIED_KEY = 'mb_kds_wa_notified';
        let waNotifiedSet = loadWaNotifiedSet();

        function loadWaNotifiedSet() {
            try {
                const raw = localStorage.getItem(WA_NOTIFIED_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return new Set(Array.isArray(arr) ? arr : []);
            } catch {
                return new Set();
            }
        }

        function persistWaNotified() {
            try {
                localStorage.setItem(WA_NOTIFIED_KEY, JSON.stringify([...waNotifiedSet]));
            } catch (_) {}
        }

        function markWaNotified(orderNo) {
            waNotifiedSet.add(orderNo);
            persistWaNotified();
        }

        function formatAmount(order) {
            const n = Number(order?.total_amount);
            if (!Number.isFinite(n)) return '—';
            return `HK$${Math.round(n)}`;
        }

        function startOfTodayHK() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Hong_Kong',
                year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const y = parts.find(p => p.type === 'year')?.value;
            const m = parts.find(p => p.type === 'month')?.value;
            const d = parts.find(p => p.type === 'day')?.value;
            // HK midnight as UTC+8
            return new Date(`${y}-${m}-${d}T00:00:00+08:00`).toISOString();
        }
        /** @type {boolean|null} null = 未載入 / 查無資料 */
        let storeIsOpen = null;
        /** @type {Map<string, object>} */
        let ordersMap = new Map();
        const highlightedOrders = new Set();

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /** Escape for single-quoted JS string literals inside HTML onclick="...('...')" */
        function escapeJsString(str) {
            return String(str ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029');
        }

        function getKitchenStatus(order) {
            // 優先用 status；否則用 payment_status（現有資料庫欄位）
            const raw = (order.status || order.payment_status || '').toUpperCase();
            if (raw === 'PAID') return 'PAID';
            if (raw === 'PREPARING') return 'PREPARING';
            if (raw === 'READY') return 'READY';
            if (raw === 'COMPLETED') return 'COMPLETED';
            return raw || 'PAID';
        }

        function getFulfillment(order) {
            const mode = (order.delivery_mode || order.order_type || order.fulfillment || order.mode || 'pickup').toString().toLowerCase();
            if (mode.includes('deliver')) return { label: 'Delivery', zh: '外送', cls: 'bg-orange-500 text-white' };
            return { label: 'Pickup', zh: '自取', cls: 'bg-neutral-700 text-white' };
        }

        function parseItems(order) {
            try {
                if (Array.isArray(order.items_json)) return order.items_json;
                if (typeof order.items_json === 'string') return JSON.parse(order.items_json || '[]');
            } catch (e) {
                console.warn('items_json parse failed', e);
            }
            return [];
        }

        function itemQty(item) {
            return Number(item.qty || item.quantity || 1) || 1;
        }

        function itemName(item) {
            return item.nameZh || item.nameEn || item.name || '項目';
        }

        function itemNotes(item) {
            const parts = [
                item.detailsZh || item.detailsEn || '',
                item.notes || item.note || item.remark || '',
                item.size || '',
                item.temp || ''
            ].map(s => String(s || '').trim()).filter(Boolean);
            return parts.join(' · ');
        }

        /** 整理電話：去 +／空格／符號；純 8 位香港號補 852；已有區號則照用 */
        function normalizeWhatsAppPhone(raw) {
            let formattedPhone = String(raw ?? '').replace(/[^0-9]/g, '');
            if (!formattedPhone) return '';
            // 客人冇揀區號、只填 8 位香港號碼 → 自動補 852

        async function loadTodayStats() {
            const body = document.getElementById('stats-body');
            body.innerHTML = `<p class="text-neutral-500 font-bold py-8 text-center">載入中…</p>`;

            const since = startOfTodayHK();
            const selectCols = hasStatusColumn
                ? 'order_no, total_amount, payment_status, status, created_at'
                : 'order_no, total_amount, payment_status, created_at';

            const { data, error } = await client
                .from('orders')
                .select(selectCols)
                .eq('store_name', currentBranch)
                .gte('created_at', since)
                .limit(500);

            if (error) {
                if (hasStatusColumn && isMissingStatusColumnError(error)) {
                    hasStatusColumn = false;
                    return loadTodayStats();
                }
                console.error(error);
                body.innerHTML = `<p class="text-red-400 font-bold py-8 text-center">載入失敗：${escapeHtml(error.message)}</p>`;
                return;
            }

            const rows = data || [];
            let completed = 0;
            let cancelled = 0;
            let pending = 0;
            let active = 0;
            let paidLike = 0;
            let revenue = 0;

            rows.forEach(o => {
                const pay = String(o.payment_status || '').toUpperCase();
                const st = String(o.status || '').toUpperCase();
                const amt = Number(o.total_amount) || 0;

                if (st === 'COMPLETED' || pay === 'COMPLETED') {
                    completed += 1;
                    revenue += amt;
                    return;
                }
                if (pay === 'CANCELLED' || st === 'CANCELLED') {
                    cancelled += 1;
                    return;
                }
                if (pay === 'PENDING') {
                    pending += 1;
                    return;
                }
                if (isActiveKitchenOrder(o)) {
                    active += 1;
                    paidLike += 1;
                    return;
                }
                if (pay === 'PAID' || ['PREPARING', 'READY'].includes(pay) || ['PREPARING', 'READY', 'PAID'].includes(st)) {
                    paidLike += 1;
                }
            });

            body.innerHTML = [
                statCard('已完成', `${completed} 張`, `營業額約 HK$${Math.round(revenue)}`),
                statCard('廚房進行中', `${active} 張`, '已付款未完成'),
                statCard('已取消 / 未付逾時', `${cancelled} 張`, '含取消同系統清走'),
                statCard('仍待付款', `${pending} 張`, '客人可能仲喺 KPay'),
                statCard('今日總單數', `${rows.length} 張`, `已付款相關約 ${paidLike + completed} 張`)
            ].join('');
        }

        // --- Web Audio：必須由用戶手勢解鎖（Chrome 唔畀自動播） ---
        async function unlockKitchenAudio({ quiet } = {}) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                // 再確認一次（部分 Chrome 要第二次 resume）
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                if (audioCtx.state !== 'running') {
                    throw new Error('AudioContext still ' + audioCtx.state);
                }
                if (!quiet) playBeepPair(0.55);
                audioUnlocked = true;
                const btn = document.getElementById('shift-btn');
                if (btn) {
                    btn.classList.add('is-on');
                    btn.textContent = '已開鈴';
                }
            } catch (err) {
                console.error('Audio unlock failed', err);
                audioUnlocked = false;
                if (!quiet) alert('無法啟用響鈴，請先撳「開鈴」掣。');
            }
        }

        function playTone(freq, start, duration, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + duration + 0.02);
        }

        function playBeepPair(volume = 0.85) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const t = audioCtx.currentTime;
            // 嗶嗶 —— 嗶嗶
            playTone(880, t + 0.00, 0.12, volume);
            playTone(880, t + 0.16, 0.12, volume);
            playTone(1046, t + 0.42, 0.12, volume);
            playTone(1046, t + 0.58, 0.12, volume);
        }

        function ringNewOrder() {
            if (!audioUnlocked || !audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => playBeepPair()).catch(() => {});
                return;
            }
            playBeepPair();
        }

        function isActiveKitchenOrder(order) {
            const pay = (order.payment_status || '').toUpperCase();
            const st = (order.status || '').toUpperCase();

            // 未付款 / 取消 / 已完成 → 唔上牆
            if (pay === 'PENDING' || st === 'PENDING') return false;
            if (pay === 'CANCELLED' || st === 'CANCELLED') return false;
            if (st === 'COMPLETED' || pay === 'COMPLETED') return false;

            // 必須已付款：新流程 payment_status=PAID；舊資料可能把廚房狀態寫入 payment_status
            const paidOk = pay === 'PAID' || ACTIVE_STATUSES.includes(pay);
            if (!paidOk) return false;

            // 廚房狀態優先用 status；冇就 fallback payment_status（兼容舊單）
            const kitchen = st || pay;
            return ACTIVE_STATUSES.includes(kitchen);
        }

            query = hasStatusColumn

                document.getElementById('col-paid').innerHTML = errHtml;

                document.getElementById('col-ready').innerHTML = '';

        function upsertOrder(order, { ring = false, highlight = false } = {}) {
            if (!matchesBranch(order)) return;
            
            // 如果此單不符合已付款條件，確保將其從廚房畫面移除
            if (!isActiveKitchenOrder(order)) {
                if (ordersMap.has(order.order_no)) {
                    ordersMap.delete(order.order_no);
                    renderOrders();
                }
                return;
            }
            
            const isNewCard = !ordersMap.has(order.order_no);
            ordersMap.set(order.order_no, order);
            
            if (highlight || isNewCard) {
                highlightedOrders.add(order.order_no);
                setTimeout(() => {
                    highlightedOrders.delete(order.order_no);
                    renderOrders();
                }, 8000);
            }
            
            if (ring && isNewCard) {
                ringNewOrder();
                setBoardFilter('PAID');
                setKitchenMode('orders');
            }
            renderOrders();
        }

                                <div class="min-w-0 flex-1">
                                    <div class="text-base font-black text-white leading-tight">${escapeHtml(itemName(item))}</div>
                                    ${notes ? `<div class="mt-0.5 text-sm font-bold text-kds-yellow/95 leading-snug">${escapeHtml(notes)}</div>` : ''}
                                </div>
                            </div>
                        </div>`;
                }).join('')
                : `<div class="text-neutral-500 font-bold py-4">無餐點資料</div>`;

            return `
                <article class="order-card ${isNew ? 'is-new' : ''} bg-kds-card border-2 ${meta.color} rounded-2xl flex flex-col overflow-hidden" data-order="${orderNo}">
                    <div class="p-3 flex-1 flex flex-col gap-2">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <div class="text-[10px] font-black uppercase tracking-widest text-neutral-400">單號</div>
                                <div class="text-xl font-black text-white tracking-tight">#${orderNo}</div>
                                <div class="text-lg font-black text-kds-yellow">${amount}</div>
                            </div>
                            <div class="text-right">
                                <div class="inline-flex items-center px-2 py-1 rounded-md text-xs font-black uppercase ${meta.badge}">${meta.label}</div>
                                <div class="mt-1 text-2xl font-black text-kds-yellow leading-none">${pickup}</div>
                                <div class="text-[10px] font-bold text-neutral-400 uppercase">取餐</div>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2 text-sm font-bold">
                            <span class="text-white">${name}</span>
                            <span class="text-neutral-500">·</span>
                            <a href="tel:${phone}" class="text-sky-300">${phone}</a>
                            <span class="ml-auto inline-flex items-center px-2 py-0.5 rounded text-xs font-black uppercase ${fulfill.cls}">
                                ${fulfill.zh}
                            </span>
                        </div>

                        <div class="items-scroll bg-black/50 border border-neutral-800 rounded-xl px-3 max-h-[220px] overflow-y-auto flex-1">
                            ${itemsHtml}
                        </div>

                        ${(status === 'READY' || status === 'PREPARING') ? `
                        <button type="button" class="wa-notify-btn ${waSent ? 'is-sent' : ''} w-full rounded-lg px-3"
                            onclick="notifyCustomerWhatsApp('${orderNoJs}')">
                            ${waSent ? '✓ 已通知' : 'WhatsApp 通知'}
                        </button>` : ''}
                    </div>

                    <div class="grid grid-cols-3 gap-1 p-2 bg-black/40 border-t border-neutral-800">
                        <button type="button" class="status-btn rounded-lg bg-sky-600 text-white ${status === 'PREPARING' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'PREPARING')">製作中</button>
                        <button type="button" class="status-btn rounded-lg bg-emerald-600 text-white ${status === 'READY' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'READY')">可取餐</button>
                        <button type="button" class="status-btn rounded-lg bg-neutral-600 text-white ${status === 'COMPLETED' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'COMPLETED')">完成</button>
                    </div>
                </article>`;
        }

        async function updateOrderStatus(orderNo, nextStatus) {
            // 唔再用 anon client 直接 UPDATE（RLS 已封）；經廚房 token → serverless
            const token = localStorage.getItem(KITCHEN_TOKEN_KEY) || sessionStorage.getItem(KITCHEN_TOKEN_KEY) || '';
            try {
                const res = await fetch('/api/kitchen-order-status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + token,
                    },
                    body: JSON.stringify({ orderNo, status: nextStatus }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || ('HTTP ' + res.status));
                }

                const usedLegacyPaymentStatus = data.via === 'payment_status';
                if (usedLegacyPaymentStatus) hasStatusColumn = false;
                else if (data.via === 'status') hasStatusColumn = true;

                const existing = ordersMap.get(orderNo);
                if (existing) {
                    const merged = {
                        ...existing,
                        status: nextStatus,
                        ...(usedLegacyPaymentStatus ? { payment_status: nextStatus } : {})
                    };
                    if (nextStatus === 'COMPLETED') {
                        ordersMap.delete(orderNo);
                        renderOrders();
                        if (document.getElementById('completed-panel').classList.contains('is-open')) {
                            loadCompletedToday();
                        }
                    } else {
                        ordersMap.set(orderNo, merged);
                        setBoardFilter(nextStatus);
                        renderOrders();
                    }
                } else {
                    loadOrders();
                }
            } catch (err) {
                console.error(err);
                alert('更新狀態失敗：' + (err.message || err));
            }
        }

        let ordersPollTimer = null;
        let realtimeOnline = false;

        function scheduleOrdersPoll() {
            if (ordersPollTimer) clearInterval(ordersPollTimer);
            // Realtime 正常：每 60 秒兜底；斷線：每 10 秒拉一次，減少漏單
            const ms = realtimeOnline ? 60000 : 10000;
            ordersPollTimer = setInterval(() => {
                loadOrders();
                if (document.getElementById('stats-panel')?.classList.contains('is-open')) {
                    loadTodayStats();
                }
            }, ms);
        }

        function setConn(online) {
            realtimeOnline = !!online;
            const dot = document.getElementById('conn-dot');
            const label = document.getElementById('conn-label');
            dot.classList.toggle('online', online);
            dot.classList.toggle('offline', !online);
            label.textContent = online ? 'Realtime 已連接' : '連線中斷（密頻刷新中）';
            scheduleOrdersPoll();
        }

        function handleRealtime(payload) {
            const row = payload.new;
            
            if (!row) {
                if (payload.old && payload.old.order_no) {
                    ordersMap.delete(payload.old.order_no);
                    renderOrders();
                }
                return;
            }

            // 新單 (INSERT)：只有當狀態係「已付款 (PAID)」先會上牆同響鈴
            if (payload.eventType === 'INSERT') {
                if (matchesBranch(row) && isActiveKitchenOrder(row)) {
                    upsertOrder(row, { ring: true, highlight: true });
                }
                return;
            }

            // 狀態更新 (UPDATE)：例如由 PENDING 轉為 PAID 嗰一刻，當作新單響鈴提醒廚房
            if (payload.eventType === 'UPDATE') {
                const prev = payload.old || {};
                const becamePaid =
                    (prev.payment_status || '').toUpperCase() !== 'PAID' &&
                    (row.payment_status || '').toUpperCase() === 'PAID';
                
                const isNewToBoard = becamePaid || (!ordersMap.has(row.order_no) && isActiveKitchenOrder(row));

                if (matchesBranch(row) && isActiveKitchenOrder(row)) {
                    upsertOrder(row, { ring: isNewToBoard, highlight: isNewToBoard });
                } else if (ordersMap.has(row.order_no)) {
                    ordersMap.delete(row.order_no);
                    renderOrders();
                }
            }
        }

        function startRealtime() {
            client
                .channel('kitchen-kds')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, handleRealtime)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, handleRealtime)
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'orders' }, handleRealtime)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'store_settings' }, (payload) => {
                    const row = payload.new;
                    if (!row) return;
                    if ((row.store_name || '') === currentBranch) {
                        storeIsOpen = !!row.is_open;
                        renderStoreStatusBtn();
                    }
                })
                .subscribe((status) => {
                    setConn(status === 'SUBSCRIBED');
                });
        }

        function showKitchenApp() {
            document.getElementById('kitchen-lock').classList.add('hidden');
            document.getElementById('kitchen-app').classList.remove('hidden');
        }

        function showKitchenLock(msg) {
            document.getElementById('kitchen-app').classList.add('hidden');
            document.getElementById('kitchen-lock').classList.remove('hidden');
            const err = document.getElementById('kitchen-login-error');
            if (msg) {
                err.textContent = msg;
                err.classList.remove('hidden');
            } else {
                err.classList.add('hidden');
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            const arr = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
            return arr;
        }

        function setPushBtnState(state, detail = '') {
            const btn = document.getElementById('push-btn');
            if (!btn) return;
            if (state === 'on') {
                btn.textContent = '✓ 手機推送已開啟';
                btn.classList.add('border-emerald-500', 'text-emerald-200');
            } else if (state === 'busy') {
                btn.textContent = '開啟中…';
                btn.disabled = true;
            } else if (state === 'unsupported') {
                btn.textContent = detail || '此裝置不支援推送';
                btn.disabled = true;
            } else {
                btn.disabled = false;
                btn.textContent = '開啟手機推送';
            }
        }

        async function ensureKitchenServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            const reg = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;
            return reg;
        }

        async function enableKitchenPush({ silent } = {}) {
            if (!('Notification' in window) || !('PushManager' in window) || !('serviceWorker' in navigator)) {
                if (!silent) {
                    alert(
                        '此瀏覽器／裝置暫不支援網頁推送。\n\n' +
                        'iPhone：用 Safari 打開本頁 → 分享 → 「加入主畫面」→ 由主畫面圖示開啟。\n' +
                        '（iOS 16.4+）'
                    );
                }
                setPushBtnState('unsupported', '請用主畫面 App 開啟');
                return;
            }

            const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS && !isStandalone) {
                if (!silent) {
                    alert('iPhone 請先：Safari → 分享 →「加入主畫面」，再用主畫面圖示打開廚房，先會有熄芒推送。');
                }
                setPushBtnState('unsupported', '請用主畫面 App 開啟');
                return;
            }

            if (!silent) setPushBtnState('busy');
            try {
                const perm = Notification.permission === 'granted'
                    ? 'granted'
                    : await Notification.requestPermission();
                if (perm !== 'granted') {
                    if (!silent) alert('你拒絕咗通知權限。可去系統設定重新開啟。');
                    setPushBtnState('off');
                    return;
                }

                const keyRes = await fetch('/api/push-vapid-public');
                const keyData = await keyRes.json().catch(() => ({}));
                if (!keyRes.ok || !keyData.publicKey) {
                    throw new Error(keyData.error || '伺服器尚未設定推送（VAPID）');
                }

                const reg = await ensureKitchenServiceWorker();
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
                    });
                }

                const saveRes = await fetch('/api/push-subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscription: sub.toJSON(),
                        store_name: currentBranch || 'all'
                    })
                });
                const saveData = await saveRes.json().catch(() => ({}));
                if (!saveRes.ok) throw new Error(saveData.error || '儲存訂閱失敗');

                localStorage.setItem('mb_kds_push_on', '1');
                setPushBtnState('on');
            } catch (err) {
                console.error(err);
                if (!silent) alert('開啟推送失敗：' + (err.message || err));
                setPushBtnState('off');
            }
        }

        function bootKitchen() {
            if (kitchenBooted) return;
            kitchenBooted = true;
            showKitchenApp();
            loadOrders();
            loadStoreStatus();
            startRealtime();
            scheduleOrdersPoll();
            ensureKitchenServiceWorker().catch(() => {});
            // 唔好喺 boot 自動建 AudioContext —— Chrome 會報 autoplay 錯
            // 登入掣／開鈴掣／第一次撳畫面先解鎖
            document.getElementById('kitchen-app')?.addEventListener('pointerdown', () => {
                if (!audioUnlocked) unlockKitchenAudio({ quiet: true }).catch(() => {});
            }, { once: false });
            enableKitchenPush({ silent: true }).catch(() => {});
        }

        async function verifyKitchenToken(token) {
            const res = await fetch('/api/kitchen-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            return res.ok;
        }

        async function submitKitchenLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('kitchen-login-btn');
            const err = document.getElementById('kitchen-login-error');
            const password = document.getElementById('kitchen-password').value;
            btn.disabled = true;
            btn.textContent = '驗證中…';
            err.classList.add('hidden');
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || '密碼錯誤');
                }
                localStorage.setItem(KITCHEN_TOKEN_KEY, data.token);
                sessionStorage.setItem(KITCHEN_TOKEN_KEY, data.token);
                await unlockKitchenAudio({ quiet: false });
                bootKitchen();
            } catch (e) {
                err.textContent = e.message || '登入失敗';
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '進入廚房';
            }
            return false;
        }

        function logoutKitchen() {
            sessionStorage.removeItem(KITCHEN_TOKEN_KEY);
            localStorage.removeItem(KITCHEN_TOKEN_KEY);
            location.reload();
        }

        window.onload = async () => {
            const token = sessionStorage.getItem(KITCHEN_TOKEN_KEY) || localStorage.getItem(KITCHEN_TOKEN_KEY);
            if (token) {
                try {
                    if (await verifyKitchenToken(token)) {
                        bootKitchen();
                        return;
                    }
                } catch (_) {}
                sessionStorage.removeItem(KITCHEN_TOKEN_KEY);
                localStorage.removeItem(KITCHEN_TOKEN_KEY);
            }
            showKitchenLock();
            document.getElementById('kitchen-password')?.focus();
        };
    </script>
</body>
