<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MB Kitchen">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="noindex,nofollow">
    <link rel="manifest" href="/kitchen-manifest.json">
    <link rel="apple-touch-icon" href="/icons/pwa-kitchen-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-kitchen-192.png">
    <title>Mirror Burger | Kitchen Display System</title>
    <script>
        (function () {
            var standalone = window.navigator.standalone === true
                || window.matchMedia('(display-mode: standalone)').matches
                || window.matchMedia('(display-mode: fullscreen)').matches;
            if (standalone) document.documentElement.classList.add('is-standalone');
        })();
    </script>
    <link href="./output.css?v=2.0" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/store-hours.js"></script>
    <script src="js/order-id.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        :root {
            --kds-sat: 0px;
            --kds-sab: 0px;
        }
        html.is-standalone {
            --kds-sat: max(20px, env(safe-area-inset-top, 0px));
            --kds-sab: env(safe-area-inset-bottom, 0px);
        }
        @supports (padding-top: constant(safe-area-inset-top)) {
            html.is-standalone {
                --kds-sat: max(20px, constant(safe-area-inset-top));
                --kds-sab: constant(safe-area-inset-bottom);
            }
        }
        body {
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: "Avenir Next", "Helvetica Neue", "PingFang HK", "Noto Sans TC", sans-serif;
            min-height: 100dvh;
        }
        html.is-standalone #kitchen-lock {
            padding-top: var(--kds-sat);
            padding-bottom: max(24px, var(--kds-sab));
        }
        html.is-standalone .kds-header {
            padding-top: calc(10px + var(--kds-sat));
        }
        html.is-standalone .history-panel-sheet {
            padding-top: var(--kds-sat);
        }
        .order-card.is-new {
            animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 0 3px #FFD131, 0 12px 40px rgba(255, 209, 49, 0.25);
        }
        @keyframes popIn {
            from { transform: translateY(-12px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .status-btn {
            min-height: 44px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
        }
        .status-btn:active { transform: scale(0.97); }
        .status-btn.is-active { outline: 3px solid #FFD131; outline-offset: 2px; }
        .branch-tab {
            min-height: 34px;
            font-weight: 800;
            font-size: 13px;
            line-height: 1.1;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .branch-tab.is-active {
            background: #FFD131;
            color: #0a0a0a;
            border-color: #FFD131;
        }
        .chip-btn {
            min-height: 34px;
            font-weight: 800;
            font-size: 12px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #e5e5e5;
            white-space: nowrap;
        }
        .shift-btn {
            background: #3f3f00;
            color: #fde047;
            border-color: #854d0e;
        }
        .shift-btn.is-on {
            background: #14532d;
            color: #bbf7d0;
            border-color: #16a34a;
        }
        .store-status-btn:disabled { opacity: 0.55; }
        .store-status-btn.is-open {
            background: #14532d;
            color: #bbf7d0;
            border-color: #16a34a;
        }
        .store-status-btn.is-closed {
            background: #7f1d1d;
            color: #fecaca;
            border-color: #dc2626;
        }
        .items-scroll::-webkit-scrollbar { width: 6px; }
        .items-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 999px; }
        #conn-dot.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #conn-dot.offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .wa-notify-btn {
            min-height: 40px;
            background: #22c55e;
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.45);
            transition: transform 0.12s ease, filter 0.15s ease;
        }
        .wa-notify-btn:active { transform: scale(0.97); }
        .wa-notify-btn:hover { filter: brightness(1.08); }
        .wa-notify-btn.is-sent {
            background: #14532d;
            box-shadow: none;
            color: #bbf7d0;
        }
        .history-panel {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
        }
        .history-panel.is-open { display: block; }
        .history-panel-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
        }
        .history-panel-sheet {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: min(420px, 100%);
            background: #141414;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.22s ease;
        }
        .history-panel.is-open .history-panel-sheet { transform: translateX(0); }
        .mode-tab {
            min-height: 36px;
            font-weight: 800;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .mode-tab.is-active {
            background: #FFD131;
            color: #0a0a0a;
            border-color: #FFD131;
        }
        .board-filter {
            min-height: 38px;
            font-weight: 800;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .board-filter.is-active.new { background: #422006; color: #fde68a; border-color: #f59e0b; }
        .board-filter.is-active.prep { background: #0c4a6e; color: #bae6fd; border-color: #38bdf8; }
        .board-filter.is-active.ready { background: #14532d; color: #bbf7d0; border-color: #22c55e; }
        .board-col {
            background: #101010;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .board-col-h {
            padding: 8px 12px;
            border-bottom: 1px solid #2a2a2a;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .board-col-h.new { background: #422006; color: #fde68a; border-radius: 12px 12px 0 0; }
        .board-col-h.prep { background: #0c4a6e; color: #bae6fd; border-radius: 12px 12px 0 0; }
        .board-col-h.ready { background: #14532d; color: #bbf7d0; border-radius: 12px 12px 0 0; }
        .board-col-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            min-height: calc(100dvh - 168px - var(--kds-sat));
        }
        .more-sheet {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 90;
            display: none;
        }
        .more-sheet.is-open { display: block; }
        .more-sheet[hidden] { display: none !important; }
        .more-sheet-panel {
            display: none;
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: #141414;
            border-top: 1px solid #333;
            border-radius: 16px 16px 0 0;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        }
        .more-sheet.is-open .more-sheet-panel,
        .more-sheet-panel.is-open { display: block; }
        .more-sheet-panel[hidden] { display: none !important; }
        .sold-chip {
            min-height: 72px;
            border-radius: 1rem;
            border: 3px solid #333;
            background: #1a1a1a;
            font-weight: 900;
            text-align: left;
            padding: 0.75rem 1rem;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
        }
        .sold-chip:active { transform: scale(0.98); }
        .sold-chip.is-available {
            border-color: #16a34a;
            background: #052e16;
        }
        .sold-chip.is-sold {
            border-color: #dc2626;
            background: #450a0a;
            opacity: 0.95;
        }

        .lang-toggle {
            min-height: 40px;
            min-width: 56px;
            padding: 0 14px;
            border-radius: 999px;
            border: 2px solid #FFD131;
            background: #FFD131;
            color: #0a0a0a;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: .04em;
            cursor: pointer;
        }
        .lang-toggle:active { transform: scale(.97); }
        #kitchen-lang-login {
            position: absolute;
            top: calc(12px + env(safe-area-inset-top));
            right: 16px;
            z-index: 101;
        }
        #kitchen-lock { position: relative; }
        body:has(#kitchen-app:not(.hidden)) #kitchen-lang-login {
            display: none !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="antialiased">

    <div id="kitchen-lock" class="fixed inset-0 z-[100] bg-kds-bg flex items-center justify-center px-6">
        <button type="button" id="kitchen-lang-login" data-lang-toggle class="lang-toggle" onclick="MB_I18N.toggleLang()" aria-label="Language">EN</button>
        <form id="kitchen-login-form" class="w-full max-w-sm space-y-5" onsubmit="return submitKitchenLogin(event)">
            <div class="text-center space-y-2">
                <img src="https://res.cloudinary.com/dnuhe2uwy/image/upload/c_limit,w_280/f_auto/q_auto/v1777801810/logo_only_kqxyfg.png" alt="Mirror Burger" class="h-14 w-auto mx-auto">
                <h1 class="text-2xl font-black text-kds-yellow uppercase tracking-tight" data-i18n="kitchen.login.title">Kitchen Login</h1>
                <p class="text-sm font-bold text-neutral-400" data-i18n="kitchen.login.hint">用分店密碼登入；Master 可以切換所有分店。</p>
                <p class="text-[11px] font-bold text-neutral-600 tracking-widest uppercase">Kitchen · v2026.09.18a</p>
                <p class="text-xs font-bold text-neutral-500 leading-relaxed px-1" data-i18n="kitchen.login.pwa">
                    iPhone 熄芒收單：用 Safari 打開本頁 → 分享 →「加入主畫面」→ 由主畫面圖示進入，再撳一次「開啟手機推送」。之後唔使開住 App 都會響。
                </p>
            </div>
            <select id="kitchen-login-store"
                class="w-full rounded-2xl bg-kds-card border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-kds-yellow">
                <option value="Sai Ying Pun" data-i18n="kitchen.store.syp">西營盤</option>
                <option value="Fortress Hill" data-i18n="kitchen.store.th">天后</option>
                <option value="Tsuen Wan (Takeaway Only)" data-i18n="kitchen.store.tw">荃灣</option>
                <option value="__master__" data-i18n="kitchen.store.master">Master 全部分店</option>
            </select>
            <input id="kitchen-password" type="password" autocomplete="current-password" required
                data-i18n-placeholder="kitchen.login.password" placeholder="Password"
                class="w-full rounded-2xl bg-kds-card border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-kds-yellow">
            <p id="kitchen-login-error" class="hidden text-sm font-bold text-red-400 text-center"></p>
            <button type="submit" id="kitchen-login-btn"
                class="w-full rounded-2xl bg-kds-yellow text-black py-4 text-base font-black uppercase tracking-widest" data-i18n="kitchen.login.submit">
                進入廚房
            </button>
        </form>
    </div>

    <div id="kitchen-app" class="hidden">
    <header class="kds-header sticky top-0 z-50 bg-kds-bg border-b border-kds-border px-3 pb-2 pt-2">
        <div class="flex items-center gap-2">
            <img src="https://res.cloudinary.com/dnuhe2uwy/image/upload/c_limit,w_140/f_auto/q_auto/v1777801810/logo_only_kqxyfg.png" alt="" class="h-7 w-auto shrink-0">
            <div class="min-w-0 flex-1">
                <div class="text-sm font-black text-kds-yellow leading-none" id="kds-title" data-i18n="kitchen.brand">廚房</div>
                <p class="text-[11px] text-neutral-400 font-bold mt-0.5 flex items-center gap-1.5 truncate">
                    <span id="conn-dot" class="inline-block w-2 h-2 rounded-full offline"></span>
                    <span id="conn-label">連線中…</span>
                    <span class="text-neutral-600">·</span>
                    <span id="order-count">0 單</span>
                </p>
            </div>
            <button type="button" data-lang-toggle class="lang-toggle shrink-0" onclick="MB_I18N.toggleLang()" aria-label="Language">EN</button>
            <button id="store-status-btn" type="button" onclick="toggleStoreStatus()" class="chip-btn store-status-btn is-closed" disabled>…</button>
            <button type="button" id="shift-btn" onclick="unlockKitchenAudio({ quiet: false })" class="chip-btn shift-btn" data-i18n="kitchen.bell.on">開鈴</button>
            <button type="button" onclick="openMoreMenu()" class="chip-btn" data-i18n="kitchen.more">更多</button>
        </div>
        <button type="button" id="push-nudge" onclick="enableKitchenPush({ silent: false })" class="hidden mt-2 w-full rounded-xl bg-amber-400 text-black px-3 py-2.5 text-xs font-black text-left" data-i18n="kitchen.push.nudge">
            熄芒收單未開 — 撳呢度允許 iPhone 通知（只須一次）
        </button>

        <div id="branch-tabs" class="mt-2 grid grid-cols-4 gap-1 hidden" role="tablist" data-i18n-title="kitchen.aria.stores" aria-label="分店">
            <button type="button" class="branch-tab" data-branch="__all__" onclick="selectBranch(this)" data-i18n="kitchen.store.all">全部</button>
            <button type="button" class="branch-tab is-active" data-branch="Sai Ying Pun" onclick="selectBranch(this)" data-i18n="kitchen.store.syp">西營盤</button>
            <button type="button" class="branch-tab" data-branch="Fortress Hill" onclick="selectBranch(this)" data-i18n="kitchen.store.th">天后</button>
            <button type="button" class="branch-tab" data-branch="Tsuen Wan (Takeaway Only)" onclick="selectBranch(this)" data-i18n="kitchen.store.tw">荃灣</button>
        </div>

        <div class="mt-2 grid grid-cols-2 gap-1" role="tablist" data-i18n-title="kitchen.aria.mode" aria-label="模式">
            <button type="button" id="mode-orders" class="mode-tab is-active" onclick="setKitchenMode('orders')" data-i18n="kitchen.mode.orders">訂單</button>
            <button type="button" id="mode-soldout" class="mode-tab" onclick="setKitchenMode('soldout')" data-i18n="kitchen.mode.soldout">沽清</button>
        </div>
        <div id="pending-kpay" class="hidden mt-2 rounded-xl border border-amber-500 bg-amber-950/70 p-2"></div>
    </header>

    <section id="view-orders" class="p-2 md:p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-3">
            <div id="col-paid-wrap" class="board-col is-shown">
                <div class="board-col-h new">
                    <span data-i18n="kitchen.col.new">新單</span>
                    <span id="count-paid" class="text-xs rounded-full bg-black/30 px-2 py-0.5">0</span>
                </div>
                <div id="col-paid" class="board-col-body"></div>
            </div>
            <div id="col-ready-wrap" class="board-col is-shown">
                <div class="board-col-h ready">
                    <span data-i18n="kitchen.col.ready">可取餐</span>
                    <span id="count-ready" class="text-xs rounded-full bg-black/30 px-2 py-0.5">0</span>
                </div>
                <div id="col-ready" class="board-col-body"></div>
            </div>
        </div>
    </section>

    <section id="view-soldout" class="hidden p-4 md:p-6">
        <div class="max-w-5xl mx-auto">
            <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-2xl font-black text-kds-yellow" data-i18n="kitchen.soldout.title">沽清／賣晒</h2>
                    <p class="text-sm font-bold text-neutral-400 mt-1" data-i18n="kitchen.soldout.sub">撳一下即可 · 即時同步顧客網站（同 Admin 同一資料）</p>
                </div>
                <button type="button" onclick="loadSoldOutMenu()" class="px-4 py-3 rounded-xl bg-neutral-800 font-black border border-neutral-600" data-i18n="kitchen.soldout.reload">重新載入</button>
            </div>
            <div class="flex flex-wrap gap-2 mb-4" id="soldout-cat-tabs"></div>
            <p id="soldout-msg" class="text-sm font-bold text-neutral-500 mb-3"></p>
            <div id="soldout-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        </div>
    </section>

    <div id="completed-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeCompletedToday()"></div>
        <aside class="history-panel-sheet" role="dialog" data-i18n-title="kitchen.aria.completed" aria-label="今日已完成訂單">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow" data-i18n="kitchen.completed.title">今日已完成</h2>
                    <p id="completed-count" class="text-sm font-bold text-neutral-400 mt-0.5">0 張</p>
                </div>
                <button type="button" onclick="closeCompletedToday()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <div id="completed-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </aside>
    </div>

    <div id="stats-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeTodayStats()"></div>
        <aside class="history-panel-sheet" role="dialog" data-i18n-title="kitchen.aria.stats" aria-label="今日統計">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow" data-i18n="kitchen.stats.title">今日統計</h2>
                    <p class="text-sm font-bold text-neutral-400 mt-0.5" data-i18n="kitchen.stats.sub">依目前分店</p>
                </div>
                <button type="button" onclick="closeTodayStats()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <div id="stats-body" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </aside>
    </div>

    <div id="password-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closePasswordPanel()"></div>
        <aside class="history-panel-sheet" role="dialog" data-i18n-title="kitchen.aria.password" aria-label="更改密碼">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow" data-i18n="kitchen.pw.title">更改密碼</h2>
                    <p id="password-panel-hint" class="text-sm font-bold text-neutral-400 mt-0.5" data-i18n="kitchen.pw.hint_default">只改呢個帳號。伺服器只存 hash，唔存明文。</p>
                </div>
                <button type="button" onclick="closePasswordPanel()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <form class="p-4 space-y-3" onsubmit="return submitKitchenPassword(event)">
                <label class="block text-xs font-black text-neutral-500 uppercase tracking-widest" data-i18n="kitchen.pw.current">而家密碼</label>
                <input id="pw-current" type="password" autocomplete="current-password" required
                    class="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-4 py-3 text-base font-bold text-white outline-none focus:border-kds-yellow">
                <label class="block text-xs font-black text-neutral-500 uppercase tracking-widest" data-i18n="kitchen.pw.new">新密碼（至少 8 個字）</label>
                <input id="pw-new" type="password" autocomplete="new-password" required minlength="8"
                    class="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-4 py-3 text-base font-bold text-white outline-none focus:border-kds-yellow">
                <label class="block text-xs font-black text-neutral-500 uppercase tracking-widest" data-i18n="kitchen.pw.confirm">再入一次新密碼</label>
                <input id="pw-confirm" type="password" autocomplete="new-password" required minlength="8"
                    class="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-4 py-3 text-base font-bold text-white outline-none focus:border-kds-yellow">
                <p id="password-panel-msg" class="hidden text-sm font-bold"></p>
                <button type="submit" id="pw-save-btn"
                    class="w-full rounded-xl bg-kds-yellow text-black py-3 text-sm font-black uppercase tracking-widest" data-i18n="kitchen.pw.save">
                    儲存新密碼
                </button>
            </form>
        </aside>
    </div>

    <div id="more-sheet" class="more-sheet" hidden aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeMoreMenu()"></div>
        <div id="more-sheet-panel" class="more-sheet-panel" hidden>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-black" data-i18n="kitchen.more">更多</h2>
                <button type="button" onclick="event.stopPropagation(); closeMoreMenu();" class="w-9 h-9 rounded-full bg-neutral-800 font-black">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">

            // 優先用 status；否則用 payment_status（現有資料庫欄位）
            const raw = (order.status || order.payment_status || '').toUpperCase();

        function tableNoFromOrder(order) {
            const m = String(order.pickup_time || '').match(/(\d+)\s*號枱/);

        function isTableOrder(order) {
            return String(order.channel || '') === 'table' || !!tableNoFromOrder(order);

        function isUnpaidTable(order) {

            if (isTableOrder(order) || /堂食/.test(String(order.pickup_time || ''))) {

        function parseItems(order) {
            try {
                if (Array.isArray(order.items_json)) return order.items_json;
                if (typeof order.items_json === 'string') return JSON.parse(order.items_json || '[]');
            } catch (e) {
                console.warn('items_json parse failed', e);
            }
            return [];
        }

        function itemQty(item) {
            return Number(item.qty || item.quantity || 1) || 1;
        }

        function itemName(item) {
            return item.nameZh || item.nameEn || item.name || t('kitchen.item_fallback');
        }

        function itemNotes(item) {
            const parts = [
                item.detailsZh || item.detailsEn || '',
                item.notes || item.note || item.remark || '',
                item.size || '',
                item.temp || ''
            ].map(s => String(s || '').trim()).filter(Boolean);
            return parts.join(' · ');
        }

        function kitchenPhoneKey(order) {
            return String(order.customer_phone || '').replace(/\D/g, '');
        }

        function kitchenItemsKey(order) {
            return parseItems(order).map((item) => {
                return `${itemName(item)}x${itemQty(item)}:${itemNotes(item)}`;
            }).sort().join('|');
        }

        function duplicateOrderNos(list) {
            const groups = new Map();
            (list || []).forEach((order) => {
                const phone = kitchenPhoneKey(order);
                if (!phone || phone === 'POS') return;
                const amount = Math.round(Number(order.total_amount) || 0);
                const key = `${order.store_name || ''}|${phone}|${kitchenItemsKey(order)}|${amount}`;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(order);
            });
            const flagged = new Map();
            groups.forEach((orders) => {
                if (orders.length < 2) return;
                const nos = orders.map((o) => o.order_no).filter(Boolean);
                orders.forEach((o) => {
                    flagged.set(o.order_no, nos.filter((n) => n !== o.order_no));
                });
            });
            return flagged;
        }

        /** 整理電話：去 +／空格／符號；純 8 位香港號補 852；已有區號則照用 */
        function normalizeWhatsAppPhone(raw) {
            let formattedPhone = String(raw ?? '').replace(/[^0-9]/g, '');
            if (!formattedPhone) return '';
            // 客人冇揀區號、只填 8 位香港號碼 → 自動補 852
            if (formattedPhone.length === 8) {
                formattedPhone = '852' + formattedPhone;
            }
            // 已包含國家區號（例如 852…、86…）→ 直接使用
            return formattedPhone;
        }

        function statCard(label, value, sub = '') {
            return `
                <div class="rounded-2xl border border-neutral-700 bg-kds-card p-5">
                    <div class="text-xs font-black uppercase tracking-widest text-neutral-500">${label}</div>
                    <div class="mt-2 text-3xl font-black text-kds-yellow">${value}</div>
                    ${sub ? `<div class="mt-1 text-sm font-bold text-neutral-400">${sub}</div>` : ''}
                </div>`;
        }

        async function loadTodayStats() {
            const body = document.getElementById('stats-body');
            body.innerHTML = `<p class="text-neutral-500 font-bold py-8 text-center">${escapeHtml(t('common.loading'))}</p>`;

            try {
                const data = await kitchenOrdersApi({ action: 'stats' });
                const rows = Array.isArray(data.orders) ? data.orders : [];
                let completed = 0;
                let cancelled = 0;
                let pending = 0;
                let active = 0;
                let paidLike = 0;
                let revenue = 0;

                rows.forEach(o => {
                    const pay = String(o.payment_status || '').toUpperCase();
                    const st = String(o.status || '').toUpperCase();
                    const amt = Number(o.total_amount) || 0;

                    if (st === 'COMPLETED' || pay === 'COMPLETED') {
                        completed += 1;
                        revenue += amt;
                        return;
                    }
                    if (pay === 'CANCELLED' || st === 'CANCELLED') {
                        cancelled += 1;
                        return;
                    }
                    if (pay === 'PENDING') {
                        pending += 1;
                        return;
                    }
                    if (isActiveKitchenOrder(o)) {
                        active += 1;
                        paidLike += 1;
                        return;
                    }
                    if (pay === 'PAID' || ['PREPARING', 'READY'].includes(pay) || ['PREPARING', 'READY', 'PAID'].includes(st)) {
                        paidLike += 1;
                    }
                });

                body.innerHTML = [
                    statCard(t('kitchen.stats.completed'), t('kitchen.stats.tickets', { n: completed }), t('kitchen.stats.completed_sub', { amount: Math.round(revenue) })),
                    statCard(t('kitchen.stats.active'), t('kitchen.stats.tickets', { n: active }), t('kitchen.stats.active_sub')),
                    statCard(t('kitchen.stats.cancelled'), t('kitchen.stats.tickets', { n: cancelled }), t('kitchen.stats.cancelled_sub')),
                    statCard(t('kitchen.stats.pending'), t('kitchen.stats.tickets', { n: pending }), t('kitchen.stats.pending_sub')),
                    statCard(t('kitchen.stats.total'), t('kitchen.stats.tickets', { n: rows.length }), t('kitchen.stats.total_sub', { n: paidLike + completed }))
                ].join('');
            } catch (err) {
                console.error(err);
                body.innerHTML = `<p class="text-red-400 font-bold py-8 text-center">${escapeHtml(t('kitchen.alert.load_fail', { msg: err.message || err }))}</p>`;
            }
        }

        // --- Web Audio：必須由用戶手勢解鎖（Chrome 唔畀自動播） ---
        async function unlockKitchenAudio({ quiet } = {}) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                // 再確認一次（部分 Chrome 要第二次 resume）
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                if (audioCtx.state !== 'running') {
                    throw new Error('AudioContext still ' + audioCtx.state);
                }
                if (!quiet) playBeepPair(0.55);
                audioUnlocked = true;
                const btn = document.getElementById('shift-btn');
                if (btn) {
                    btn.classList.add('is-on');
                    btn.textContent = t('kitchen.bell.on_done');
                }
            } catch (err) {
                console.error('Audio unlock failed', err);
                audioUnlocked = false;
                if (!quiet) alert(t('kitchen.alert.bell_fail'));
            }
        }

        function playTone(freq, start, duration, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + duration + 0.02);
        }

        function playBeepPair(volume = 0.85) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const t = audioCtx.currentTime;
            // 嗶嗶 —— 嗶嗶
            playTone(880, t + 0.00, 0.12, volume);
            playTone(880, t + 0.16, 0.12, volume);
            playTone(1046, t + 0.42, 0.12, volume);
            playTone(1046, t + 0.58, 0.12, volume);
        }

        function ringNewOrder() {
            if (!audioUnlocked || !audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => playBeepPair()).catch(() => {});
                return;
            }
            playBeepPair();
        }

        function selectBranch(btn) {
            if (!canSwitchBranches() && btn.dataset.branch !== currentBranch) return;
            currentBranch = btn.dataset.branch;

            syncBranchTabs();

            loadOrders();
            loadStoreStatus();
            syncScheduledHours();

                enableKitchenPush({ silent: true }).catch(() => {});

                loadCompletedToday();

            if (document.getElementById('stats-panel').classList.contains('is-open')) {
                loadTodayStats();
            }

        function applyStoreRow(row) {
            if (!row) {

            const effective = effectiveStoreOpen();
            const manual = typeof MBStoreHours !== 'undefined' && MBStoreHours.overrideActive
                && MBStoreHours.overrideActive(storeStatusRow());
            if (effective === true) {
                btn.classList.add('is-open');
                btn.textContent = t('kitchen.store.open');
                btn.disabled = false;
            } else if (effective === false) {
                btn.classList.add('is-closed');

        async function loadStoreStatus() {
            const btn = document.getElementById('store-status-btn');
            if (isAllBranchesView()) {
                if (btn) {
                    btn.disabled = true;
                    btn.classList.remove('is-open', 'is-closed');
                    btn.textContent = t('kitchen.store.all');
                }
                storeIsOpen = null;
                storeOverrideUntil = null;
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.textContent = t('kitchen.store.loading');
            }

            const branch = effectiveStoreName();
            let query = client
                .from('store_settings')
                .select('is_open, override_until')
                .eq('store_name', branch)
                .maybeSingle();
            let { data, error } = await query;

            if (error && /override_until/i.test(String(error.message || ''))) {
                const fallback = await client
                    .from('store_settings')
                    .select('is_open')
                    .eq('store_name', branch)
                    .maybeSingle();
                data = fallback.data;
                error = fallback.error;
            }

            if (error) {
                console.error('loadStoreStatus', error);
                storeIsOpen = null;
                storeOverrideUntil = null;
                renderStoreStatusBtn();
                return;
            }

            applyStoreRow(data || { is_open: true, override_until: null });
            renderStoreStatusBtn();
        }

        function sortOrders(list) {
            return [...list].sort((a, b) => {
                const ta = new Date(a.created_at || 0).getTime();
                const tb = new Date(b.created_at || 0).getTime();
                return tb - ta; // 最新在最頂
            });
        }

        function matchesBranch(order) {
            if (isAllBranchesView()) return true;
            return (order.store_name || '') === currentBranch;
        }

        function isActiveKitchenOrder(order) {
            const pay = (order.payment_status || '').toUpperCase();
            const st = (order.status || '').toUpperCase();

            // 未付款 / 取消 / 已完成 → 唔上牆
            if (pay === 'PENDING') return false;
            if (pay === 'CANCELLED' || st === 'CANCELLED') return false;
            if (st === 'COMPLETED' || pay === 'COMPLETED') return false;

            // 必須已付款；堂食枱單可以 UNPAID 先上牆，客人行去櫃檯俾錢
            const paidOk = pay === 'PAID' || pay === 'UNPAID' || ACTIVE_STATUSES.includes(pay);
            if (!paidOk) return false;

            // 廚房狀態優先用 status；冇就 fallback payment_status（兼容舊單）
            const kitchen = ACTIVE_STATUSES.includes(st) ? st : (pay === 'UNPAID' ? 'PAID' : pay);
            return ACTIVE_STATUSES.includes(kitchen);
        }

        async function loadOrders() {
            if (loadOrdersBusy) return;
            loadOrdersBusy = true;
            try {
                // Prefer direct Supabase (JWT + RLS). Fallback to Vercel API.
                const direct = await fetchBoardFromSupabase();
                if (direct) {
                    applyBoardRows(direct);
                    // Pending KPay reconcile still needs the API (server-side KPay query).
                    try {
                        const data = await kitchenOrdersApi({ action: 'board' });
                        if (data && !data.notModified) {
                            pendingOnline = Array.isArray(data.pending_online) ? data.pending_online : [];
                            renderPendingOnline();
                        }
                    } catch (err) {
                        console.warn('pending_online via API skipped:', err.message || err);
                    }
                    return;
                }

                const data = await kitchenOrdersApi({ action: 'board' });
                if (data && data.notModified) {
                    kitchenBoardReady = true;
                    return;
                }
                const rows = Array.isArray(data.orders) ? data.orders : [];
                pendingOnline = Array.isArray(data.pending_online) ? data.pending_online : [];
                applyBoardRows(rows);
                renderPendingOnline();
            } catch (err) {
                console.error(err);
                const errHtml = `<div class="text-center py-10 text-red-400 font-black text-lg">${escapeHtml(t('kitchen.alert.load_fail', { msg: err.message || err }))}</div>`;
                document.getElementById('col-paid').innerHTML = errHtml;
                const readyCol = document.getElementById('col-ready');
                if (readyCol) readyCol.innerHTML = '';
            } finally {
                loadOrdersBusy = false;
            }
        }

        function upsertOrder(order, { ring = false, highlight = false } = {}) {
            if (!matchesBranch(order)) return;
            
            // 如果此單不符合已付款條件，確保將其從廚房畫面移除
            if (!isActiveKitchenOrder(order)) {
                if (ordersMap.has(order.order_no)) {
                    ordersMap.delete(order.order_no);
                    renderOrders();
                }
                return;
            }
            
            const isNewCard = !ordersMap.has(order.order_no);
            ordersMap.set(order.order_no, order);
            
            if (highlight || isNewCard) {
                highlightedOrders.add(order.order_no);
                setTimeout(() => {
                    highlightedOrders.delete(order.order_no);
                    renderOrders();
                }, 8000);
            }
            
            if (ring && isNewCard) {
                ringNewOrder();
                setBoardFilter('PAID');
                setKitchenMode('orders');
            }
            renderOrders();
        }

        async function submitKitchenPassword(event) {
            event.preventDefault();
            const current = document.getElementById('pw-current')?.value || '';
            const next = document.getElementById('pw-new')?.value || '';
            const confirmPw = document.getElementById('pw-confirm')?.value || '';
            const msg = document.getElementById('password-panel-msg');
            const btn = document.getElementById('pw-save-btn');
            function showMsg(text, ok) {
                if (!msg) return;
                msg.textContent = text;
                msg.classList.remove('hidden', 'text-red-400', 'text-emerald-400');
                msg.classList.add(ok ? 'text-emerald-400' : 'text-red-400');
            }
            if (next !== confirmPw) {
                showMsg(t('kitchen.pw.mismatch'), false);
                return false;
            }
            btn.disabled = true;
            btn.textContent = t('kitchen.pw.saving');
            try {
                const token = sessionStorage.getItem(KITCHEN_TOKEN_KEY) || localStorage.getItem(KITCHEN_TOKEN_KEY) || '';
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'change_password',
                        token,
                        currentPassword: current,
                        newPassword: next,
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || t('kitchen.pw.fail'));
                showMsg(t('kitchen.pw.ok'), true);
                ['pw-current', 'pw-new', 'pw-confirm'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
            } catch (err) {
                showMsg(err.message || t('kitchen.pw.fail'), false);
            } finally {
                btn.disabled = false;
                btn.textContent = t('kitchen.pw.save');
            }
            return false;
        }

        function formatKitchenApiError(error) {
            if (!error) return '';
            if (typeof error === 'string') {
                try {
                    const parsed = JSON.parse(error);
                    if (parsed && parsed.message) return parsed.message;
                } catch (_) {}
                return error;
            }
            if (typeof error === 'object' && error.message) return error.message;
            return String(error);
        }

        async function kitchenOrdersApi(payload) {
            const headers = {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + getKitchenToken(),
            };
            if (payload && payload.action === 'board' && boardEtag) {
                headers['If-None-Match'] = boardEtag;
            }
            const res = await fetch('/api/kitchen-menu', {
                method: 'POST',
                headers,
                body: JSON.stringify({ store_name: apiStoreName(), ...payload }),
            });
            if (res.status === 304) return { notModified: true };
            const etag = res.headers.get('ETag');
            if (etag && payload && payload.action === 'board') boardEtag = etag;
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(formatKitchenApiError(data.error) || 'Request failed');
            return data;
        }

        async function kitchenMenuApi(payload) {
            const res = await fetch('/api/kitchen-menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: getKitchenToken(), store_name: effectiveStoreName(), ...payload }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(formatKitchenApiError(data.error) || 'Request failed');
            return data;
        }

                                ${branchBadge}
                                ${String(order.channel || '') === 'pos' ? '<div class="text-[10px] font-black text-amber-300 mt-0.5">' + escapeHtml(t('kitchen.pos_channel')) + '</div>' : ''}
                                ${isTableOrder(order) && tableNoFromOrder(order) ? `<div class="mt-1 text-3xl font-black text-amber-300 leading-none">${escapeHtml(t('kitchen.table_n', { n: tableNoFromOrder(order) }))}</div>` : ''}
                                ${isUnpaidTable(order) ? '<div class="mt-1 inline-flex px-2 py-0.5 rounded bg-red-600 text-white text-[10px] font-black">' + escapeHtml(t('kitchen.unpaid')) + '</div>' : ''}
                                <div class="text-lg font-black text-kds-yellow">${amount}</div>
                            </div>
                            <div class="text-right">
                                <div class="inline-flex items-center px-2 py-1 rounded-md text-xs font-black uppercase ${meta.badge}">${escapeHtml(statusMetaLabel(meta))}</div>
                                <div class="mt-1 text-2xl font-black text-kds-yellow leading-none">${pickup}</div>
                                <div class="text-[10px] font-bold text-neutral-400 uppercase">${escapeHtml(isTableOrder(order) ? t('kitchen.dine_in') : t('kitchen.pickup'))}</div>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2 text-sm font-bold">
                            <span class="text-white">${name}</span>
                            <span class="text-neutral-500">·</span>
                            <a href="tel:${phone}" class="text-sky-300">${phone}</a>
                            <span class="ml-auto inline-flex items-center px-2 py-0.5 rounded text-xs font-black uppercase ${fulfill.cls}">
                                ${fulfill.zh}
                            </span>
                        </div>

                        <div class="items-scroll bg-black/50 border border-neutral-800 rounded-xl px-3 max-h-[220px] overflow-y-auto flex-1">
                            ${itemsHtml}
                        </div>

                        ${(status === 'READY' || status === 'PREPARING' || status === 'PAID') ? `
                        <button type="button" class="wa-notify-btn ${waSent ? 'is-sent' : ''} w-full rounded-lg px-3"
                            onclick="notifyCustomerWhatsApp('${orderNoJs}')">
                            ${waSent ? escapeHtml(t('kitchen.btn.wa_sent')) : escapeHtml(t('kitchen.btn.wa'))}
                        </button>` : ''}
                    </div>

                    <div class="grid grid-cols-2 gap-1 p-2 bg-black/40 border-t border-neutral-800">
                        <button type="button" class="status-btn rounded-lg bg-emerald-600 text-white ${status === 'READY' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'READY')">${escapeHtml(t('kitchen.btn.ready'))}</button>
                        <button type="button" class="status-btn rounded-lg bg-neutral-600 text-white ${status === 'COMPLETED' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'COMPLETED')">${escapeHtml(t('kitchen.btn.done'))}</button>
                    </div>
                </article>`;
        }

        async function updateOrderStatus(orderNo, nextStatus) {
            // 唔再用 anon client 直接 UPDATE（RLS 已封）；經廚房 token → serverless
            const token = localStorage.getItem(KITCHEN_TOKEN_KEY) || sessionStorage.getItem(KITCHEN_TOKEN_KEY) || '';
            try {
                const res = await fetch('/api/kitchen-menu', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + token,
                    },
                    body: JSON.stringify({ action: 'set_order_status', orderNo, status: nextStatus }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || ('HTTP ' + res.status));
                }

                const usedLegacyPaymentStatus = data.via === 'payment_status';
                if (usedLegacyPaymentStatus) hasStatusColumn = false;
                else if (data.via === 'status') hasStatusColumn = true;

                const existing = ordersMap.get(orderNo);
                if (existing) {
                    const merged = {
                        ...existing,
                        status: nextStatus,
                        ...(usedLegacyPaymentStatus ? { payment_status: nextStatus } : {})
                    };
                    if (nextStatus === 'COMPLETED') {
                        ordersMap.delete(orderNo);
                        renderOrders();
                        if (document.getElementById('completed-panel').classList.contains('is-open')) {
                            loadCompletedToday();
                        }
                    } else {
                        ordersMap.set(orderNo, merged);
                        setBoardFilter(nextStatus);
                        renderOrders();
                    }
                } else {
                    loadOrders();
                }
            } catch (err) {
                console.error(err);
                alert(t('kitchen.alert.status_fail', { msg: err.message || err }));
            }
        }

        let ordersPollTimer = null;
        let realtimeOnline = false;

        function ordersPollMs() {
            if (document.hidden) return 5 * 60 * 1000;
            // Realtime is primary; slow safety net only.
            return realtimeOnline ? 5 * 60 * 1000 : 20000;
        }
        function scheduleOrdersPoll() {
            if (ordersPollTimer) clearInterval(ordersPollTimer);
            ordersPollTimer = setInterval(() => {
                loadOrders();
                if (document.getElementById('stats-panel')?.classList.contains('is-open')) {
                    loadTodayStats();
                }
            }, ordersPollMs());
        }

        function setConn(online) {
            realtimeOnline = !!online;
            const dot = document.getElementById('conn-dot');
            const label = document.getElementById('conn-label');
            dot.classList.toggle('online', online);
            dot.classList.toggle('offline', !online);
            label.textContent = online ? t('kitchen.conn.online') : t('kitchen.conn.offline');
            scheduleOrdersPoll();
        }

        let boardRefreshTimer = null;
        function requestBoardRefresh() {
            if (boardRefreshTimer) return;
            boardRefreshTimer = setTimeout(() => {
                boardRefreshTimer = null;
                loadOrders();
            }, 400);
        }

        function handleOrdersRealtime(payload) {
            const event = String(payload.eventType || payload.event || '').toUpperCase();
            if (event === 'DELETE') {
                const old = payload.old;
                if (old && old.order_no && ordersMap.has(old.order_no)) {
                    ordersMap.delete(old.order_no);
                    renderOrders();
                }
                return;
            }
            const row = payload.new;
            if (!row) {
                requestBoardRefresh();
                return;
            }
            if ((row.store_name || '') && !matchesBranch(row)) return;
            const pay = String(row.payment_status || '').toUpperCase();
            if (pay === 'PENDING') {
                // Online unpaid — keep off board; API reconcile path still handles kpay banner.
                if (ordersMap.has(row.order_no)) {
                    ordersMap.delete(row.order_no);
                    renderOrders();
                }
                return;
            }
            const wasNew = !ordersMap.has(row.order_no);
            upsertOrder(row, {
                ring: wasNew && kitchenBoardReady && isActiveKitchenOrder(row),
                highlight: wasNew && kitchenBoardReady && isActiveKitchenOrder(row),
            });
        }

        function startRealtime() {
            if (kitchenChannel) {
                try { client.removeChannel(kitchenChannel); } catch (_) { /* ignore */ }
                kitchenChannel = null;
            }
            const jwt = getSupabaseAccessToken();
            try {
                if (jwt && client.realtime && typeof client.realtime.setAuth === 'function') {
                    client.realtime.setAuth(jwt);
                }
            } catch (_) { /* ignore */ }
            const filter = (!isAllBranchesView() && currentBranch)
                ? `store_name=eq.${currentBranch}`
                : undefined;
            const ordersOpts = { event: '*', schema: 'public', table: 'orders' };
            if (filter) ordersOpts.filter = filter;

            kitchenChannel = client
                .channel('kitchen-kds-' + (filter || 'all'))
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'store_settings' }, (payload) => {
                    const row = payload.new;
                    if (!row) return;
                    if (isAllBranchesView()) return;
                    if ((row.store_name || '') === currentBranch) {
                        applyStoreRow(row);
                        renderStoreStatusBtn();
                    }
                })
                .on('postgres_changes', ordersOpts, (payload) => {
                    handleOrdersRealtime(payload);
                })
                .subscribe((status) => {
                    setConn(status === 'SUBSCRIBED');
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        setConn(false);
                    }
                });
        }

        function showKitchenApp() {
            document.getElementById('kitchen-lock').classList.add('hidden');
            document.getElementById('kitchen-app').classList.remove('hidden');
        }

        function showKitchenLock(msg) {
            document.getElementById('kitchen-app').classList.add('hidden');
            document.getElementById('kitchen-lock').classList.remove('hidden');
            const err = document.getElementById('kitchen-login-error');
            if (msg) {
                err.textContent = msg;
                err.classList.remove('hidden');
            } else {
                err.classList.add('hidden');
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            const arr = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
            return arr;
        }

        function isKitchenStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
        }

        function isIOSDevice() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function saveKitchenToken(token) {
            if (!token) return;
            localStorage.setItem(KITCHEN_TOKEN_KEY, token);
            sessionStorage.setItem(KITCHEN_TOKEN_KEY, token);
        }

        function clearKitchenToken() {
            sessionStorage.removeItem(KITCHEN_TOKEN_KEY);
            localStorage.removeItem(KITCHEN_TOKEN_KEY);
            clearSupabaseAccessToken();
        }

        const BOARD_COLUMNS = [
            'order_no', 'display_id', 'store_name', 'customer_name', 'customer_phone',
            'pickup_time', 'items_json', 'total_amount', 'payment_status', 'status',
            'channel', 'pay_method', 'created_at',
        ].join(',');

        async function fetchBoardFromSupabase() {
            const jwt = getSupabaseAccessToken();
            if (!jwt) return null;
            const since = new Date(Date.now() - 36 * 60 * 60 * 1000).toISOString();
            let q = client
                .from('orders')
                .select(BOARD_COLUMNS)
                .gte('created_at', since)
                .order('created_at', { ascending: false })
                .limit(80);
            if (!isAllBranchesView()) {
                q = q.eq('store_name', currentBranch);
            }
            const { data, error } = await q;
            if (error) {
                console.warn('direct board select failed, fallback API:', error.message || error);
                return null;
            }
            return Array.isArray(data) ? data : [];
        }

        function applyBoardRows(rows, { ringNewcomers = true } = {}) {
            const prevKeys = new Set(ordersMap.keys());
            const next = new Map();
            (rows || []).forEach((o) => {
                if (isActiveKitchenOrder(o)) next.set(o.order_no, o);
            });
            const newcomers = [...next.keys()].filter((k) => !prevKeys.has(k));
            ordersMap = next;
            if (ringNewcomers && kitchenBoardReady && newcomers.length) {
                newcomers.forEach((k) => {
                    highlightedOrders.add(k);
                    setTimeout(() => {
                        highlightedOrders.delete(k);
                        renderOrders();
                    }, 8000);
                });
                ringNewOrder();
            }
            kitchenBoardReady = true;
            renderOrders();
        }

        function updatePushNudge() {
            const nudge = document.getElementById('push-nudge');
            if (!nudge) return;
            if (!('Notification' in window)) {
                nudge.classList.add('hidden');
                return;
            }
            const needs = isIOSDevice()
                ? isKitchenStandalone() && Notification.permission !== 'granted'
                : Notification.permission !== 'granted';
            nudge.classList.toggle('hidden', !needs);
        }

        function setPushBtnState(state, detail = '') {
            const btn = document.getElementById('push-btn');
            if (!btn) return;
            if (state === 'on') {
                btn.textContent = t('kitchen.more.push_on');
                btn.classList.add('border-emerald-500', 'text-emerald-200');
            } else if (state === 'busy') {
                btn.textContent = t('kitchen.more.push_busy');
                btn.disabled = true;
            } else if (state === 'unsupported') {
                btn.textContent = detail || t('kitchen.push.use_homescreen');
                btn.disabled = true;
            } else {
                btn.disabled = false;
                btn.textContent = t('kitchen.more.push');
            }
        }

        async function ensureKitchenServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            const reg = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;
            return reg;
        }

        async function enableKitchenPush({ silent } = {}) {
            if (!('Notification' in window) || !('PushManager' in window) || !('serviceWorker' in navigator)) {
                if (!silent) {
                    alert(t('kitchen.alert.push_unsupported'));
                }
                setPushBtnState('unsupported', t('kitchen.push.use_homescreen'));
                return;
            }

            const isStandalone = isKitchenStandalone();
            const isIOS = isIOSDevice();
            if (isIOS && !isStandalone) {
                if (!silent) {
                    alert(t('kitchen.alert.push_ios'));
                }
                setPushBtnState('unsupported', t('kitchen.push.use_homescreen'));
                updatePushNudge();
                return;
            }

            if (silent && Notification.permission !== 'granted') {
                updatePushNudge();
                return;
            }

            if (!silent) setPushBtnState('busy');
            try {
                const perm = Notification.permission === 'granted'
                    ? 'granted'
                    : await Notification.requestPermission();
                if (perm !== 'granted') {
                    if (!silent) alert(t('kitchen.alert.push_denied'));
                    setPushBtnState('off');
                    updatePushNudge();
                    return;
                }

                const keyRes = await fetch('/api/push-vapid-public');
                const keyData = await keyRes.json().catch(() => ({}));
                if (!keyRes.ok || !keyData.publicKey) {
                    throw new Error(keyData.error || t('kitchen.alert.vapid'));
                }

                const reg = await ensureKitchenServiceWorker();
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
                    });
                }

                const saveRes = await fetch('/api/push-subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + (sessionStorage.getItem(KITCHEN_TOKEN_KEY) || localStorage.getItem(KITCHEN_TOKEN_KEY) || '')
                    },
                    body: JSON.stringify({
                        subscription: sub.toJSON(),
                        store_name: isAllBranchesView() ? 'all' : (currentBranch || 'all')
                    })
                });
                const saveData = await saveRes.json().catch(() => ({}));
                if (!saveRes.ok) throw new Error(saveData.error || t('kitchen.alert.sub_fail'));

                localStorage.setItem('mb_kds_push_on', '1');
                setPushBtnState('on');
                updatePushNudge();
            } catch (err) {
                console.error(err);
                if (!silent) alert(t('kitchen.alert.push_fail', { msg: err.message || err }));
                setPushBtnState('off');
                updatePushNudge();
            }
        }

        function bootKitchen() {
            if (kitchenBooted) return;
            kitchenBooted = true;
            closeMoreMenu();
            syncBranchTabs();
            showKitchenApp();
            loadOrders();
            loadStoreStatus();
            startRealtime();
            startHoursSync();
            scheduleOrdersPoll();
            ensureKitchenServiceWorker().catch(() => {});
            updatePushNudge();
            document.addEventListener('visibilitychange', () => {
                scheduleOrdersPoll();
                if (document.visibilityState !== 'visible') return;
                loadOrders();
                if (audioCtx) {
                    audioCtx.resume().then(() => {
                        if (audioCtx.state === 'running') {
                            audioUnlocked = true;
                            const btn = document.getElementById('shift-btn');
                            if (btn) {
                                btn.classList.add('is-on');
                                btn.textContent = t('kitchen.bell.on_done');
                            }
                        }
                    }).catch(() => {});
                }
                if ('Notification' in window && Notification.permission === 'granted') {
                    enableKitchenPush({ silent: true }).catch(() => {});
                }
                updatePushNudge();
            });
            document.getElementById('kitchen-app')?.addEventListener('pointerdown', () => {
                if (!audioUnlocked) unlockKitchenAudio({ quiet: true }).catch(() => {});
            }, { once: false });
            enableKitchenPush({ silent: true }).catch(() => {});
        }

        async function verifyKitchenSession(token) {
            const res = await fetch('/api/kitchen-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            const data = await res.json().catch(() => ({}));
            return {
                ok: res.ok,
                status: res.status,
                token: data.token || '',
                scope: data.scope || 'single_store',
                store_name: data.store_name || '',
                store_id: data.store_id || '',
                supabase_access_token: data.supabase_access_token || '',
                supabase_jwt_ready: !!data.supabase_jwt_ready,
            };
        }

        async function submitKitchenLogin(event) {
            event.preventDefault();
            unlockKitchenAudio({ quiet: true }).catch(() => {});
            const btn = document.getElementById('kitchen-login-btn');
            const err = document.getElementById('kitchen-login-error');
            const password = document.getElementById('kitchen-password').value;
            const store_name = selectedKitchenLoginStore();
            btn.disabled = true;
            btn.textContent = t('kitchen.login.verifying');
            err.classList.add('hidden');
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, store_name })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || t('kitchen.login.wrong'));
                }
                saveKitchenToken(data.token);
                applyKitchenAuth(data);
                bootKitchen();
            } catch (e) {
                err.textContent = e.message || t('kitchen.login.fail');
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = t('kitchen.login.submit');
            }
            return false;
        }

        function logoutKitchen() {
            clearKitchenToken();
            location.reload();
        }


        try { MB_I18N.applyI18n(document); } catch (_) {}
        document.addEventListener('mb:lang', function () {
            try {
                syncBranchTabs();
                lastBoardSig = '';
                renderOrders();
                renderPendingOnline();
                renderStoreStatusBtn();
                if (kitchenMode === 'soldout') {
                    renderSoldOutCats();
                    renderSoldOutGrid();
                }
                const shift = document.getElementById('shift-btn');
                if (shift && audioUnlocked) shift.textContent = t('kitchen.bell.on_done');
                else if (shift) shift.textContent = t('kitchen.bell.on');
                setConn(realtimeOnline);
                if (document.getElementById('completed-panel')?.classList.contains('is-open')) {
                    loadCompletedToday();
                }
                if (document.getElementById('stats-panel')?.classList.contains('is-open')) {
                    loadTodayStats();
                }
            } catch (_) { /* ignore */ }
        });

        window.onload = async () => {
            try { MB_I18N.applyI18n(document); } catch (_) {}
            ensureKitchenServiceWorker().catch(() => {});
            if ('Notification' in window && Notification.permission === 'granted') {
                enableKitchenPush({ silent: true }).catch(() => {});
            }
            const token = sessionStorage.getItem(KITCHEN_TOKEN_KEY) || localStorage.getItem(KITCHEN_TOKEN_KEY);
            if (token) {
                try {
                    const checked = await verifyKitchenSession(token);
                    if (checked.ok) {
                        if (checked.token) saveKitchenToken(checked.token);
                        applyKitchenAuth(checked);
                        bootKitchen();
                        return;
                    }
                    if (checked.status === 401) {
                        clearKitchenToken();
                        showKitchenLock(t('kitchen.login.expired'));
                        return;
                    }
                    saveKitchenToken(token);
                    bootKitchen();
                    return;
                } catch (_) {
                    bootKitchen();
                    return;
                }
            }
            showKitchenLock();
            updatePushNudge();
            document.getElementById('kitchen-password')?.focus();
        };
    </script>
