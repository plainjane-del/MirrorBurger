<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MB Kitchen">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/kitchen-manifest.json">
    <title>Mirror Burger | Kitchen Display System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kds: {
                            bg: '#0a0a0a',
                            panel: '#141414',
                            card: '#1a1a1a',
                            yellow: '#FFD131',
                            border: '#2a2a2a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: "Avenir Next", "Helvetica Neue", "PingFang HK", "Noto Sans TC", sans-serif;
            min-height: 100dvh;
        }
        .order-card {
            animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .order-card.is-new {
            box-shadow: 0 0 0 3px #FFD131, 0 12px 40px rgba(255, 209, 49, 0.25);
        }
        @keyframes popIn {
            from { transform: translateY(-12px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .status-btn {
            min-height: 56px;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
        }
        .status-btn:active { transform: scale(0.97); }
        .status-btn.is-active { outline: 3px solid #FFD131; outline-offset: 2px; }
        .branch-tab {
            min-height: 52px;
            font-weight: 900;
            letter-spacing: 0.02em;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .branch-tab.is-active {
            background: #FFD131;
            color: #0a0a0a;
            border-color: #FFD131;
        }
        .shift-btn {
            min-height: 64px;
            background: #FFD131;
            color: #0a0a0a;
            font-weight: 900;
            letter-spacing: 0.03em;
            border: 4px solid #0a0a0a;
            box-shadow: 0 0 0 3px #FFD131;
            transition: transform 0.12s ease, filter 0.15s ease;
        }
        .shift-btn:active { transform: scale(0.98); }
        .shift-btn.is-on {
            background: #16a34a;
            color: #fff;
            box-shadow: 0 0 0 3px #16a34a;
        }
        .store-status-btn {
            min-height: 64px;
            font-weight: 900;
            letter-spacing: 0.02em;
            border: 4px solid #0a0a0a;
            transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .store-status-btn:active { transform: scale(0.98); }
        .store-status-btn:disabled { opacity: 0.6; cursor: wait; }
        .store-status-btn.is-open {
            background: #16a34a;
            color: #fff;
            box-shadow: 0 0 0 3px #16a34a;
        }
        .store-status-btn.is-closed {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 0 0 3px #dc2626;
        }
        .items-scroll::-webkit-scrollbar { width: 6px; }
        .items-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 999px; }
        #conn-dot.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #conn-dot.offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .wa-notify-btn {
            min-height: 52px;
            background: #22c55e;
            color: #fff;
            font-weight: 900;
            letter-spacing: 0.02em;
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.45);
            transition: transform 0.12s ease, filter 0.15s ease;
        }
        .wa-notify-btn:active { transform: scale(0.97); }
        .wa-notify-btn:hover { filter: brightness(1.08); }
        .wa-notify-btn.is-sent {
            background: #14532d;
            box-shadow: none;
            color: #bbf7d0;
        }
        .history-panel {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
        }
        .history-panel.is-open { display: block; }
        .history-panel-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
        }
        .history-panel-sheet {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: min(420px, 100%);
            background: #141414;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.22s ease;
        }
        .history-panel.is-open .history-panel-sheet { transform: translateX(0); }
        .mode-tab {
            min-height: 52px;
            font-weight: 900;
            font-size: 1.05rem;
            border-radius: 0.9rem;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #a3a3a3;
        }
        .mode-tab.is-active {
            background: #FFD131;
            color: #0a0a0a;
            border-color: #FFD131;
        }
        .board-col {
            background: #101010;
            border: 1px solid #2a2a2a;
            border-radius: 1.25rem;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
        }
        .board-col-h {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #2a2a2a;
            border-radius: 1.25rem 1.25rem 0 0;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .board-col-h.new { background: #422006; color: #fde68a; }
        .board-col-h.prep { background: #0c4a6e; color: #bae6fd; }
        .board-col-h.ready { background: #14532d; color: #bbf7d0; }
        .board-col-body {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1;
            overflow-y: auto;
            max-height: calc(100dvh - 280px);
        }
        .sold-chip {
            min-height: 72px;
            border-radius: 1rem;
            border: 3px solid #333;
            background: #1a1a1a;
            font-weight: 900;
            text-align: left;
            padding: 0.75rem 1rem;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
        }
        .sold-chip:active { transform: scale(0.98); }
        .sold-chip.is-available {
            border-color: #16a34a;
            background: #052e16;
        }
        .sold-chip.is-sold {
            border-color: #dc2626;
            background: #450a0a;
            opacity: 0.95;
        }
    </style>
</head>
<body class="antialiased">

    <div id="kitchen-lock" class="fixed inset-0 z-[100] bg-kds-bg flex items-center justify-center px-6">
        <form id="kitchen-login-form" class="w-full max-w-sm space-y-5" onsubmit="return submitKitchenLogin(event)">
            <div class="text-center space-y-2">
                <img src="https://res.cloudinary.com/dnuhe2uwy/image/upload/v1777801810/logo_only_kqxyfg.png" alt="Mirror Burger" class="h-14 w-auto mx-auto">
                <h1 class="text-2xl font-black text-kds-yellow uppercase tracking-tight">Kitchen Login</h1>
                <p class="text-sm font-bold text-neutral-400">輸入廚房密碼先進入 KDS</p>
                <p class="text-[11px] font-bold text-neutral-600 tracking-widest uppercase">Kitchen · Tablet UI · v2026.08.14</p>
            </div>
            <input id="kitchen-password" type="password" autocomplete="current-password" required
                placeholder="Password"
                class="w-full rounded-2xl bg-kds-card border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-kds-yellow">
            <p id="kitchen-login-error" class="hidden text-sm font-bold text-red-400 text-center"></p>
            <button type="submit" id="kitchen-login-btn"
                class="w-full rounded-2xl bg-kds-yellow text-black py-4 text-base font-black uppercase tracking-widest">
                進入廚房
            </button>
        </form>
    </div>

    <div id="kitchen-app" class="hidden">
    <header class="sticky top-0 z-50 bg-kds-bg/95 backdrop-blur border-b border-kds-border px-4 py-3 md:px-6 md:py-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0">
                    <img src="https://res.cloudinary.com/dnuhe2uwy/image/upload/v1777801810/logo_only_kqxyfg.png" alt="Mirror Burger" class="h-10 w-auto shrink-0">
                    <div class="min-w-0">
                        <h1 class="text-xl md:text-2xl font-black tracking-tight text-kds-yellow uppercase leading-none">Mirror Burger 廚房</h1>
                        <p class="text-xs md:text-sm text-neutral-400 font-bold mt-1 flex items-center gap-2">
                            <span id="conn-dot" class="inline-block w-2.5 h-2.5 rounded-full offline"></span>
                            <span id="conn-label">連線中…</span>
                            <span class="text-neutral-600">·</span>
                            <span id="order-count">0 張活躍單</span>
                        </p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
                <button type="button" onclick="openTodayStats()"
                    class="w-full lg:w-auto px-5 rounded-2xl text-base md:text-lg font-black border-2 border-neutral-600 bg-kds-panel min-h-[64px]">
                    今日統計
                </button>
                <button type="button" onclick="openCompletedToday()"
                    class="w-full lg:w-auto px-5 rounded-2xl text-base md:text-lg font-black border-2 border-neutral-600 bg-kds-panel min-h-[64px]">
                    今日已完成
                </button>
                <button id="store-status-btn" type="button" onclick="toggleStoreStatus()"
                    class="store-status-btn is-closed w-full lg:w-auto px-5 rounded-2xl text-base md:text-lg" disabled>
                    載入中…
                </button>
                <button id="shift-btn" type="button" onclick="unlockKitchenAudio()" class="shift-btn w-full lg:w-auto px-6 rounded-2xl text-base md:text-lg uppercase">
                    開班 / 啟用廚房響鈴
                </button>
                <button id="push-btn" type="button" onclick="enableKitchenPush()"
                    class="w-full lg:w-auto px-5 rounded-2xl text-base md:text-lg font-black border-2 border-sky-600 bg-sky-950 text-sky-200 min-h-[64px]">
                    開啟手機推送
                </button>
                <button type="button" onclick="logoutKitchen()"
                    class="w-full lg:w-auto px-5 rounded-2xl text-base md:text-lg font-black border-2 border-neutral-700 bg-neutral-900 min-h-[64px] text-neutral-300">
                    登出
                </button>
            </div>
        </div>

        <div class="mt-3 grid grid-cols-3 gap-2" role="tablist" aria-label="分店篩選">
            <button type="button" class="branch-tab is-active rounded-xl border-2 border-neutral-700 bg-kds-panel px-2 py-2 text-sm md:text-base" data-branch="Sai Ying Pun" onclick="selectBranch(this)">
                西營盤<br><span class="text-[11px] md:text-xs font-bold opacity-80">Sai Ying Pun</span>
            </button>
            <button type="button" class="branch-tab rounded-xl border-2 border-neutral-700 bg-kds-panel px-2 py-2 text-sm md:text-base" data-branch="Fortress Hill" onclick="selectBranch(this)">
                天后<br><span class="text-[11px] md:text-xs font-bold opacity-80">Fortress Hill</span>
            </button>
            <button type="button" class="branch-tab rounded-xl border-2 border-neutral-700 bg-kds-panel px-2 py-2 text-sm md:text-base" data-branch="Tsuen Wan (Takeaway Only)" onclick="selectBranch(this)">
                荃灣<br><span class="text-[11px] md:text-xs font-bold opacity-80">Tsuen Wan</span>
            </button>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-2" role="tablist" aria-label="廚房模式">
            <button type="button" id="mode-orders" class="mode-tab is-active" onclick="setKitchenMode('orders')">📋 訂單</button>
            <button type="button" id="mode-soldout" class="mode-tab" onclick="setKitchenMode('soldout')">🚫 沽清／賣晒</button>
        </div>
    </header>

    <section id="view-orders" class="p-3 md:p-5">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-4">
            <div class="board-col">
                <div class="board-col-h new">
                    <span>新單 · NEW</span>
                    <span id="count-paid" class="text-sm rounded-full bg-black/30 px-2.5 py-0.5">0</span>
                </div>
                <div id="col-paid" class="board-col-body"></div>
            </div>
            <div class="board-col">
                <div class="board-col-h prep">
                    <span>製作中 · PREP</span>
                    <span id="count-prep" class="text-sm rounded-full bg-black/30 px-2.5 py-0.5">0</span>
                </div>
                <div id="col-prep" class="board-col-body"></div>
            </div>
            <div class="board-col">
                <div class="board-col-h ready">
                    <span>可取餐 · READY</span>
                    <span id="count-ready" class="text-sm rounded-full bg-black/30 px-2.5 py-0.5">0</span>
                </div>
                <div id="col-ready" class="board-col-body"></div>
            </div>
        </div>
    </section>

    <section id="view-soldout" class="hidden p-4 md:p-6">
        <div class="max-w-5xl mx-auto">
            <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-2xl font-black text-kds-yellow">沽清／賣晒</h2>
                    <p class="text-sm font-bold text-neutral-400 mt-1">撳一下即可 · 即時同步顧客網站（同 Admin 同一資料）</p>
                </div>
                <button type="button" onclick="loadSoldOutMenu()" class="px-4 py-3 rounded-xl bg-neutral-800 font-black border border-neutral-600">重新載入</button>
            </div>
            <div class="flex flex-wrap gap-2 mb-4" id="soldout-cat-tabs"></div>
            <p id="soldout-msg" class="text-sm font-bold text-neutral-500 mb-3"></p>
            <div id="soldout-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        </div>
    </section>

    <div id="completed-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeCompletedToday()"></div>
        <aside class="history-panel-sheet" role="dialog" aria-label="今日已完成訂單">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow">今日已完成</h2>
                    <p id="completed-count" class="text-sm font-bold text-neutral-400 mt-0.5">0 張</p>
                </div>
                <button type="button" onclick="closeCompletedToday()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <div id="completed-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </aside>
    </div>

    <div id="stats-panel" class="history-panel" aria-hidden="true">
        <div class="history-panel-backdrop" onclick="closeTodayStats()"></div>
        <aside class="history-panel-sheet" role="dialog" aria-label="今日統計">
            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-kds-border">
                <div>
                    <h2 class="text-xl font-black text-kds-yellow">今日統計</h2>
                    <p class="text-sm font-bold text-neutral-400 mt-0.5">依目前分店</p>
                </div>
                <button type="button" onclick="closeTodayStats()" class="w-11 h-11 rounded-full bg-neutral-800 font-black text-lg">✕</button>
            </div>
            <div id="stats-body" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        </aside>
    </div>
    </div><!-- /#kitchen-app -->

    <script>
        const SUPABASE_URL = 'https://olmoingcxkgdrqezweuf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sbW9pbmdjeGtnZHJxZXp3ZXVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTA4MTMsImV4cCI6MjA5NDY2NjgxM30.FHH8doicN8j1OKtt10BL9LS5Ta5dhLn5mSCF_cQ_pNw';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const KITCHEN_TOKEN_KEY = 'mb_kds_token';
        let kitchenBooted = false;
        // 資料庫未必已有 status 欄；偵測到唔存在就自動退回只用 payment_status
        let hasStatusColumn = true;

        function isMissingStatusColumnError(error) {
            const msg = String(error?.message || error?.details || error || '').toLowerCase();
            return msg.includes('orders.status') || (msg.includes('column') && msg.includes('status') && msg.includes('does not exist'));
        }

        // 廚房活躍狀態：已付款但未完成
        const ACTIVE_STATUSES = ['PAID', 'PREPARING', 'READY'];
        const STATUS_META = {
            PAID:       { label: '新單',     color: 'border-yellow-400',  badge: 'bg-yellow-400 text-black' },
            PREPARING:  { label: '製作中',   color: 'border-sky-400',     badge: 'bg-sky-500 text-white' },
            READY:      { label: '可取餐',   color: 'border-emerald-400', badge: 'bg-emerald-500 text-white' },
            COMPLETED:  { label: '已完成',   color: 'border-neutral-600', badge: 'bg-neutral-600 text-white' }
        };

        let currentBranch = 'Sai Ying Pun';
        let audioUnlocked = false;
        let audioCtx = null;
        const WA_NOTIFIED_KEY = 'mb_kds_wa_notified';
        let waNotifiedSet = loadWaNotifiedSet();

        function loadWaNotifiedSet() {
            try {
                const raw = localStorage.getItem(WA_NOTIFIED_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return new Set(Array.isArray(arr) ? arr : []);
            } catch {
                return new Set();
            }
        }

        function persistWaNotified() {
            try {
                localStorage.setItem(WA_NOTIFIED_KEY, JSON.stringify([...waNotifiedSet]));
            } catch (_) {}
        }

        function markWaNotified(orderNo) {
            waNotifiedSet.add(orderNo);
            persistWaNotified();
        }

        function formatAmount(order) {
            const n = Number(order?.total_amount);
            if (!Number.isFinite(n)) return '—';
            return `HK$${Math.round(n)}`;
        }

        function startOfTodayHK() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Hong_Kong',
                year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const y = parts.find(p => p.type === 'year')?.value;
            const m = parts.find(p => p.type === 'month')?.value;
            const d = parts.find(p => p.type === 'day')?.value;
            // HK midnight as UTC+8
            return new Date(`${y}-${m}-${d}T00:00:00+08:00`).toISOString();
        }
        /** @type {boolean|null} null = 未載入 / 查無資料 */
        let storeIsOpen = null;
        /** @type {Map<string, object>} */
        let ordersMap = new Map();
        const highlightedOrders = new Set();

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /** Escape for single-quoted JS string literals inside HTML onclick="...('...')" */
        function escapeJsString(str) {
            return String(str ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029');
        }

        function getKitchenStatus(order) {
            // 優先用 status；否則用 payment_status（現有資料庫欄位）
            const raw = (order.status || order.payment_status || '').toUpperCase();
            if (raw === 'PAID') return 'PAID';
            if (raw === 'PREPARING') return 'PREPARING';
            if (raw === 'READY') return 'READY';
            if (raw === 'COMPLETED') return 'COMPLETED';
            return raw || 'PAID';
        }

        function getFulfillment(order) {
            const mode = (order.delivery_mode || order.order_type || order.fulfillment || order.mode || 'pickup').toString().toLowerCase();
            if (mode.includes('deliver')) return { label: 'Delivery', zh: '外送', cls: 'bg-orange-500 text-white' };
            return { label: 'Pickup', zh: '自取', cls: 'bg-neutral-700 text-white' };
        }

        function parseItems(order) {
            try {
                if (Array.isArray(order.items_json)) return order.items_json;
                if (typeof order.items_json === 'string') return JSON.parse(order.items_json || '[]');
            } catch (e) {
                console.warn('items_json parse failed', e);
            }
            return [];
        }

        function itemQty(item) {
            return Number(item.qty || item.quantity || 1) || 1;
        }

        function itemName(item) {
            return item.nameZh || item.nameEn || item.name || '項目';
        }

        function itemNotes(item) {
            const parts = [
                item.detailsZh || item.detailsEn || '',
                item.notes || item.note || item.remark || '',
                item.size || '',
                item.temp || ''
            ].map(s => String(s || '').trim()).filter(Boolean);
            return parts.join(' · ');
        }

        /** 整理電話：去 +／空格／符號；純 8 位香港號補 852；已有區號則照用 */
        function normalizeWhatsAppPhone(raw) {
            let formattedPhone = String(raw ?? '').replace(/[^0-9]/g, '');
            if (!formattedPhone) return '';
            // 客人冇揀區號、只填 8 位香港號碼 → 自動補 852
            if (formattedPhone.length === 8) {
                formattedPhone = '852' + formattedPhone;
            }
            // 已包含國家區號（例如 852…、86…）→ 直接使用
            return formattedPhone;
        }

        async function loadTodayStats() {
            const body = document.getElementById('stats-body');
            body.innerHTML = `<p class="text-neutral-500 font-bold py-8 text-center">載入中…</p>`;

            const since = startOfTodayHK();
            const selectCols = hasStatusColumn
                ? 'order_no, total_amount, payment_status, status, created_at'
                : 'order_no, total_amount, payment_status, created_at';

            const { data, error } = await client
                .from('orders')
                .select(selectCols)
                .eq('store_name', currentBranch)
                .gte('created_at', since)
                .limit(500);

            if (error) {
                if (hasStatusColumn && isMissingStatusColumnError(error)) {
                    hasStatusColumn = false;
                    return loadTodayStats();
                }
                console.error(error);
                body.innerHTML = `<p class="text-red-400 font-bold py-8 text-center">載入失敗：${escapeHtml(error.message)}</p>`;
                return;
            }

            const rows = data || [];
            let completed = 0;
            let cancelled = 0;
            let pending = 0;
            let active = 0;
            let paidLike = 0;
            let revenue = 0;

            rows.forEach(o => {
                const pay = String(o.payment_status || '').toUpperCase();
                const st = String(o.status || '').toUpperCase();
                const amt = Number(o.total_amount) || 0;

                if (st === 'COMPLETED' || pay === 'COMPLETED') {
                    completed += 1;
                    revenue += amt;
                    return;
                }
                if (pay === 'CANCELLED' || st === 'CANCELLED') {
                    cancelled += 1;
                    return;
                }
                if (pay === 'PENDING') {
                    pending += 1;
                    return;
                }
                if (isActiveKitchenOrder(o)) {
                    active += 1;
                    paidLike += 1;
                    return;
                }
                if (pay === 'PAID' || ['PREPARING', 'READY'].includes(pay) || ['PREPARING', 'READY', 'PAID'].includes(st)) {
                    paidLike += 1;
                }
            });

            body.innerHTML = [
                statCard('已完成', `${completed} 張`, `營業額約 HK$${Math.round(revenue)}`),
                statCard('廚房進行中', `${active} 張`, '已付款未完成'),
                statCard('已取消 / 未付逾時', `${cancelled} 張`, '含取消同系統清走'),
                statCard('仍待付款', `${pending} 張`, '客人可能仲喺 KPay'),
                statCard('今日總單數', `${rows.length} 張`, `已付款相關約 ${paidLike + completed} 張`)
            ].join('');
        }

        // --- Web Audio：開班解鎖 + 雙重嗶嗶 ---
        async function unlockKitchenAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                // 短促確認音，證明權限已開
                playBeepPair(0.55);
                audioUnlocked = true;
                const btn = document.getElementById('shift-btn');
                btn.classList.add('is-on');
                btn.textContent = '✓ 廚房響鈴已啟用（開班中）';
            } catch (err) {
                console.error('Audio unlock failed', err);
                alert('無法啟用響鈴，請再試一次。');
            }
        }

        function playTone(freq, start, duration, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + duration + 0.02);
        }

        function playBeepPair(volume = 0.85) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const t = audioCtx.currentTime;
            // 嗶嗶 —— 嗶嗶
            playTone(880, t + 0.00, 0.12, volume);
            playTone(880, t + 0.16, 0.12, volume);
            playTone(1046, t + 0.42, 0.12, volume);
            playTone(1046, t + 0.58, 0.12, volume);
        }

        function ringNewOrder() {
            if (!audioUnlocked || !audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => playBeepPair()).catch(() => {});
                return;
            }
            playBeepPair();
        }

        function isActiveKitchenOrder(order) {
            const pay = (order.payment_status || '').toUpperCase();
            const st = (order.status || '').toUpperCase();

            // 未付款 / 取消 / 已完成 → 唔上牆
            if (pay === 'PENDING' || st === 'PENDING') return false;
            if (pay === 'CANCELLED' || st === 'CANCELLED') return false;
            if (st === 'COMPLETED' || pay === 'COMPLETED') return false;

            // 必須已付款：新流程 payment_status=PAID；舊資料可能把廚房狀態寫入 payment_status
            const paidOk = pay === 'PAID' || ACTIVE_STATUSES.includes(pay);
            if (!paidOk) return false;

            // 廚房狀態優先用 status；冇就 fallback payment_status（兼容舊單）
            const kitchen = st || pay;
            return ACTIVE_STATUSES.includes(kitchen);
        }

        async function loadOrders() {
            // 新：payment_status 留 PAID + status 做廚房流程；舊 DB 冇 status 就只用 payment_status
            let query = client
                .from('orders')
                .select('*')
                .eq('store_name', currentBranch);

            query = hasStatusColumn
                ? query.or('payment_status.in.(PAID,PREPARING,READY),status.in.(PAID,PREPARING,READY)')
                : query.in('payment_status', ['PAID', 'PREPARING', 'READY']);

            const { data, error } = await query.order('created_at', { ascending: false });

            if (error) {
                if (hasStatusColumn && isMissingStatusColumnError(error)) {
                    console.warn('orders.status missing → legacy payment_status mode');
                    hasStatusColumn = false;
                    return loadOrders();
                }
                console.error(error);
                const errHtml = `<div class="text-center py-10 text-red-400 font-black text-lg">載入失敗：${escapeHtml(error.message)}</div>`;
                document.getElementById('col-paid').innerHTML = errHtml;
                document.getElementById('col-prep').innerHTML = '';
                document.getElementById('col-ready').innerHTML = '';
                return;
            }

            ordersMap = new Map();
            (data || []).forEach(o => {
                if (isActiveKitchenOrder(o)) ordersMap.set(o.order_no, o);
            });
            renderOrders();
        }

        function upsertOrder(order, { ring = false, highlight = false } = {}) {
            if (!matchesBranch(order)) return;
            
            // 如果此單不符合已付款條件，確保將其從廚房畫面移除
            if (!isActiveKitchenOrder(order)) {
                if (ordersMap.has(order.order_no)) {
                    ordersMap.delete(order.order_no);
                    renderOrders();
                }
                return;
            }
            
            const isNewCard = !ordersMap.has(order.order_no);
            ordersMap.set(order.order_no, order);
            
            if (highlight || isNewCard) {
                highlightedOrders.add(order.order_no);
                setTimeout(() => {
                    highlightedOrders.delete(order.order_no);
                    renderOrders();
                }, 8000);
            }
            
            if (ring && isNewCard) ringNewOrder();
            renderOrders();
        }

                            ${itemsHtml}
                        </div>

                        ${(status === 'READY' || status === 'PREPARING') ? `
                        <button type="button" class="wa-notify-btn ${waSent ? 'is-sent' : ''} w-full rounded-xl px-4 text-base md:text-lg"
                            onclick="notifyCustomerWhatsApp('${orderNoJs}')">
                            ${waSent ? '✓ 已通知（再傳一次）' : '📱 WhatsApp 通知客人'}
                        </button>` : ''}
                    </div>

                    <div class="grid grid-cols-3 gap-2 p-3 md:p-4 bg-black/40 border-t border-neutral-800">
                        <button type="button" class="status-btn rounded-xl bg-sky-600 text-white ${status === 'PREPARING' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'PREPARING')">製作中<br><span class="text-xs font-bold opacity-90">PREPARING</span></button>
                        <button type="button" class="status-btn rounded-xl bg-emerald-600 text-white ${status === 'READY' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'READY')">可取餐<br><span class="text-xs font-bold opacity-90">READY</span></button>
                        <button type="button" class="status-btn rounded-xl bg-neutral-600 text-white ${status === 'COMPLETED' ? 'is-active' : ''}"
                            onclick="updateOrderStatus('${orderNoJs}', 'COMPLETED')">已完成<br><span class="text-xs font-bold opacity-90">COMPLETED</span></button>
                    </div>
                </article>`;
        }

        async function updateOrderStatus(orderNo, nextStatus) {
            let error = null;
            let usedLegacyPaymentStatus = false;

            if (hasStatusColumn) {
                // 正確做法：只改廚房 status；payment_status 保持 PAID
                ({ error } = await client.from('orders').update({ status: nextStatus }).eq('order_no', orderNo));
                if (error && isMissingStatusColumnError(error)) {
                    hasStatusColumn = false;
                    error = null;
                }
            }

            if (!hasStatusColumn) {
                // 舊 DB：暫時仍寫 payment_status（加咗 status 欄之後就唔使）
                usedLegacyPaymentStatus = true;
                ({ error } = await client.from('orders').update({ payment_status: nextStatus }).eq('order_no', orderNo));
            }

            if (error) {
                console.error(error);
                alert('更新狀態失敗：' + error.message + '\n（請喺 Supabase 跑 add-orders-status.sql）');
                return;
            }

            const existing = ordersMap.get(orderNo);
            if (existing) {
                const merged = {
                    ...existing,
                    status: nextStatus,
                    ...(usedLegacyPaymentStatus ? { payment_status: nextStatus } : {})
                };
                if (nextStatus === 'COMPLETED') {
                    ordersMap.delete(orderNo);
                    renderOrders();
                    if (document.getElementById('completed-panel').classList.contains('is-open')) {
                        loadCompletedToday();
                    }
                } else {
                    ordersMap.set(orderNo, merged);
                    renderOrders();
                }
            } else {
                loadOrders();
            }
        }

        let ordersPollTimer = null;
        let realtimeOnline = false;

        function scheduleOrdersPoll() {
            if (ordersPollTimer) clearInterval(ordersPollTimer);
            // Realtime 正常：每 60 秒兜底；斷線：每 10 秒拉一次，減少漏單
            const ms = realtimeOnline ? 60000 : 10000;
            ordersPollTimer = setInterval(() => {
                loadOrders();
                if (document.getElementById('stats-panel')?.classList.contains('is-open')) {
                    loadTodayStats();
                }
            }, ms);
        }

        function setConn(online) {
            realtimeOnline = !!online;
            const dot = document.getElementById('conn-dot');
            const label = document.getElementById('conn-label');
            dot.classList.toggle('online', online);
            dot.classList.toggle('offline', !online);
            label.textContent = online ? 'Realtime 已連接' : '連線中斷（密頻刷新中）';
            scheduleOrdersPoll();
        }

        function handleRealtime(payload) {
            const row = payload.new;
            
            if (!row) {
                if (payload.old && payload.old.order_no) {
                    ordersMap.delete(payload.old.order_no);
                    renderOrders();
                }
                return;
            }

            // 新單 (INSERT)：只有當狀態係「已付款 (PAID)」先會上牆同響鈴
            if (payload.eventType === 'INSERT') {
                if (matchesBranch(row) && isActiveKitchenOrder(row)) {
                    upsertOrder(row, { ring: true, highlight: true });
                }
                return;
            }

            // 狀態更新 (UPDATE)：例如由 PENDING 轉為 PAID 嗰一刻，當作新單響鈴提醒廚房
            if (payload.eventType === 'UPDATE') {
                const prev = payload.old || {};
                const becamePaid =
                    (prev.payment_status || '').toUpperCase() !== 'PAID' &&
                    (row.payment_status || '').toUpperCase() === 'PAID';
                
                const isNewToBoard = becamePaid || (!ordersMap.has(row.order_no) && isActiveKitchenOrder(row));

                if (matchesBranch(row) && isActiveKitchenOrder(row)) {
                    upsertOrder(row, { ring: isNewToBoard, highlight: isNewToBoard });
                } else if (ordersMap.has(row.order_no)) {
                    ordersMap.delete(row.order_no);
                    renderOrders();
                }
            }
        }

        function startRealtime() {
            client
                .channel('kitchen-kds')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, handleRealtime)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, handleRealtime)
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'orders' }, handleRealtime)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'store_settings' }, (payload) => {
                    const row = payload.new;
                    if (!row) return;
                    if ((row.store_name || '') === currentBranch) {
                        storeIsOpen = !!row.is_open;
                        renderStoreStatusBtn();
                    }
                })
                .subscribe((status) => {
                    setConn(status === 'SUBSCRIBED');
                });
        }

        function showKitchenApp() {
            document.getElementById('kitchen-lock').classList.add('hidden');
            document.getElementById('kitchen-app').classList.remove('hidden');
        }

        function showKitchenLock(msg) {
            document.getElementById('kitchen-app').classList.add('hidden');
            document.getElementById('kitchen-lock').classList.remove('hidden');
            const err = document.getElementById('kitchen-login-error');
            if (msg) {
                err.textContent = msg;
                err.classList.remove('hidden');
            } else {
                err.classList.add('hidden');
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            const arr = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
            return arr;
        }

        function setPushBtnState(state, detail = '') {
            const btn = document.getElementById('push-btn');
            if (!btn) return;
            if (state === 'on') {
                btn.textContent = '✓ 手機推送已開啟';
                btn.classList.add('border-emerald-500', 'text-emerald-200');
            } else if (state === 'busy') {
                btn.textContent = '開啟中…';
                btn.disabled = true;
            } else if (state === 'unsupported') {
                btn.textContent = detail || '此裝置不支援推送';
                btn.disabled = true;
            } else {
                btn.disabled = false;
                btn.textContent = '開啟手機推送';
            }
        }

        async function ensureKitchenServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            const reg = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;
            return reg;
        }

        async function enableKitchenPush() {
            if (!('Notification' in window) || !('PushManager' in window) || !('serviceWorker' in navigator)) {
                alert(
                    '此瀏覽器／裝置暫不支援網頁推送。\n\n' +
                    'iPhone：用 Safari 打開本頁 → 分享 → 「加入主畫面」→ 由主畫面圖示開啟 → 再撳呢個掣。\n' +
                    '（iOS 16.4+）'
                );
                setPushBtnState('unsupported', '請用主畫面 App 開啟');
                return;
            }

            // iOS：未加主畫面時 standalone 係 false，推送會唔穩
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS && !isStandalone) {
                alert('iPhone 請先：Safari → 分享 →「加入主畫面」，再用主畫面圖示打開廚房，然後再撳「開啟手機推送」。');
                return;
            }

            setPushBtnState('busy');
            try {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') {
                    alert('你拒絕咗通知權限。可去系統設定重新開啟。');
                    setPushBtnState('off');
                    return;
                }

                const keyRes = await fetch('/api/push-vapid-public');
                const keyData = await keyRes.json().catch(() => ({}));
                if (!keyRes.ok || !keyData.publicKey) {
                    throw new Error(keyData.error || '伺服器尚未設定推送（VAPID）');
                }

                const reg = await ensureKitchenServiceWorker();
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
                    });
                }

                const saveRes = await fetch('/api/push-subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscription: sub.toJSON(),
                        store_name: currentBranch || 'all'
                    })
                });
                const saveData = await saveRes.json().catch(() => ({}));
                if (!saveRes.ok) throw new Error(saveData.error || '儲存訂閱失敗');

                localStorage.setItem('mb_kds_push_on', '1');
                setPushBtnState('on');
                alert('已開啟。之後呢部分店有新付款單，熄芒都應收到通知（視乎系統設定）。');
            } catch (err) {
                console.error(err);
                alert('開啟推送失敗：' + (err.message || err));
                setPushBtnState('off');
            }
        }

        function bootKitchen() {
            if (kitchenBooted) return;
            kitchenBooted = true;
            showKitchenApp();
            loadOrders();
            loadStoreStatus();
            startRealtime();
            scheduleOrdersPoll();
            ensureKitchenServiceWorker().catch(() => {});
            if (localStorage.getItem('mb_kds_push_on') === '1') setPushBtnState('on');
        }

        async function verifyKitchenToken(token) {
            const res = await fetch('/api/kitchen-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            return res.ok;
        }

        async function submitKitchenLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('kitchen-login-btn');
            const err = document.getElementById('kitchen-login-error');
            const password = document.getElementById('kitchen-password').value;
            btn.disabled = true;
            btn.textContent = '驗證中…';
            err.classList.add('hidden');
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || '密碼錯誤');
                }
                sessionStorage.setItem(KITCHEN_TOKEN_KEY, data.token);
                bootKitchen();
            } catch (e) {
                err.textContent = e.message || '登入失敗';
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '進入廚房';
            }
            return false;
        }

        function logoutKitchen() {
            sessionStorage.removeItem(KITCHEN_TOKEN_KEY);
            location.reload();
        }

        window.onload = async () => {
            const token = sessionStorage.getItem(KITCHEN_TOKEN_KEY);
            if (token) {
                try {
                    if (await verifyKitchenToken(token)) {
                        bootKitchen();
                        return;
                    }
                } catch (_) {}
                sessionStorage.removeItem(KITCHEN_TOKEN_KEY);
            }
            showKitchenLock();
            document.getElementById('kitchen-password')?.focus();
        };
    </script>
</body>
</html>
