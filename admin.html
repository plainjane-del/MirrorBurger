<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MB Admin">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="noindex,nofollow">
    <link rel="manifest" href="/admin-manifest.json">
    <link rel="apple-touch-icon" href="/icons/pwa-admin-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-admin-192.png">
    <title>Mirror Burger | 後台</title>
    <script>
        (function () {
            var standalone = window.navigator.standalone === true
                || window.matchMedia('(display-mode: standalone)').matches
                || window.matchMedia('(display-mode: fullscreen)').matches;
            if (standalone) document.documentElement.classList.add('is-standalone');
        })();
    </script>
    <link href="./output.css?v=2.0" rel="stylesheet">
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; }
        input, select, textarea { background: #171717; border: 1px solid #404040; border-radius: 0.75rem; padding: 0.5rem 0.75rem; width: 100%; color: #fff; }
        label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #a3a3a3; display: block; margin-bottom: 0.25rem; }
        .card { background: #141414; border: 1px solid #262626; border-radius: 1rem; }
        .btn { border-radius: 0.75rem; font-weight: 800; padding: 0.6rem 1rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: #fafafa; color: #0a0a0a; }
        .btn-danger { background: #450a0a; color: #fecaca; border: 1px solid #7f1d1d; }
        .btn-ghost { background: #262626; color: #e5e5e5; }
        .tab-on { background: #fafafa; color: #0a0a0a; }
        .tab-off { background: #262626; color: #d4d4d4; }
        .app-shell { min-height: 100vh; }
        .app-nav {
            display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.75rem 1rem;
            border-bottom: 1px solid #262626; background: #0a0a0a;
            -webkit-overflow-scrolling: touch;
        }
        .nav-btn {
            flex: 0 0 auto; border-radius: 0.75rem; font-weight: 800;
            padding: 0.55rem 0.9rem; background: transparent; color: #a3a3a3;
            text-decoration: none;
        }
        .nav-btn.is-on { background: #fafafa; color: #0a0a0a; }
        .range-btn { background: #262626; color: #d4d4d4; }
        .range-btn.is-on { background: #fafafa; color: #0a0a0a; }
        .metric-hero { background: linear-gradient(180deg, #1a1a1a, #141414); }
        .bar-track { height: 8px; background: #262626; border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; }
        .delta-up { color: #6ee7b7; }
        .delta-down { color: #f87171; }
        .delta-flat { color: #a3a3a3; }
        .ticket-row { cursor: pointer; }
        .ticket-row:hover { border-color: #525252; }
        .ticket-sum { position: sticky; bottom: 0; background: #0a0a0a; border-top: 1px solid #262626; padding: 0.85rem 0; font-weight: 800; }
        .quick-btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: 0.7rem 1rem; border-radius: 0.9rem;
            background: #1a1a1a; border: 1px solid #333; font-weight: 800;
            color: #f5f5f5; text-decoration: none;
        }
        .toast {
            position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom));
            transform: translateX(-50%); z-index: 80;
            background: #fafafa; color: #0a0a0a; font-weight: 800;
            padding: 0.7rem 1.1rem; border-radius: 999px;
            box-shadow: 0 8px 30px rgba(0,0,0,.4);
        }
        .store-jump { cursor: pointer; }
        .store-jump:hover { border-color: #525252; }
        html.is-standalone #login-view { padding-top: calc(4rem + env(safe-area-inset-top, 0px)); }
        html.is-standalone .app-nav { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px)); }
        #login-view.hidden,
        #app-view.hidden { display: none !important; }
        @media (min-width: 900px) {
            .app-shell:not(.hidden) { display: flex; }
            .app-nav {
                flex-direction: column; width: 13.5rem; flex-shrink: 0;
                border-bottom: 0; border-right: 1px solid #262626;
                padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh;
            }
            .nav-btn { width: 100%; text-align: left; }
            .app-main { flex: 1; min-width: 0; }
            #nav-brand, #nav-logout { display: block !important; }
            #toolbar-logout { display: none; }
        }
        @media print {
            body { background: #fff; color: #111; }
            #login-view, #app-nav, #app-toolbar,
            #load-err, #load-hint, #panel-sales, #panel-items, #panel-mods, #panel-orders, #ticket-modal, #toast { display: none !important; }
            #panel-tables { display: block !important; }
            #panel-tables .no-print, #table-msg { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="toast" class="toast hidden"></div>

    <script>
        const TOKEN_KEY = 'mb_admin_token';
        let token = localStorage.getItem(TOKEN_KEY) || '';
        let items = [];
        let modifiers = [];
        let editingItemId = null;
        let editingModId = null;

        async function api(path, body) {
            const res = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        let tableStores = [];
        let tableDraft = 0;
        let salesData = null;
        let salesRange = 'today';
        let currentTab = 'sales';
        let ticketRows = [];
        let ticketsData = null;

        const CAT_ZH = { beef: '牛肉', others: '其他漢堡', veggie: '素食', snacks: '小食', drinks: '飲品', sauces: '醬' };
        const KIND_ZH = { addon: '加料', sauce: '醬', combo_snack: '套餐小食', combo_drink: '套餐飲品' };

        let toastTimer = null;
        function toast(msg) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
        }

        const PAGE_META = {
            sales: { title: '概况', sub: '今日實收 · 堂食／外賣 · 客單價' },
            items: { title: '菜品', sub: '改名稱、價錢、上下架' },
            tables: { title: '枱 QR', sub: '每間店加枱同印 QR' },
            orders: { title: '訂單', sub: '搜單號 · 揀店 · 撳開睇餐' },
        };

        async function boot() {
            if (!token) return showLogin();
            try {
                await api('/api/admin-login', { token });
                showApp();
                await loadAll();
                loadSales().catch(() => {});
                loadTables().catch(() => {});
            } catch {
                logout();
            }
        }

        function showLogin() {
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('app-view').classList.add('hidden');
        }
        function showApp() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
        }

        async function loadAll() {
            const errEl = document.getElementById('load-err');
            const hintEl = document.getElementById('load-hint');
            errEl.classList.add('hidden');
            hintEl.textContent = '載入中…';
            try {
                const data = await api('/api/admin-menu', { token, action: 'list' });
                items = data.items || [];
                modifiers = data.modifiers || [];
                hintEl.textContent = `共 ${items.length} 個餐點 · ${modifiers.length} 個加料／套餐選項`;
                hintEl.classList.toggle('hidden', currentTab !== 'items');
                if (!items.length) {
                    errEl.textContent =
                        '資料庫未有餐點。請去 Supabase → SQL Editor 跑 supabase/menu-full.sql（同 restore-menu-prices.sql），再撳「重新載入」。';
                    errEl.classList.toggle('hidden', currentTab !== 'items');
                }
                renderItems();
                renderMods();
            } catch (e) {
                items = [];
                modifiers = [];
                renderItems();
                renderMods();
                hintEl.textContent = '';
                errEl.textContent = '載入失敗：' + (e.message || e) +
                    ' — 多數係未跑 menu-full.sql，或者 Vercel 未設 SUPABASE_URL / SUPABASE_KEY。';
                errEl.classList.remove('hidden');
            }
        }

        async function doLogin() {
            const err = document.getElementById('login-err');
            err.classList.add('hidden');
            try {
                const data = await api('/api/admin-login', {
                    password: document.getElementById('login-pass').value,
                });
                token = data.token;
                localStorage.setItem(TOKEN_KEY, token);
                showApp();
                await loadAll();
                loadSales().catch(() => {});
                loadTables().catch(() => {});
            } catch (e) {
                err.textContent = e.message;
                err.classList.remove('hidden');
            }
        }

        function logout() {
            token = '';
            localStorage.removeItem(TOKEN_KEY);
            showLogin();
        }

        function refreshCurrent() {
            if (currentTab === 'sales') return loadSales();
            if (currentTab === 'orders') return loadTickets();
            if (currentTab === 'tables') return loadTables();
            return loadAll();
        }

        function setTab(which) {
            currentTab = which;
            const meta = PAGE_META[which] || PAGE_META.sales;
            document.getElementById('page-title').textContent = meta.title;
            document.getElementById('page-sub').textContent = meta.sub;
            ['sales', 'items', 'tables', 'orders'].forEach((name) => {
                const panel = document.getElementById('panel-' + name);
                const tab = document.getElementById('tab-' + name);
                if (panel) panel.classList.toggle('hidden', name !== which);
                if (tab) tab.className = 'nav-btn' + (name === which ? ' is-on' : '');
            });
            const hintEl = document.getElementById('load-hint');
            if (hintEl) hintEl.classList.toggle('hidden', which !== 'items');
            const errEl = document.getElementById('load-err');
            if (errEl && items.length) errEl.classList.add('hidden');
            if (which === 'sales') {
                if (salesData) renderSales();
                loadSales();
            }
            if (which === 'orders') {
                if (ticketsData) renderTickets(ticketsData);
                loadTickets();
            }
            if (which === 'tables') loadTables();
        }

        function setMenuSub(which) {
            document.getElementById('items-section').classList.toggle('hidden', which !== 'items');
            document.getElementById('mods-section').classList.toggle('hidden', which !== 'mods');
            document.getElementById('sub-items').className = 'btn ' + (which === 'items' ? 'tab-on' : 'tab-off');
            document.getElementById('sub-mods').className = 'btn ' + (which === 'mods' ? 'tab-on' : 'tab-off');
        }

        function setTicketRange(which, opts) {
            const next = which === 'yesterday' ? 'yesterday' : (which === 'week' ? 'week' : 'today');
            document.getElementById('ticket-range').value = next;
            document.getElementById('tr-today').classList.toggle('is-on', next === 'today');
            document.getElementById('tr-yesterday').classList.toggle('is-on', next === 'yesterday');
            document.getElementById('tr-week').classList.toggle('is-on', next === 'week');
            if (!opts || opts.load !== false) loadTickets();
        }

        function openStoreOrders(storeName) {
            ticketsData = null;
            document.getElementById('ticket-store').value = storeName || '';
            setTicketRange(salesRange === 'yesterday' ? 'yesterday' : 'today', { load: false });
            setTab('orders');
        }

        function setSalesRange(which) {
            salesRange = which === 'yesterday' ? 'yesterday' : 'today';
            document.getElementById('range-today').classList.toggle('is-on', salesRange === 'today');
            document.getElementById('range-yesterday').classList.toggle('is-on', salesRange === 'yesterday');
            renderSales();
        }

        function money(n) {
            return 'HK$' + Number(n || 0);
        }

        function pctBar(part, total) {
            if (!total) return 0;
            return Math.max(0, Math.min(100, Math.round((part / total) * 100)));
        }

        function deltaHtml(current, previous) {
            const diff = Number(current || 0) - Number(previous || 0);
            if (!previous && !current) return '<span class="delta-flat">對比昨日 —</span>';
            if (!previous) return '<span class="delta-up">新開數</span>';
            const pct = Math.round((diff / previous) * 100);
            const cls = diff > 0 ? 'delta-up' : (diff < 0 ? 'delta-down' : 'delta-flat');
            const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '•');
            const sign = diff > 0 ? '+' : '';
            return `<span class="${cls}">${arrow} 對比昨日 ${sign}${diff}（${sign}${pct}%）</span>`;
        }

        function hkTime(iso) {
            if (!iso) return '';
            try {
                return new Date(iso).toLocaleTimeString('zh-HK', {
                    timeZone: 'Asia/Hong_Kong',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false,
                });
            } catch {
                return '';
            }
        }

        function renderSales() {
            const sum = document.getElementById('sales-summary');
            const list = document.getElementById('sales-stores');
            const data = salesData;
            if (!data) {
                if (sum) sum.innerHTML = '<p class="text-neutral-500">載入中…</p>';
                return;
            }
            const current = salesRange === 'yesterday' ? (data.yesterday || {}) : (data.today || data);
            const compare = salesRange === 'today' ? (data.yesterday || {}) : null;
            const dine = current.dine_in || { orders: 0, revenue: 0 };
            const take = current.takeaway || { orders: 0, revenue: 0 };
            const dinePct = pctBar(dine.orders, current.orders);
            const takePct = pctBar(take.orders, current.orders);
            const compareLine = compare
                ? deltaHtml(current.revenue, compare.revenue)
                : '<span class="delta-flat">昨日實收</span>';

            const empty = !Number(current.orders);
            const rangeLabel = salesRange === 'yesterday' ? '昨日' : '今日';
            if (empty) {
                sum.innerHTML = `
                    <div class="card metric-hero p-6 mb-4">
                        <div class="text-xs font-black tracking-widest text-neutral-500 uppercase">營業實收</div>
                        <div class="text-5xl font-black mt-2 tracking-tight">${money(0)}</div>
                        <div class="text-sm font-bold text-neutral-400 mt-2">${rangeLabel}未有收款</div>
                    </div>`;
            } else {
            sum.innerHTML = `
                <div class="card metric-hero p-6 mb-4">
                    <div class="text-xs font-black tracking-widest text-neutral-500 uppercase">營業實收</div>
                    <div class="text-5xl font-black mt-2 tracking-tight">${money(current.revenue)}</div>
                    <div class="text-sm font-bold mt-2">${compareLine}</div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="card p-4">
                        <div class="text-xs font-black tracking-widest text-neutral-500 uppercase">訂單總數</div>
                        <div class="text-3xl font-black mt-2">${Number(current.orders || 0)}</div>
                        ${compare ? `<div class="text-xs font-bold mt-1">${deltaHtml(current.orders, compare.orders)}</div>` : ''}
                    </div>
                    <div class="card p-4">
                        <div class="text-xs font-black tracking-widest text-neutral-500 uppercase">客單價</div>
                        <div class="text-3xl font-black mt-2">${money(current.aov)}</div>
                        ${compare ? `<div class="text-xs font-bold mt-1">${deltaHtml(current.aov, compare.aov)}</div>` : ''}
                    </div>
                </div>
                <div class="card p-5">
                    <div class="text-xs font-black tracking-widest text-neutral-500 uppercase mb-3">堂食／外賣</div>
                    <div class="flex justify-between text-sm font-bold mb-1">
                        <span>堂食 ${Number(dine.orders)} 張 · ${money(dine.revenue)}</span>
                        <span class="text-neutral-500">${dinePct}%</span>
                    </div>
                    <div class="bar-track mb-4"><div class="bar-fill" style="width:${dinePct}%;background:#fbbf24"></div></div>
                    <div class="flex justify-between text-sm font-bold mb-1">
                        <span>外賣 ${Number(take.orders)} 張 · ${money(take.revenue)}</span>
                        <span class="text-neutral-500">${takePct}%</span>
                    </div>
                    <div class="bar-track"><div class="bar-fill" style="width:${takePct}%;background:#60a5fa"></div></div>
                </div>`;
            }

            const storeRows = (data.stores || []).map((s) => {
                const block = salesRange === 'yesterday' ? (s.yesterday || {}) : s;
                const sDine = block.dine_in || { orders: 0 };
                const sTake = block.takeaway || { orders: 0 };
                return `<button type="button" class="card store-jump p-4 w-full text-left flex flex-wrap items-center justify-between gap-3" onclick="openStoreOrders('${escAttr(s.store_name)}')">
                    <div>
                        <div class="font-black">${esc(s.label)}</div>
                        <div class="text-xs font-bold text-neutral-500 mt-1">堂食 ${Number(sDine.orders)} · 外賣 ${Number(sTake.orders)} · 撳入睇單</div>
                    </div>
                    <div class="text-sm font-bold text-neutral-300">${Number(block.orders || 0)} 張 · ${money(block.revenue)}</div>
                </button>`;
            }).join('');
            list.innerHTML = storeRows || '<p class="text-neutral-500">呢段時間未有收款</p>';
        }

        async function loadSales() {
            const sum = document.getElementById('sales-summary');
            if (sum && !salesData) sum.innerHTML = '<p class="text-neutral-500">載入中…</p>';
            try {
                salesData = await api('/api/admin-menu', { token, action: 'sales_overview' });
                renderSales();
            } catch (e) {
                salesData = null;
                if (sum) sum.innerHTML = '';
                document.getElementById('sales-stores').innerHTML =
                    `<p class="text-red-400 text-sm">載入失敗：${esc(e.message || e)}</p>`;
            }
        }

        const PAY_LABEL = { cash: '現金', fps: '轉數快', payme: 'PayMe', card: '卡機', kpay: 'KPay' };
        const STATUS_LABEL = { paid: '已收款', pending: '等付款', unpaid: '未付', cancelled: '已取消', other: '' };

        function hkWhen(iso, withDate) {
            if (!iso) return '';
            try {
                const opts = {
                    timeZone: 'Asia/Hong_Kong',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false,
                };
                if (withDate) {
                    opts.month = '2-digit';
                    opts.day = '2-digit';
                }
                return new Date(iso).toLocaleString('zh-HK', opts);
            } catch {
                return '';
            }
        }

        function payLabel(method) {
            const key = String(method || '').toLowerCase();
            return PAY_LABEL[key] || method || '';
        }

        function renderTickets(data) {
            const list = document.getElementById('orders-list');
            const sum = document.getElementById('orders-sum');
            const msg = document.getElementById('orders-msg');
            ticketRows = data.tickets || [];
            const q = data.q || '';
            const range = data.range || 'today';
            const rangeZh = range === 'yesterday' ? '昨日' : (range === 'week' ? '近 7 日' : '今日');
            msg.textContent = q
                ? (ticketRows.length ? `搵到 ${ticketRows.length} 張（單號含 ${q}）` : `搵唔到 ${q}`)
                : '已收款先計入合計；撳一張睇餐。';
            list.innerHTML = ticketRows.length
                ? ticketRows.map((o, i) => {
                    const kind = o.kind === 'dine_in' ? '堂食' : '外賣';
                    const st = STATUS_LABEL[o.status] || '';
                    const pay = payLabel(o.pay_method);
                    const when = hkWhen(o.created_at, range === 'week' || !!q);
                    return `<button type="button" class="card ticket-row p-4 w-full text-left flex flex-wrap items-center justify-between gap-3" onclick="openTicket(${i})">
                        <div>
                            <div class="font-black">#${esc(o.order_no)} · ${esc(o.label)}</div>
                            <div class="text-xs font-bold text-neutral-500 mt-1">${esc(when)} · ${kind}${o.pickup_time ? ' · ' + esc(o.pickup_time) : ''}${pay ? ' · ' + esc(pay) : ''}${st && o.status !== 'paid' ? ' · ' + st : ''}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-black">${money(o.total_amount)}</div>
                            <div class="text-xs font-bold text-neutral-500">${Number(o.item_count || 0)} 件</div>
                        </div>
                    </button>`;
                }).join('')
                : '<p class="text-neutral-500">呢段時間未有單</p>';
            if (ticketRows.length) {
                sum.classList.remove('hidden');
                sum.textContent = `${rangeZh} · ${Number(data.orders || 0)} 張 · ${money(data.revenue)}`;
            } else {
                sum.classList.add('hidden');
                sum.textContent = '';
            }
        }

        async function loadTickets() {
            const list = document.getElementById('orders-list');
            const msg = document.getElementById('orders-msg');
            if (list && !ticketsData) list.innerHTML = '<p class="text-neutral-500">載入中…</p>';
            if (msg && !ticketsData) msg.textContent = '';
            try {
                const data = await api('/api/admin-menu', {
                    token,
                    action: 'sales_tickets',
                    range: document.getElementById('ticket-range').value,
                    store_name: document.getElementById('ticket-store').value,
                    q: document.getElementById('ticket-q').value,
                });
                ticketsData = data;
                renderTickets(data);
            } catch (e) {
                ticketRows = [];
                ticketsData = null;
                if (list) list.innerHTML = `<p class="text-red-400 text-sm">載入失敗：${esc(e.message || e)}</p>`;
            }
        }

        function openTicket(i) {
            const o = ticketRows[i];
            if (!o) return;
            document.getElementById('ticket-title').textContent = '#' + o.order_no;
            const bits = [
                o.label,
                o.kind === 'dine_in' ? '堂食' : '外賣',
                o.pickup_time,
                payLabel(o.pay_method),
                o.customer_name,
                hkWhen(o.created_at, true),
            ].filter(Boolean);
            document.getElementById('ticket-meta').textContent = bits.join(' · ');
            document.getElementById('ticket-total').textContent = money(o.total_amount);
            const lines = (o.items || []).map((it) => `
                <div class="flex justify-between gap-3 text-sm">
                    <div>
                        <div class="font-bold">${Number(it.qty)}× ${esc(it.name)}</div>
                        ${it.notes ? `<div class="text-xs text-neutral-500">${esc(it.notes)}</div>` : ''}
                    </div>
                </div>`).join('');
            document.getElementById('ticket-items').innerHTML = lines || '<p class="text-neutral-500 text-sm">冇餐點明細</p>';
            document.getElementById('ticket-modal').classList.remove('hidden');
        }

        function closeTicket() {
            document.getElementById('ticket-modal').classList.add('hidden');
        }

        async function loadTables() {
            const sel = document.getElementById('table-store');
            const data = await api('/api/admin-menu', { token, action: 'table_counts' });
            tableStores = data.stores || [];
            const prev = sel.value;
            sel.innerHTML = tableStores.map((s) =>
                `<option value="${escAttr(s.store_name)}">${esc(s.label)}（${Number(s.count)} 張）</option>`
            ).join('');
            if (prev && tableStores.some((s) => s.store_name === prev)) sel.value = prev;
            onTableStoreChange();
        }

        function selectedTableStore() {
            return tableStores.find((s) => s.store_name === document.getElementById('table-store').value) || tableStores[0];
        }

        function onTableStoreChange() {
            const store = selectedTableStore();
            tableDraft = Number(store && store.count) || 0;
            document.getElementById('table-count').value = tableDraft;
            previewTableQr();
        }

        function nudgeTables(delta) {
            tableDraft = Math.max(0, Math.min(40, tableDraft + delta));
            document.getElementById('table-count').value = tableDraft;
            previewTableQr();
        }

        function previewTableQr() {
            const store = selectedTableStore();
            const n = Math.max(0, Math.min(40, Number(document.getElementById('table-count').value) || 0));
            tableDraft = n;
            const grid = document.getElementById('table-qr-grid');
            const msg = document.getElementById('table-msg');
            if (!store || n < 1) {
                grid.innerHTML = '<p class="text-neutral-500">呢間店枱數係 0。撳 ＋ 加枱，再儲存。</p>';
                if (msg) msg.textContent = '';
                return;
            }
            const origin = location.origin.replace(/\/$/, '') || 'https://mirrorburger.com';
            const label = store.label || store.store_name;
            const slug = store.slug || 'syp';
            if (msg) msg.textContent = `儲存後客人掃 ${origin}/t/${slug}/1 至 /${n}`;
            grid.innerHTML = Array.from({ length: n }, (_, i) => {
                const num = i + 1;
                const url = `${origin}/t/${slug}/${num}`;
                const qr = `https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=8&data=${encodeURIComponent(url)}`;
                return `<article class="card p-5 text-center">
                    <div class="text-[11px] font-black tracking-widest uppercase text-neutral-400">Mirror Burger · ${esc(label)}</div>
                    <img src="${qr}" alt="${num}號枱" width="200" height="200" class="mx-auto my-3">
                    <div class="text-4xl font-black">${num}號枱</div>
                    <div class="text-xs font-bold text-neutral-500 mt-1">掃碼點餐 · 櫃檯付款</div>
                    <div class="text-[11px] font-bold text-neutral-600 break-all mt-2">${esc(url)}</div>
                </article>`;
            }).join('');
        }

        async function saveTableCount() {
            const store = selectedTableStore();
            if (!store) return;
            const count = Math.max(0, Math.min(40, Number(document.getElementById('table-count').value) || 0));
            await api('/api/admin-menu', {
                token,
                action: 'set_table_count',
                store_name: store.store_name,
                count,
            });
            await loadTables();
            document.getElementById('table-msg').textContent = '已儲存 ' + store.label + ' · ' + count + ' 張枱';
            toast('已儲存 ' + store.label + ' · ' + count + ' 張枱');
        }

        function renderItems() {
            const cat = document.getElementById('filter-cat').value;
            const list = document.getElementById('items-list');
            const rows = items.filter((i) => !cat || i.category === cat);
            list.innerHTML = rows.map((i) => `
                <div class="card p-4 flex flex-wrap gap-3 justify-between items-center">
                    <div class="min-w-0 flex-1">
                        <div class="font-black truncate">${esc(i.name_zh || i.name_en)} <span class="text-neutral-500 font-semibold text-xs">${esc(i.id)}</span></div>
                        <div class="text-sm text-neutral-400">$${Number(i.price)} · ${esc(CAT_ZH[i.category] || i.category)}
                            ${i.is_sold_out ? ' · <span class="text-amber-400">賣晒</span>' : ''}
                            ${i.is_active === false ? ' · <span class="text-red-400">已下架</span>' : ''}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" class="btn btn-ghost text-sm" onclick="toggleSold('${escAttr(i.id)}')">${i.is_sold_out ? '恢復供應' : '賣晒'}</button>
                        <button type="button" class="btn btn-ghost text-sm" onclick="editItem('${escAttr(i.id)}')">編輯</button>
                        <button type="button" class="btn btn-danger text-sm" onclick="removeItem('${escAttr(i.id)}')">刪除</button>
                    </div>
                </div>
            `).join('') || '<p class="text-neutral-500">冇項目</p>';
        }

        function renderMods() {
            const kind = document.getElementById('filter-kind').value;
            const list = document.getElementById('mods-list');
            const rows = modifiers.filter((m) => !kind || m.kind === kind);
            list.innerHTML = rows.map((m) => `
                <div class="card p-4 flex flex-wrap gap-3 justify-between items-center">
                    <div>
                        <div class="font-black">${esc(m.name_zh || m.name_en)} <span class="text-neutral-500 text-xs">${esc(m.id)}</span></div>
                        <div class="text-sm text-neutral-400">${esc(KIND_ZH[m.kind] || m.kind)} · +$${Number(m.price)}
                            ${m.is_active === false ? ' · 已下架' : ''}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" class="btn btn-ghost text-sm" onclick="editMod('${escAttr(m.id)}')">編輯</button>
                        <button type="button" class="btn btn-danger text-sm" onclick="removeMod('${escAttr(m.id)}')">刪除</button>
                    </div>
                </div>
            `).join('') || '<p class="text-neutral-500">冇選項</p>';
        }

        function esc(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        function escAttr(s) {
            return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        }

        function editItem(id) {
            editingItemId = id;
            const i = id ? items.find((x) => x.id === id) : null;
            document.getElementById('item-modal-title').textContent = i ? '編輯項目' : '新增項目';
            document.getElementById('f-id').value = i?.id || '';
            document.getElementById('f-id').disabled = !!i;
            document.getElementById('f-cat').value = i?.category || 'beef';
            document.getElementById('f-name-en').value = i?.name_en || '';
            document.getElementById('f-name-zh').value = i?.name_zh || '';
            document.getElementById('f-price').value = i?.price ?? '';
            document.getElementById('f-sort').value = i?.sort_order ?? 0;
            document.getElementById('f-desc-en').value = i?.desc_en || '';
            document.getElementById('f-desc-zh').value = i?.desc_zh || '';
            document.getElementById('f-img').value = i?.img || '';
            document.getElementById('f-tag-en').value = i?.tag_en || '';
            document.getElementById('f-tag-zh').value = i?.tag_zh || '';
            document.getElementById('f-dietary').value = JSON.stringify(i?.dietary || []);
            document.getElementById('f-sizes').value = i?.sizes ? JSON.stringify(i.sizes) : '';
            document.getElementById('f-sold').checked = !!i?.is_sold_out;
            document.getElementById('f-active').checked = i ? i.is_active !== false : true;
            document.getElementById('f-side').checked = !!i?.is_side;
            document.getElementById('f-temp').checked = !!i?.has_temp;
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeItemModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        async function saveItem() {
            let dietary = [];
            let sizes = null;
            try { dietary = JSON.parse(document.getElementById('f-dietary').value || '[]'); } catch { alert('Dietary JSON 無效'); return; }
            const sizesRaw = document.getElementById('f-sizes').value.trim();
            if (sizesRaw) {
                try { sizes = JSON.parse(sizesRaw); } catch { alert('Sizes JSON 無效'); return; }
            }
            const item = {
                id: document.getElementById('f-id').value.trim(),
                category: document.getElementById('f-cat').value,
                name_en: document.getElementById('f-name-en').value.trim(),
                name_zh: document.getElementById('f-name-zh').value.trim(),
                price: Number(document.getElementById('f-price').value),
                sort_order: Number(document.getElementById('f-sort').value) || 0,
                desc_en: document.getElementById('f-desc-en').value,
                desc_zh: document.getElementById('f-desc-zh').value,
                img: document.getElementById('f-img').value.trim(),
                tag_en: document.getElementById('f-tag-en').value.trim() || null,
                tag_zh: document.getElementById('f-tag-zh').value.trim() || null,
                dietary,
                sizes,
                is_sold_out: document.getElementById('f-sold').checked,
                is_active: document.getElementById('f-active').checked,
                is_side: document.getElementById('f-side').checked,
                has_temp: document.getElementById('f-temp').checked,
            };
            if (!item.id || !item.name_zh || !Number.isFinite(item.price)) {
                alert('請填編號、中文名、價錢');
                return;
            }
            if (!item.name_en) item.name_en = item.name_zh;
            await api('/api/admin-menu', { token, action: 'upsert_item', item });
            closeItemModal();
            await loadAll();
            toast('已儲存');
        }

        async function toggleSold(id) {
            const i = items.find((x) => x.id === id);
            if (!i) return;
            await api('/api/admin-menu', {
                token,
                action: 'upsert_item',
                item: { ...i, is_sold_out: !i.is_sold_out },
            });
            await loadAll();
            toast(i.is_sold_out ? '已恢復供應' : '已標賣晒');
        }

        async function removeItem(id) {
            if (!confirm('刪除 ' + id + '？')) return;
            await api('/api/admin-menu', { token, action: 'delete_item', id });
            await loadAll();
            toast('已刪除');
        }

        function editMod(id) {
            editingModId = id;
            const m = id ? modifiers.find((x) => x.id === id) : null;
            document.getElementById('mod-modal-title').textContent = m ? '編輯選項' : '新增選項';
            document.getElementById('m-id').value = m?.id || '';
            document.getElementById('m-id').disabled = !!m;
            document.getElementById('m-kind').value = m?.kind || 'addon';
            document.getElementById('m-name-en').value = m?.name_en || '';
            document.getElementById('m-name-zh').value = m?.name_zh || '';
            document.getElementById('m-price').value = m?.price ?? 0;
            document.getElementById('m-sort').value = m?.sort_order ?? 0;
            document.getElementById('m-active').checked = m ? m.is_active !== false : true;
            document.getElementById('mod-modal').classList.remove('hidden');
        }

        function closeModModal() {
            document.getElementById('mod-modal').classList.add('hidden');
        }

        async function saveMod() {
            const modifier = {
                id: document.getElementById('m-id').value.trim(),
                kind: document.getElementById('m-kind').value,
                name_en: document.getElementById('m-name-en').value.trim(),
                name_zh: document.getElementById('m-name-zh').value.trim(),
                price: Number(document.getElementById('m-price').value) || 0,
                sort_order: Number(document.getElementById('m-sort').value) || 0,
                is_active: document.getElementById('m-active').checked,
            };
            if (!modifier.id || !modifier.name_zh) {
                alert('請填編號同中文名');
                return;
            }
            if (!modifier.name_en) modifier.name_en = modifier.name_zh;
            await api('/api/admin-menu', { token, action: 'upsert_modifier', modifier });
            closeModModal();
            await loadAll();
            toast('已儲存');
        }

        async function removeMod(id) {
            if (!confirm('刪除 ' + id + '？')) return;
            await api('/api/admin-menu', { token, action: 'delete_modifier', id });
            await loadAll();
            toast('已刪除');
        }

        boot();
        try { if (navigator.serviceWorker) navigator.serviceWorker.register('/sw.js'); } catch (_) {}
    </script>
</body>
</html>
