<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Mirror Burger · AI 開支</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; }
        .card { background: #141414; border: 1px solid #262626; border-radius: 1rem; }
        .btn {
            border-radius: 0.75rem; font-weight: 800; padding: 0.75rem 1rem;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-primary { background: #FFD131; color: #0a0a0a; }
        .btn-ghost { background: #262626; color: #e5e5e5; }
        .btn:disabled { opacity: 0.45; }
        select, input[type="password"] {
            background: #171717; border: 1px solid #404040; border-radius: 0.75rem;
            padding: 0.65rem 0.85rem; width: 100%; color: #fff;
        }
        label.field {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
            text-transform: uppercase; color: #a3a3a3; display: block; margin-bottom: 0.35rem;
        }
        .scan-stage {
            position: relative; aspect-ratio: 3/4; border-radius: 1rem;
            overflow: hidden; background: #050505; border: 1px solid #262626;
        }
        .scan-stage video, .scan-stage #preview {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; background: #050505;
        }
        .scan-stage #preview { object-fit: contain; z-index: 3; }
        .guide {
            pointer-events: none; position: absolute; inset: 10% 8%; z-index: 2;
            border: 2px solid rgba(255,209,49,.9); border-radius: 12px;
            box-shadow: 0 0 0 999px rgba(0,0,0,.35);
        }
        .badge {
            position: absolute; left: 50%; bottom: .75rem; transform: translateX(-50%);
            z-index: 4; background: rgba(0,0,0,.75); color: #FFD131;
            font-size: .72rem; font-weight: 800; padding: .4rem .75rem;
            border-radius: 999px; white-space: nowrap;
        }
        .badge.ok { color: #0a0a0a; background: #FFD131; }
        .actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: .5rem; }
        .file-btn { cursor: pointer; }
        .file-btn input { display: none; }
        #detect { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body class="min-h-screen px-4 py-8">
    <div class="max-w-md mx-auto space-y-5">
        <header class="space-y-1">
            <p class="text-xs font-black tracking-widest text-neutral-500 uppercase">AI CFO</p>
            <h1 class="text-2xl font-black">開支記錄</h1>
            <p class="text-sm text-neutral-400 font-bold">對準收據 → 企穩自動影 → AI 讀金額</p>
            <p class="text-[10px] font-bold text-emerald-500" id="build-tag">build mobile-lite v3</p>
        </header>

        <div id="lock" class="card p-5 space-y-4">
            <div>
                <label class="field">後台／廚房密碼</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="同 admin / kitchen 密碼">
            </div>
            <button type="button" class="btn btn-primary w-full" id="login-btn" onclick="doLogin()">登入</button>
            <p id="login-err" class="text-sm text-red-400 hidden"></p>
        </div>

        <div id="app" class="hidden space-y-4">
            <div class="card p-5 space-y-4">
                <div>
                    <label class="field">分店</label>
                    <select id="store_id">
                        <option value="SYP">西營盤 SYP</option>
                        <option value="TH">天后 TH</option>
                        <option value="TW">荃灣 TW</option>
                    </select>
                </div>

                <div class="scan-stage">
                    <video id="video" playsinline muted autoplay></video>
                    <div class="guide" id="guide"></div>
                    <img id="preview" class="hidden" alt="">
                    <div class="badge" id="badge">開緊鏡頭…</div>
                </div>
                <canvas id="detect"></canvas>

                <div class="actions">
                    <button type="button" class="btn btn-primary" id="btn-scan" onclick="manualCapture()" disabled>即刻掃描</button>
                    <label class="btn btn-ghost file-btn">相簿<input id="file" type="file" accept="image/*" onchange="onPick(event)"></label>
                </div>
                <button type="button" class="btn btn-ghost w-full" id="btn-rescan" onclick="restartScan()" disabled>再開鏡頭</button>
                <p id="status" class="text-sm font-bold text-neutral-400"></p>
                <div id="result" class="hidden space-y-2 text-sm font-bold"></div>
            </div>
            <button type="button" class="btn btn-ghost w-full" onclick="logout()">登出</button>
        </div>
    </div>

    <script>
        // Kill stale SW/cache so phones stop serving old expense HTML.
        (function nukeCache() {
            try {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then((regs) => {
                        regs.forEach((r) => r.unregister());
                    });
                }
                if (window.caches && caches.keys) {
                    caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
                }
            } catch (_) {}
        })();

        const TOKEN_KEY = 'mb_expense_token';
        const MAX_EDGE = 1200;
        const MAX_BYTES = 200 * 1024;
        const NEED = 6;
        let token = localStorage.getItem(TOKEN_KEY) || '';
        let stream = null;
        let busy = false;
        let looping = false;
        let timer = 0;
        let stable = 0;
        let lastSig = null;

        function badge(t, ok) {
            const el = document.getElementById('badge');
            el.textContent = t || '';
            el.classList.toggle('ok', !!ok);
            el.style.display = t ? 'block' : 'none';
        }

        function showApp() {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            startCamera();
        }
        function showLock(msg) {
            stopLoop(); stopCamera();
            document.getElementById('app').classList.add('hidden');
            document.getElementById('lock').classList.remove('hidden');
            const err = document.getElementById('login-err');
            if (msg) { err.textContent = msg; err.classList.remove('hidden'); }
            else err.classList.add('hidden');
        }

        async function doLogin() {
            const password = document.getElementById('password').value;
            const err = document.getElementById('login-err');
            err.classList.add('hidden');
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            try {
                let res = await fetch('/api/admin-login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                let data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    res = await fetch('/api/kitchen-login', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password, store_name: '' }),
                    });
                    data = await res.json().catch(() => ({}));
                }
                if (!res.ok || !data.token) throw new Error(data.error || '登入失敗');
                token = data.token;
                localStorage.setItem(TOKEN_KEY, token);
                showApp();
            } catch (e) {
                err.textContent = e.message || '登入失敗';
                err.classList.remove('hidden');
            } finally { btn.disabled = false; }
        }

        function logout() {
            token = ''; localStorage.removeItem(TOKEN_KEY); showLock();
        }

        function setLive(live) {
            const video = document.getElementById('video');
            const preview = document.getElementById('preview');
            const guide = document.getElementById('guide');
            document.getElementById('btn-scan').disabled = !live || busy || !stream;
            document.getElementById('btn-rescan').disabled = live || busy;
            if (live) {
                video.style.display = 'block';
                preview.classList.add('hidden');
                guide.style.display = 'block';
            } else {
                video.style.display = 'none';
                preview.classList.remove('hidden');
                guide.style.display = 'none';
            }
        }

        async function startCamera() {
            stopLoop(); stopCamera();
            const status = document.getElementById('status');
            if (!navigator.mediaDevices?.getUserMedia) {
                status.textContent = '唔支援鏡頭 — 請用相簿';
                badge('請用相簿');
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                });
                const video = document.getElementById('video');
                video.setAttribute('playsinline', 'true');
                video.muted = true;
                video.srcObject = stream;
                await video.play();
                setLive(true);
                status.textContent = '對準黃框內收據，企穩會自動影';
                status.className = 'text-sm font-bold text-neutral-400';
                badge('對準黃框 · 企穩自動影');
                startLoop();
            } catch (e) {
                stream = null;
                status.textContent = '開唔到相機 — 請允許權限或用相簿';
                status.className = 'text-sm font-bold text-amber-300';
                badge('相機權限未開');
                document.getElementById('btn-rescan').disabled = false;
            }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach((t) => t.stop());
            stream = null;
            document.getElementById('video').srcObject = null;
            document.getElementById('btn-scan').disabled = true;
        }

        function stopLoop() {
            looping = false;
            if (timer) clearTimeout(timer);
            timer = 0; stable = 0; lastSig = null;
        }

        function restartScan() {
            document.getElementById('result').classList.add('hidden');
            document.getElementById('result').innerHTML = '';
            document.getElementById('preview').removeAttribute('src');
            startCamera();
        }

        function analyze() {
            const video = document.getElementById('video');
            if (!video.videoWidth) return null;
            const dw = 320;
            const scale = dw / video.videoWidth;
            const dh = Math.max(1, Math.round(video.videoHeight * scale));
            const c = document.getElementById('detect');
            c.width = dw; c.height = dh;
            const ctx = c.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, dw, dh);
            const x0 = Math.floor(dw * 0.08), y0 = Math.floor(dh * 0.10);
            const rw = Math.floor(dw * 0.84), rh = Math.floor(dh * 0.80);
            const { data } = ctx.getImageData(x0, y0, rw, rh);
            const step = 4;
            let n = 0, sum = 0, sumSq = 0, edge = 0;
            const gray = [];
            for (let y = 0; y < rh; y += step) {
                for (let x = 0; x < rw; x += step) {
                    const i = (y * rw + x) * 4;
                    const g = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    gray.push(g); sum += g; sumSq += g * g; n++;
                }
            }
            if (n < 40) return null;
            const mean = sum / n;
            const variance = sumSq / n - mean * mean;
            const cols = Math.ceil(rw / step);
            for (let y = 1; y < Math.floor(rh / step) - 1; y++) {
                for (let x = 1; x < cols - 1; x++) {
                    const i = y * cols + x;
                    edge += Math.abs(gray[i + 1] - gray[i - 1]) + Math.abs(gray[i + cols] - gray[i - cols]);
                }
            }
            const edgeScore = edge / n;
            const buckets = new Array(8).fill(0);
            for (let i = 0; i < gray.length; i += 2) buckets[Math.min(7, gray[i] >> 5)]++;
            const sig = buckets.map((b) => b / gray.length);
            let motion = 1;
            if (lastSig) {
                motion = 0;
                for (let i = 0; i < 8; i++) motion += Math.abs(sig[i] - lastSig[i]);
            }
            lastSig = sig;
            const hasContent = variance > 280 && edgeScore > 14;
            return { hasContent, still: motion < 0.09, motion, variance };
        }

        function startLoop() {
            looping = true; stable = 0; lastSig = null;
            const tick = () => {
                if (!looping || busy || !stream) return;
                try {
                    const hit = analyze();
                    if (hit?.hasContent && hit.still) {
                        stable++;
                        badge(`對準中 (${stable}/${NEED})`, true);
                        if (stable >= NEED) { badge('自動掃描中…', true); captureAndUpload(true); return; }
                    } else if (hit?.hasContent) {
                        stable = Math.max(0, stable - 1);
                        badge('對準黃框 · 請企穩');
                    } else {
                        stable = 0;
                        badge('對準黃框內收據');
                    }
                } catch (_) {}
                timer = setTimeout(tick, 180);
            };
            tick();
        }

        function dataUrlBytes(u) {
            const i = u.indexOf(',');
            return Math.floor(((i >= 0 ? u.slice(i + 1) : u).length) * 0.75);
        }

        function loadImg(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('讀圖失敗'));
                img.src = src;
            });
        }

        function loadFile(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('讀圖失敗')); };
                img.src = url;
            });
        }

        function supports(type) {
            try {
                const c = document.createElement('canvas');
                c.width = 1; c.height = 1;
                return c.toDataURL(type).startsWith('data:' + type);
            } catch (_) { return false; }
        }

        function drawScaled(img, maxEdge) {
            const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
            const s = Math.min(1, maxEdge / Math.max(sw, sh));
            const w = Math.max(1, Math.round(sw * s)), h = Math.max(1, Math.round(sh * s));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const ctx = c.getContext('2d', { alpha: false });
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            return c;
        }

        async function compress(img) {
            const mime = supports('image/webp') ? 'image/webp' : 'image/jpeg';
            let maxEdge = MAX_EDGE, q = 0.7, best = null;
            for (let i = 0; i < 10; i++) {
                const c = drawScaled(img, maxEdge);
                const dataUrl = c.toDataURL(mime, q);
                const bytes = dataUrlBytes(dataUrl);
                best = { dataUrl, mime_type: mime, bytes };
                if (bytes <= MAX_BYTES) return best;
                if (q > 0.45) q = Math.max(0.45, q - 0.1);
                else if (maxEdge > 800) { maxEdge = Math.max(800, Math.round(maxEdge * 0.85)); q = 0.7; }
                else { maxEdge = Math.max(640, Math.round(maxEdge * 0.85)); q = Math.max(0.3, q - 0.05); }
            }
            return best;
        }

        async function frameToCompressed(cropGuide) {
            const video = document.getElementById('video');
            const c = document.createElement('canvas');
            const vw = video.videoWidth, vh = video.videoHeight;
            if (cropGuide) {
                const sx = Math.round(vw * 0.08), sy = Math.round(vh * 0.10);
                const sw = Math.round(vw * 0.84), sh = Math.round(vh * 0.80);
                c.width = sw; c.height = sh;
                c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
            } else {
                c.width = vw; c.height = vh;
                c.getContext('2d').drawImage(video, 0, 0);
            }
            return compress(await loadImg(c.toDataURL('image/jpeg', 0.92)));
        }

        async function upload(compressed) {
            const preview = document.getElementById('preview');
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            result.classList.add('hidden'); result.innerHTML = '';
            preview.src = compressed.dataUrl;
            setLive(false); badge('');
            status.textContent = `已掃描 ${Math.round(compressed.bytes / 1024)}KB · AI 分析中…`;
            status.className = 'text-sm font-bold text-amber-300';

            const res = await fetch('/api/upload-expense', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token,
                    store_id: document.getElementById('store_id').value,
                    image_base64: compressed.dataUrl,
                    mime_type: compressed.mime_type,
                }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || '上傳失敗');
            const e = data.expense || {};
            status.textContent = data.ai_error ? `已存檔（AI 失敗：${data.ai_error}）` : '儲存成功';
            status.className = 'text-sm font-bold text-emerald-400';
            result.innerHTML = `
                <div>商戶：${esc(e.merchant_name || '（未讀到）')}</div>
                <div>金額：${e.amount != null ? 'HK$' + Number(e.amount) : '（未讀到）'}</div>
                <div>日期：${esc(e.expense_date || '—')}</div>
                <div>分類：${esc(catLabel(e.category || data.ai?.category))}</div>
                ${e.receipt_url ? `<a class="text-sky-400 underline break-all" href="${esc(e.receipt_url)}" target="_blank" rel="noopener">收據圖片</a>` : ''}
            `;
            result.classList.remove('hidden');
        }

        function catLabel(c) {
            const map = {
                cost_of_sales: '銷售成本／食材',
                packaging: '包裝',
                rent_utilities: '租金及水電',
                repairs: '維修保養',
                marketing: '推廣',
                admin: '行政',
                other: '其他',
            };
            return map[c] || map.other;
        }

        async function captureAndUpload(auto) {
            if (busy || !stream) return;
            busy = true; stopLoop();
            document.getElementById('btn-scan').disabled = true;
            const status = document.getElementById('status');
            try {
                status.textContent = auto ? '自動掃描中…' : '掃描中…';
                status.className = 'text-sm font-bold text-amber-300';
                const compressed = await frameToCompressed(true);
                stopCamera();
                if (!compressed) throw new Error('壓縮失敗');
                await upload(compressed);
            } catch (err) {
                status.textContent = err.message || '失敗';
                status.className = 'text-sm font-bold text-red-400';
                document.getElementById('btn-rescan').disabled = false;
            } finally { busy = false; }
        }

        function manualCapture() { return captureAndUpload(false); }

        async function onPick(ev) {
            const file = ev.target.files && ev.target.files[0];
            ev.target.value = '';
            if (!file || !token || busy) return;
            busy = true; stopLoop(); stopCamera();
            const status = document.getElementById('status');
            try {
                status.textContent = '處理相片…';
                const compressed = await compress(await loadFile(file));
                if (!compressed) throw new Error('壓縮失敗');
                await upload(compressed);
            } catch (err) {
                status.textContent = err.message || '失敗';
                status.className = 'text-sm font-bold text-red-400';
                document.getElementById('btn-rescan').disabled = false;
            } finally { busy = false; }
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        (async function boot() {
            if (!token) return showLock();
            try {
                let res = await fetch('/api/admin-login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                if (res.ok) return showApp();
                res = await fetch('/api/kitchen-login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                if (res.ok) return showApp();
            } catch (_) {}
            token = ''; localStorage.removeItem(TOKEN_KEY); showLock();
        })();
    </script>
</body>
</html>
