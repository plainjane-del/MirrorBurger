<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Mirror Burger · AI 開支</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; }
        .card { background: #141414; border: 1px solid #262626; border-radius: 1rem; }
        .btn {
            border-radius: 0.75rem; font-weight: 800; padding: 0.75rem 1rem;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
        }
        .btn-primary { background: #FFD131; color: #0a0a0a; }
        .btn-ghost { background: #262626; color: #e5e5e5; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        select, input[type="password"] {
            background: #171717; border: 1px solid #404040; border-radius: 0.75rem;
            padding: 0.65rem 0.85rem; width: 100%; color: #fff;
        }
        label.field {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
            text-transform: uppercase; color: #a3a3a3; display: block; margin-bottom: 0.35rem;
        }
        .scan-stage {
            position: relative;
            aspect-ratio: 3 / 4;
            border-radius: 1rem;
            overflow: hidden;
            background: #050505;
            border: 1px solid #262626;
        }
        .scan-stage video,
        .scan-stage canvas#overlay,
        .scan-stage #preview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #050505;
        }
        .scan-stage #preview { object-fit: contain; z-index: 3; }
        .scan-stage canvas#overlay { z-index: 2; pointer-events: none; }
        .scan-stage video { z-index: 1; }
        .guide {
            pointer-events: none;
            position: absolute;
            inset: 10% 8%;
            z-index: 2;
            border: 2px solid rgba(255, 209, 49, 0.85);
            border-radius: 12px;
            box-shadow: 0 0 0 999px rgba(0,0,0,0.32);
        }
        .guide.hidden { display: none; }
        .scan-badge {
            position: absolute;
            left: 50%;
            bottom: 0.75rem;
            transform: translateX(-50%);
            z-index: 4;
            background: rgba(0,0,0,0.72);
            color: #FFD131;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: none;
            max-width: 92%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .scan-badge.ok { color: #0a0a0a; background: #FFD131; }
        .actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0.5rem; }
        .file-btn { cursor: pointer; }
        .file-btn input { display: none; }
        #work, #detect { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen px-4 py-8">
    <div class="max-w-md mx-auto space-y-5">
        <header class="space-y-1">
            <p class="text-xs font-black tracking-widest text-neutral-500 uppercase">AI CFO</p>
            <h1 class="text-2xl font-black">開支記錄</h1>
            <p class="text-sm text-neutral-400 font-bold">自動掃描收據 → AI 讀金額 → 存檔核數</p>
        </header>

        <div id="lock" class="card p-5 space-y-4">
            <div>
                <label class="field">後台／廚房密碼</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="同 admin / kitchen 密碼">
            </div>
            <button type="button" class="btn btn-primary w-full" id="login-btn" onclick="doLogin()">登入</button>
            <p id="login-err" class="text-sm text-red-400 hidden"></p>
        </div>

        <div id="app" class="hidden space-y-4">
            <div class="card p-5 space-y-4">
                <div>
                    <label class="field">分店</label>
                    <select id="store_id">
                        <option value="SYP">西營盤 SYP</option>
                        <option value="TH">天后 TH</option>
                        <option value="TW">荃灣 TW</option>
                    </select>
                </div>

                <div class="scan-stage" id="stage">
                    <video id="video" playsinline muted autoplay></video>
                    <div class="guide" id="guide"></div>
                    <canvas id="overlay"></canvas>
                    <img id="preview" class="hidden" alt="Receipt preview">
                    <div class="scan-badge" id="scan-badge">開緊鏡頭…</div>
                </div>
                <canvas id="work"></canvas>
                <canvas id="detect"></canvas>

                <div class="actions">
                    <button type="button" class="btn btn-primary" id="btn-scan" onclick="manualCapture()" disabled>即刻掃描</button>
                    <label class="btn btn-ghost file-btn">
                        相簿
                        <input id="file" type="file" accept="image/*" onchange="onPick(event)">
                    </label>
                </div>
                <button type="button" class="btn btn-ghost w-full" id="btn-rescan" onclick="restartScan()" disabled>再開鏡頭掃描</button>

                <p id="status" class="text-sm font-bold text-neutral-400"></p>
                <div id="result" class="hidden space-y-2 text-sm font-bold"></div>
            </div>
            <button type="button" class="btn btn-ghost w-full" onclick="logout()">登出</button>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'mb_expense_token';
        const MAX_EDGE = 1200;
        const MAX_BYTES = 200 * 1024;
        const DETECT_W = 360;
        const STABLE_NEEDED = 7;
        const OPENCV_TIMEOUT_MS = 12000;

        let token = localStorage.getItem(TOKEN_KEY) || '';
        let stream = null;
        let busy = false;
        let scanner = null;
        let cvReady = false;
        let engineMode = 'lite'; // 'lite' | 'opencv'
        let scanning = false;
        let loopTimer = 0;
        let stableCount = 0;
        let lastSig = null;
        let lastCorners = null;
        let enginePromise = null;

        function showApp() {
            document.getElementById('lock').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            // Camera first — never block UI on OpenCV download.
            startCamera();
            loadScanEngine().catch(() => {});
        }
        function showLock(msg) {
            stopScanLoop();
            stopCamera();
            document.getElementById('app').classList.add('hidden');
            document.getElementById('lock').classList.remove('hidden');
            const err = document.getElementById('login-err');
            if (msg) {
                err.textContent = msg;
                err.classList.remove('hidden');
            } else {
                err.classList.add('hidden');
            }
        }

        async function doLogin() {
            const password = document.getElementById('password').value;
            const err = document.getElementById('login-err');
            err.classList.add('hidden');
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            try {
                let res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                let data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    res = await fetch('/api/kitchen-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password, store_name: '' }),
                    });
                    data = await res.json().catch(() => ({}));
                }
                if (!res.ok || !data.token) throw new Error(data.error || '登入失敗');
                token = data.token;
                localStorage.setItem(TOKEN_KEY, token);
                showApp();
            } catch (e) {
                err.textContent = e.message || '登入失敗';
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        }

        function logout() {
            token = '';
            localStorage.removeItem(TOKEN_KEY);
            showLock();
        }

        function setBadge(text, ok) {
            const el = document.getElementById('scan-badge');
            if (!text) {
                el.classList.add('hidden');
                return;
            }
            el.classList.remove('hidden');
            el.textContent = text;
            el.classList.toggle('ok', !!ok);
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('script fail: ' + src));
                document.head.appendChild(s);
            });
        }

        function waitCvReady(timeoutMs) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const done = () => {
                    if (typeof cv !== 'undefined' && cv && typeof cv.Mat === 'function') {
                        resolve(cv);
                        return true;
                    }
                    return false;
                };
                if (done()) return;

                const timer = setInterval(() => {
                    if (done()) {
                        clearInterval(timer);
                        return;
                    }
                    if (Date.now() - start > timeoutMs) {
                        clearInterval(timer);
                        reject(new Error('OpenCV timeout'));
                    }
                }, 80);

                const hook = () => {
                    if (done()) clearInterval(timer);
                };
                try {
                    if (typeof cv !== 'undefined' && cv) {
                        const prev = cv.onRuntimeInitialized;
                        cv.onRuntimeInitialized = function () {
                            if (typeof prev === 'function') prev();
                            hook();
                        };
                    }
                } catch (_) { /* ignore */ }
            });
        }

        async function loadScanEngine() {
            if (enginePromise) return enginePromise;
            enginePromise = (async () => {
                setBadge('鏡頭已開 · 輕量自動掃描中', false);
                try {
                    await loadScript('https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.10/dist/opencv.js');
                    await waitCvReady(OPENCV_TIMEOUT_MS);
                    await loadScript('https://cdn.jsdelivr.net/npm/jscanify@1.4.3/src/jscanify.min.js');
                    if (typeof jscanify !== 'function') throw new Error('no jscanify');
                    scanner = new jscanify();
                    cvReady = true;
                    engineMode = 'opencv';
                    document.getElementById('guide').classList.add('hidden');
                    if (scanning) setBadge('邊緣偵測已開 · 對準紙張', false);
                    return true;
                } catch (err) {
                    console.warn('OpenCV engine unavailable, using lite scan', err);
                    cvReady = false;
                    engineMode = 'lite';
                    scanner = null;
                    document.getElementById('guide').classList.remove('hidden');
                    if (scanning) setBadge('對準黃框內收據 · 企穩會自動影', false);
                    return false;
                }
            })();
            return enginePromise;
        }

        function setLiveUi(live) {
            const video = document.getElementById('video');
            const overlay = document.getElementById('overlay');
            const preview = document.getElementById('preview');
            const guide = document.getElementById('guide');
            const btnScan = document.getElementById('btn-scan');
            const btnRescan = document.getElementById('btn-rescan');
            if (live) {
                video.style.display = 'block';
                overlay.style.display = 'block';
                preview.classList.add('hidden');
                if (engineMode === 'lite') guide.classList.remove('hidden');
                else guide.classList.add('hidden');
                btnScan.disabled = !stream || busy;
                btnRescan.disabled = true;
            } else {
                video.style.display = 'none';
                overlay.style.display = 'none';
                guide.classList.add('hidden');
                preview.classList.remove('hidden');
                btnScan.disabled = true;
                btnRescan.disabled = busy;
            }
        }

        async function startCamera() {
            const status = document.getElementById('status');
            stopScanLoop();
            stopCamera();
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                status.textContent = '呢個瀏覽器唔支援鏡頭 — 請用「相簿」';
                status.className = 'text-sm font-bold text-amber-300';
                setBadge('請用相簿', false);
                setLiveUi(false);
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                    },
                });
                const video = document.getElementById('video');
                video.setAttribute('playsinline', 'true');
                video.muted = true;
                video.srcObject = stream;
                await video.play();
                setLiveUi(true);
                status.textContent = '對準收據，企穩會自動掃描（或撳「即刻掃描」）';
                status.className = 'text-sm font-bold text-neutral-400';
                setBadge(engineMode === 'opencv' ? '邊緣偵測已開 · 對準紙張' : '對準黃框內收據 · 企穩會自動影', false);
                startScanLoop();
            } catch (err) {
                stream = null;
                setLiveUi(false);
                status.textContent = '開唔到鏡頭 — 請允許相機權限，或用「相簿」';
                status.className = 'text-sm font-bold text-amber-300';
                setBadge('相機權限未開', false);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach((t) => t.stop());
                stream = null;
            }
            const video = document.getElementById('video');
            video.srcObject = null;
            document.getElementById('btn-scan').disabled = true;
        }

        function stopScanLoop() {
            scanning = false;
            if (loopTimer) {
                clearTimeout(loopTimer);
                loopTimer = 0;
            }
            stableCount = 0;
            lastSig = null;
            lastCorners = null;
            const overlay = document.getElementById('overlay');
            const ctx = overlay.getContext('2d');
            if (overlay.width) ctx.clearRect(0, 0, overlay.width, overlay.height);
        }

        function restartScan() {
            const result = document.getElementById('result');
            result.classList.add('hidden');
            result.innerHTML = '';
            document.getElementById('preview').removeAttribute('src');
            startCamera();
        }

        function cornerDistance(a, b) {
            if (!a || !b) return Infinity;
            const keys = ['topLeftCorner', 'topRightCorner', 'bottomLeftCorner', 'bottomRightCorner'];
            let max = 0;
            for (const k of keys) {
                if (!a[k] || !b[k]) return Infinity;
                const d = Math.hypot(a[k].x - b[k].x, a[k].y - b[k].y);
                if (d > max) max = d;
            }
            return max;
        }

        function cornerArea(c, w, h) {
            if (!c) return 0;
            const pts = [c.topLeftCorner, c.topRightCorner, c.bottomRightCorner, c.bottomLeftCorner];
            if (pts.some((p) => !p)) return 0;
            let area = 0;
            for (let i = 0; i < 4; i++) {
                const p = pts[i];
                const q = pts[(i + 1) % 4];
                area += p.x * q.y - q.x * p.y;
            }
            return Math.abs(area) / 2 / (w * h);
        }

        function scaleCorners(c, sx, sy) {
            if (!c) return null;
            const map = (p) => ({ x: p.x * sx, y: p.y * sy });
            return {
                topLeftCorner: map(c.topLeftCorner),
                topRightCorner: map(c.topRightCorner),
                bottomLeftCorner: map(c.bottomLeftCorner),
                bottomRightCorner: map(c.bottomRightCorner),
            };
        }

        function drawCornersOverlay(corners, dw, dh) {
            const video = document.getElementById('video');
            const overlay = document.getElementById('overlay');
            const rect = video.getBoundingClientRect();
            overlay.width = Math.max(1, Math.round(rect.width * devicePixelRatio));
            overlay.height = Math.max(1, Math.round(rect.height * devicePixelRatio));
            overlay.style.width = rect.width + 'px';
            overlay.style.height = rect.height + 'px';
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            if (!corners) return;

            const vw = video.videoWidth || dw;
            const vh = video.videoHeight || dh;
            const scale = Math.max(overlay.width / vw, overlay.height / vh);
            const ox = (overlay.width - vw * scale) / 2;
            const oy = (overlay.height - vh * scale) / 2;
            const sx = (vw / dw) * scale;
            const sy = (vh / dh) * scale;
            const pts = [
                corners.topLeftCorner,
                corners.topRightCorner,
                corners.bottomRightCorner,
                corners.bottomLeftCorner,
            ].map((p) => ({ x: ox + p.x * sx, y: oy + p.y * sy }));

            ctx.lineWidth = 4 * devicePixelRatio;
            ctx.strokeStyle = '#FFD131';
            ctx.fillStyle = 'rgba(255, 209, 49, 0.12)';
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function detectOpenCv() {
            const video = document.getElementById('video');
            if (!scanner || !cvReady || !video.videoWidth) return null;
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const scale = Math.min(1, DETECT_W / Math.max(vw, vh));
            const dw = Math.max(1, Math.round(vw * scale));
            const dh = Math.max(1, Math.round(vh * scale));
            const detect = document.getElementById('detect');
            detect.width = dw;
            detect.height = dh;
            detect.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0, dw, dh);

            let mat = null;
            let contour = null;
            try {
                mat = cv.imread(detect);
                contour = scanner.findPaperContour(mat);
                if (!contour) return null;
                const corners = scanner.getCornerPoints(contour);
                if (cornerArea(corners, dw, dh) < 0.12) return null;
                return { kind: 'opencv', corners, dw, dh, vw, vh };
            } catch (_) {
                return null;
            } finally {
                if (contour && contour.delete) contour.delete();
                if (mat && mat.delete) mat.delete();
            }
        }

        /** Lightweight: content + sharpness + stillness inside the yellow guide. */
        function detectLite() {
            const video = document.getElementById('video');
            if (!video.videoWidth) return null;
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const scale = Math.min(1, DETECT_W / Math.max(vw, vh));
            const dw = Math.max(1, Math.round(vw * scale));
            const dh = Math.max(1, Math.round(vh * scale));
            const detect = document.getElementById('detect');
            detect.width = dw;
            detect.height = dh;
            const ctx = detect.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, dw, dh);

            const x0 = Math.floor(dw * 0.08);
            const y0 = Math.floor(dh * 0.10);
            const rw = Math.floor(dw * 0.84);
            const rh = Math.floor(dh * 0.80);
            const img = ctx.getImageData(x0, y0, rw, rh);
            const data = img.data;
            const step = 4; // sample every 4th pixel
            let n = 0, sum = 0, sumSq = 0, edge = 0;
            const gray = [];
            for (let y = 0; y < rh; y += step) {
                for (let x = 0; x < rw; x += step) {
                    const i = (y * rw + x) * 4;
                    const g = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    gray.push(g);
                    sum += g;
                    sumSq += g * g;
                    n += 1;
                }
            }
            if (n < 50) return null;
            const mean = sum / n;
            const variance = Math.max(0, sumSq / n - mean * mean);
            const cols = Math.ceil(rw / step);
            for (let y = 1; y < Math.floor(rh / step) - 1; y++) {
                for (let x = 1; x < cols - 1; x++) {
                    const i = y * cols + x;
                    const gx = gray[i + 1] - gray[i - 1];
                    const gy = gray[i + cols] - gray[i - cols];
                    edge += Math.abs(gx) + Math.abs(gy);
                }
            }
            const edgeScore = edge / n;
            // Stillness vs previous grayscale signature (coarse histogram)
            const buckets = new Array(8).fill(0);
            for (let i = 0; i < gray.length; i += 3) {
                buckets[Math.min(7, gray[i] >> 5)] += 1;
            }
            const sig = buckets.map((b) => b / gray.length);
            let motion = 1;
            if (lastSig) {
                motion = 0;
                for (let i = 0; i < 8; i++) motion += Math.abs(sig[i] - lastSig[i]);
            }
            lastSig = sig;

            // Tuned for receipts / phone screens showing receipts
            const hasContent = variance > 350 && edgeScore > 18;
            const isStill = motion < 0.08;
            if (!hasContent) return null;
            return { kind: 'lite', still: isStill, variance, edgeScore, motion, dw, dh, vw, vh };
        }

        function startScanLoop() {
            scanning = true;
            stableCount = 0;
            lastSig = null;
            lastCorners = null;

            const tick = () => {
                if (!scanning || busy || !stream) return;
                try {
                    if (engineMode === 'opencv' && cvReady) {
                        const hit = detectOpenCv();
                        if (hit) {
                            drawCornersOverlay(hit.corners, hit.dw, hit.dh);
                            const drift = cornerDistance(hit.corners, lastCorners);
                            stableCount = (lastCorners && drift < 28) ? stableCount + 1 : 1;
                            lastCorners = hit.corners;
                            setBadge(`偵測到紙張 · 企穩 (${stableCount}/${STABLE_NEEDED})`, true);
                            if (stableCount >= STABLE_NEEDED) {
                                setBadge('已鎖定 — 自動掃描中', true);
                                autoCapture(hit);
                                return;
                            }
                        } else {
                            drawCornersOverlay(null, 1, 1);
                            stableCount = 0;
                            lastCorners = null;
                            setBadge('對準收據／紙張邊緣', false);
                        }
                    } else {
                        const hit = detectLite();
                        if (hit && hit.still) {
                            stableCount += 1;
                            setBadge(`對準中 · 企穩自動影 (${stableCount}/${STABLE_NEEDED})`, true);
                            if (stableCount >= STABLE_NEEDED) {
                                setBadge('已鎖定 — 自動掃描中', true);
                                autoCapture(hit);
                                return;
                            }
                        } else if (hit) {
                            stableCount = Math.max(0, stableCount - 1);
                            setBadge('對準黃框 · 請企穩', false);
                        } else {
                            stableCount = 0;
                            setBadge('對準黃框內收據', false);
                        }
                    }
                } catch (e) {
                    console.warn('scan tick', e);
                }
                loopTimer = setTimeout(tick, 160);
            };
            tick();
        }

        async function warpAndCompress(sourceCanvas, corners) {
            if (cvReady && scanner) {
                try {
                    const extracted = corners
                        ? scanner.extractPaper(sourceCanvas, 1000, 1400, corners)
                        : scanner.extractPaper(sourceCanvas, 1000, 1400);
                    if (extracted) {
                        const img = await loadImageFromSrc(extracted.toDataURL('image/jpeg', 0.92));
                        return compressFromImage(img);
                    }
                } catch (_) { /* fall through */ }
            }
            const img = await loadImageFromSrc(sourceCanvas.toDataURL('image/jpeg', 0.92));
            return compressFromImage(img);
        }

        async function captureFullFrame(hit) {
            const video = document.getElementById('video');
            const work = document.getElementById('work');
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            work.width = vw;
            work.height = vh;
            const wctx = work.getContext('2d');

            if (hit && hit.kind === 'lite') {
                // Crop to guide region (same ratios as CSS guide)
                const sx = Math.round(vw * 0.08);
                const sy = Math.round(vh * 0.10);
                const sw = Math.round(vw * 0.84);
                const sh = Math.round(vh * 0.80);
                work.width = sw;
                work.height = sh;
                wctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
                return warpAndCompress(work, null);
            }

            wctx.drawImage(video, 0, 0, vw, vh);
            let fullCorners = null;
            if (hit && hit.kind === 'opencv' && hit.corners) {
                fullCorners = scaleCorners(hit.corners, vw / hit.dw, vh / hit.dh);
            }
            return warpAndCompress(work, fullCorners);
        }

        async function autoCapture(hit) {
            if (busy) return;
            busy = true;
            stopScanLoop();
            document.getElementById('btn-scan').disabled = true;
            const status = document.getElementById('status');
            try {
                status.textContent = '自動掃描中…';
                status.className = 'text-sm font-bold text-amber-300';
                const compressed = await captureFullFrame(hit);
                stopCamera();
                if (!compressed) throw new Error('掃描失敗');
                await uploadCompressed(compressed);
            } catch (err) {
                status.textContent = err.message || '自動掃描失敗';
                status.className = 'text-sm font-bold text-red-400';
                document.getElementById('btn-rescan').disabled = false;
                setBadge('掃描失敗 — 可再試', false);
            } finally {
                busy = false;
            }
        }

        async function manualCapture() {
            if (busy || !stream) return;
            busy = true;
            stopScanLoop();
            document.getElementById('btn-scan').disabled = true;
            const status = document.getElementById('status');
            try {
                status.textContent = '掃描中…';
                status.className = 'text-sm font-bold text-amber-300';
                const hit = (engineMode === 'opencv' && cvReady) ? detectOpenCv() : { kind: 'lite' };
                const compressed = await captureFullFrame(hit || { kind: 'lite' });
                stopCamera();
                if (!compressed) throw new Error('掃描失敗');
                await uploadCompressed(compressed);
            } catch (err) {
                status.textContent = err.message || '掃描失敗';
                status.className = 'text-sm font-bold text-red-400';
                document.getElementById('btn-rescan').disabled = false;
            } finally {
                busy = false;
            }
        }

        function dataUrlBytes(dataUrl) {
            const i = dataUrl.indexOf(',');
            const b64 = i >= 0 ? dataUrl.slice(i + 1) : dataUrl;
            return Math.floor(b64.length * 0.75);
        }

        function loadImageFromSrc(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('讀圖失敗'));
                img.src = src;
            });
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('讀圖失敗'));
                };
                img.src = url;
            });
        }

        function canvasSupports(type) {
            try {
                const c = document.createElement('canvas');
                c.width = 1; c.height = 1;
                return c.toDataURL(type).startsWith(`data:${type}`);
            } catch (_) { return false; }
        }

        function drawScaled(img, maxEdge) {
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            const scale = Math.min(1, maxEdge / Math.max(srcW, srcH));
            const w = Math.max(1, Math.round(srcW * scale));
            const h = Math.max(1, Math.round(srcH * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            return canvas;
        }

        async function compressFromImage(img) {
            const preferWebp = canvasSupports('image/webp');
            const mime = preferWebp ? 'image/webp' : 'image/jpeg';
            let maxEdge = MAX_EDGE;
            let quality = 0.7;
            let best = null;
            for (let pass = 0; pass < 10; pass++) {
                const canvas = drawScaled(img, maxEdge);
                const dataUrl = canvas.toDataURL(mime, quality);
                const bytes = dataUrlBytes(dataUrl);
                best = { dataUrl, mime_type: mime, bytes };
                if (bytes <= MAX_BYTES) return best;
                if (quality > 0.45) quality = Math.max(0.45, quality - 0.1);
                else if (maxEdge > 800) { maxEdge = Math.max(800, Math.round(maxEdge * 0.85)); quality = 0.7; }
                else if (quality > 0.35) quality -= 0.05;
                else { maxEdge = Math.max(640, Math.round(maxEdge * 0.85)); quality = Math.max(0.3, quality - 0.05); }
            }
            if (preferWebp && best && best.bytes > MAX_BYTES) {
                const canvas = drawScaled(img, Math.min(maxEdge, 800));
                const dataUrl = canvas.toDataURL('image/jpeg', 0.55);
                best = { dataUrl, mime_type: 'image/jpeg', bytes: dataUrlBytes(dataUrl) };
            }
            return best;
        }

        async function uploadCompressed(compressed) {
            const preview = document.getElementById('preview');
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            result.classList.add('hidden');
            result.innerHTML = '';
            preview.src = compressed.dataUrl;
            setLiveUi(false);
            setBadge('', false);
            const kb = Math.round(compressed.bytes / 1024);
            status.textContent = `已掃描 ${kb}KB · 正在 AI 分析…`;
            status.className = 'text-sm font-bold text-amber-300';

            const res = await fetch('/api/upload-expense', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token,
                    store_id: document.getElementById('store_id').value,
                    image_base64: compressed.dataUrl,
                    mime_type: compressed.mime_type,
                }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || '上傳失敗');

            const e = data.expense || {};
            const money = e.amount != null ? `HK$${Number(e.amount)}` : '（未讀到金額）';
            const merchant = e.merchant_name || '（未讀到商戶）';
            const date = e.expense_date || '—';
            status.textContent = data.ai_error
                ? `已存檔（AI 部分失敗：${data.ai_error}）`
                : '儲存成功';
            status.className = 'text-sm font-bold text-emerald-400';
            result.innerHTML = `
                <div>商戶：${escapeHtml(merchant)}</div>
                <div>金額：${escapeHtml(money)}</div>
                <div>日期：${escapeHtml(date)}</div>
                ${e.receipt_url ? `<a class="text-sky-400 underline break-all" href="${escapeHtml(e.receipt_url)}" target="_blank" rel="noopener">收據圖片</a>` : ''}
            `;
            result.classList.remove('hidden');
        }

        async function onPick(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file || !token || busy) return;
            busy = true;
            stopScanLoop();
            stopCamera();
            document.getElementById('btn-scan').disabled = true;
            const status = document.getElementById('status');
            try {
                status.textContent = '處理相片…';
                status.className = 'text-sm font-bold text-neutral-400';
                await loadScanEngine().catch(() => false);
                const img = await loadImage(file);
                const canvas = drawScaled(img, 1600);
                let compressed = await warpAndCompress(canvas, null);
                if (!compressed) compressed = await compressFromImage(img);
                if (!compressed) throw new Error('壓縮失敗');
                await uploadCompressed(compressed);
            } catch (err) {
                status.textContent = err.message || '失敗';
                status.className = 'text-sm font-bold text-red-400';
                document.getElementById('btn-rescan').disabled = false;
            } finally {
                busy = false;
            }
        }

        function escapeHtml(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        (async function boot() {
            // Warm engine in background on login screen (non-blocking).
            loadScanEngine().catch(() => {});
            if (!token) return showLock();
            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                if (res.ok) return showApp();
            } catch (_) {}
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                if (res.ok) return showApp();
            } catch (_) {}
            token = '';
            localStorage.removeItem(TOKEN_KEY);
            showLock();
        })();
    </script>
