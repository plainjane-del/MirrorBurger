<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MB POS">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/pos-manifest.json">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Mirror Burger | 測試 POS</title>
    <link href="./output.css?v=2.0" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background:#0a0a0a; color:#f5f5f5; font-family:"Avenir Next","Helvetica Neue","PingFang HK","Noto Sans TC",sans-serif; min-height:100dvh; }
        .chip-btn { min-height:44px; font-weight:800; font-size:13px; padding:0 12px; border-radius:10px; border:1px solid #333; background:#1a1a1a; color:#e5e5e5; }
        .chip-btn.is-active { background:#FFD131; color:#0a0a0a; border-color:#FFD131; }
        .item-btn { text-align:left; border:1px solid #333; background:#171717; border-radius:14px; padding:8px; cursor:pointer; }
        .pos-thumb { aspect-ratio: 1 / 1; width: 100%; max-height: 180px; background:#111; overflow:hidden; border-radius:10px; margin-bottom:8px; }
        .pos-thumb img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; }
        .voice-choice { min-height:52px; font-weight:900; border-radius:14px; background:#FFD131; color:#0a0a0a; font-size:15px; }
        .pay-btn { min-height:52px; font-weight:900; border-radius:14px; font-size:15px; }
        .pay-btn:disabled, #cfg-add:disabled { opacity:.45; }
        .mic-btn.is-on { background:#b91c1c; color:#fff; border-color:#b91c1c; }
        #pos-toast { position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); z-index:95; display:none; background:#14532d; border:1px solid #22c55e; color:#ecfccb; border-radius:14px; padding:12px 14px; font-weight:800; }
        #pos-toast.is-on { display:block; }
        #pos-cart.is-flash { outline: 3px solid #FFD131; outline-offset: -3px; }
        .sheet { position:fixed; inset:0; z-index:80; display:none; background:#00000088; }
        .sheet.is-open { display:block; }
        .sheet-panel { position:absolute; left:0; right:0; bottom:0; max-height:90dvh; overflow:auto; background:#111; border-radius:20px 20px 0 0; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
        .ticket-no { font-size:clamp(42px, 12vw, 88px); line-height:1; font-weight:900; letter-spacing:-.04em; }
        @media (max-width: 767px) {
            #pos-cart { max-height: 46vh; }
            #pos-menu { padding-bottom: 8px; }
        }
    </style>
</head>
<body class="antialiased">
    <div id="pos-toast" role="status"></div>
    <div id="pos-lock" class="fixed inset-0 z-[100] bg-black flex items-center justify-center px-6">
        <form class="w-full max-w-sm space-y-5" onsubmit="return submitPosLogin(event)">
            <div class="text-center space-y-2">
                <p class="text-[11px] font-black tracking-widest text-amber-400 uppercase">Test POS · v2026.08.17n</p>
                <h1 class="text-2xl font-black text-yellow-400">店內收銀</h1>
                <p class="text-sm font-bold text-neutral-400">廚房密碼登入。撳餸、收款、出示大單號。</p>
            </div>
            <input id="pos-password" type="password" autocomplete="current-password" required placeholder="廚房密碼"
                class="w-full rounded-2xl bg-neutral-900 border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-yellow-400">
            <p id="pos-login-error" class="hidden text-sm font-bold text-red-400 text-center"></p>
            <button type="submit" id="pos-login-btn" class="w-full rounded-2xl bg-yellow-400 text-black py-4 text-base font-black">進入 POS</button>
        </form>
    </div>

    <div id="pos-app" class="hidden h-dvh flex flex-col overflow-hidden">
        <header class="sticky top-0 z-40 bg-black/95 border-b border-neutral-800 px-3 py-2">
            <div class="flex items-center gap-2">
                <div class="min-w-0 flex-1">
                    <div class="text-sm font-black text-yellow-400">測試 POS</div>
                    <p id="last-ticket" class="text-[11px] font-bold text-neutral-500 truncate">未有店內單</p>
                </div>
                <div class="text-right shrink-0 px-2">
                    <div class="text-[10px] font-bold text-neutral-500">購物車</div>
                    <div id="hdr-total" class="text-2xl font-black text-yellow-400 leading-none">$0</div>
                </div>
                <button type="button" class="chip-btn" onclick="openToday()">今日單</button>
                <button type="button" onclick="logoutPos()" class="chip-btn">登出</button>
            </div>
            <div class="mt-2 grid grid-cols-3 gap-1">
                <button type="button" class="chip-btn" data-branch="Sai Ying Pun" onclick="selectStore(this)">西營盤</button>
                <button type="button" class="chip-btn" data-branch="Fortress Hill" onclick="selectStore(this)">天后</button>
                <button type="button" class="chip-btn" data-branch="Tsuen Wan (Takeaway Only)" onclick="selectStore(this)">荃灣</button>
            </div>
            <button type="button" id="mic-btn" class="mt-2 w-full min-h-[56px] rounded-xl bg-red-700 font-black text-lg mic-btn" onclick="startVoiceSession()">講單</button>
        </header>

        <main class="flex-1 grid grid-cols-1 md:grid-cols-[1fr_340px] min-h-0">
            <section id="pos-menu" class="p-3 min-h-0 overflow-auto">
                <input id="menu-search" type="search" placeholder="搜尋餸名" oninput="renderMenu()"
                    class="w-full mb-2 rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm font-bold outline-none">
                <div id="cat-tabs" class="flex gap-1 overflow-x-auto pb-2"></div>
                <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
            </section>
            <aside id="pos-cart" class="sticky bottom-0 z-30 border-t md:border-t-0 md:border-l border-neutral-800 p-3 flex flex-col gap-2 bg-neutral-950 md:static overflow-auto">
                <div class="grid grid-cols-2 gap-1">
                    <button type="button" id="fulfill-takeaway" class="chip-btn is-active" onclick="setFulfill('takeaway')">即取</button>
                    <button type="button" id="fulfill-dine" class="chip-btn" onclick="setFulfill('dine_in')">堂食</button>
                </div>
                <input id="guest-name" type="text" maxlength="40" placeholder="客人名（選填）"
                    class="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm font-bold outline-none">
                <input id="order-note" type="text" maxlength="40" placeholder="備註（選填）"
                    class="w-full rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm font-bold outline-none">
                <div id="cart-list" class="flex-1 min-h-[140px] space-y-2 overflow-y-auto"></div>
                <div class="text-sm font-bold text-neutral-400" id="price-break">小計 $0</div>
                <div class="text-2xl font-black text-yellow-400" id="cart-total">$0</div>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="pay-btn bg-emerald-600" onclick="charge('cash')">現金</button>
                    <button type="button" class="pay-btn bg-sky-600" onclick="charge('fps')">轉數快</button>
                    <button type="button" class="pay-btn bg-violet-600" onclick="charge('payme')">PayMe</button>
                </div>
                <button type="button" class="chip-btn w-full" onclick="clearCart()">清空</button>
            </aside>
        </main>
    </div>

    <div id="voice-sheet" class="sheet" onclick="if(event.target===this && !voiceWanted) closeVoice()">
        <div class="sheet-panel" onclick="event.stopPropagation()">
            <div id="voice-phase-listen">
                <h3 id="voice-ask" class="text-lg font-black mb-1">第一步：漢堡要邊款？</h3>
                <p id="voice-howto" class="text-sm font-bold text-neutral-400 mb-3">唔使估。下面已經幫你列咗答案，<span class="text-yellow-400">撳黃色掣</span>就得；鍾意講都可以，講完再撳大紅掣。</p>
                <div id="voice-summary" class="hidden rounded-xl bg-neutral-900 border border-neutral-700 p-3 text-sm font-bold text-neutral-300 mb-3"></div>
                <div id="voice-choices" class="grid grid-cols-2 gap-2 mb-3"></div>
                <p id="voice-live" class="min-h-[64px] rounded-xl bg-neutral-900 border border-red-800 p-3 text-base font-bold text-yellow-300">聽緊咪高峰…</p>
                <p id="voice-hint" class="text-xs font-bold text-neutral-500 mt-2">唔知講咩就唔使講，直接撳上面黃色建議。</p>
                <button type="button" id="voice-done-btn" class="mt-4 w-full min-h-[56px] rounded-xl bg-red-600 font-black text-lg" onclick="finishVoice()">我講完，跟住問</button>
                <button type="button" class="mt-2 chip-btn w-full" onclick="closeVoice()">取消</button>
            </div>
        </div>
    </div>

    <div id="cfg-sheet" class="sheet" onclick="if(event.target===this) closeCfg()">
        <div class="sheet-panel" onclick="event.stopPropagation()">
            <div class="flex items-start justify-between gap-3 mb-3">
                <div>
                    <h3 id="cfg-title" class="text-lg font-black"></h3>
                    <p id="cfg-price" class="text-sm font-bold text-yellow-400"></p>
                </div>
                <button type="button" class="chip-btn" onclick="closeCfg()">關閉</button>
            </div>
            <div id="cfg-body" class="space-y-4"></div>
            <button type="button" id="cfg-add" class="mt-4 w-full rounded-2xl bg-yellow-400 text-black py-4 font-black" onclick="confirmCfg()">加入</button>
        </div>
    </div>

    <div id="ticket-sheet" class="sheet" onclick="if(event.target===this) closeTicket()">
        <div class="sheet-panel text-center" onclick="event.stopPropagation()">
            <p class="text-[11px] font-black tracking-widest text-neutral-500 uppercase">請出示單號</p>
            <div id="ticket-no" class="ticket-no text-yellow-400 my-3"></div>
            <p id="ticket-meta" class="text-base font-black"></p>
            <p id="ticket-pay" class="text-sm font-bold text-neutral-400 mt-1"></p>
            <div id="ticket-items" class="text-left mt-4 space-y-1 text-sm font-bold"></div>
            <div class="grid grid-cols-2 gap-2 mt-5">
                <button type="button" class="chip-btn min-h-[48px]" onclick="cancelTicket()">作廢此單</button>
                <button type="button" class="pay-btn bg-yellow-400 text-black" onclick="closeTicket()">完成</button>
            </div>
        </div>
    </div>

    <div id="today-sheet" class="sheet" onclick="if(event.target===this) closeToday()">
        <div class="sheet-panel" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-lg font-black">今日店內單</h3>
                <button type="button" class="chip-btn" onclick="closeToday()">關閉</button>
            </div>
            <div id="today-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'mb_kds_token';
        const STORE_KEY = 'mb_pos_store';
        const CATS = [
            { id: 'beef', label: '牛肉' }, { id: 'others', label: '其他' }, { id: 'veggie', label: '素食' },
            { id: 'snacks', label: '小食' }, { id: 'drinks', label: '飲品' }, { id: 'sauces', label: '醬汁' },
        ];
        const PAY_LABEL = { cash: '現金', fps: '轉數快', payme: 'PayMe' };
        const FALLBACK = {
            addon: [
                { id:'a1', name_zh:'自家製酸瓜', price:4 }, { id:'a2', name_zh:'墨西哥酸辣辣椒', price:4 },
                { id:'a3', name_zh:'美國芝士', price:5 }, { id:'a4', name_zh:'煎蛋', price:6 },
                { id:'a5', name_zh:'煙肉', price:12 }, { id:'a6', name_zh:'牛油果片', price:12 },
                { id:'a7', name_zh:'丹麥藍芝士', price:16 }, { id:'a8', name_zh:'炸素雞排', price:23 },
                { id:'a9', name_zh:'安格斯漢堡扒', price:33 },
            ],
            sauce: [
                { id:'sc1', name_zh:'焦糖蒜蓉醬', price:6 }, { id:'sc2', name_zh:'煙燻墨西哥辣椒醬', price:8 },
                { id:'sc3', name_zh:'水牛城辣醬', price:8 }, { id:'sc4', name_zh:'秘製他他醬', price:8 },
                { id:'sc5', name_zh:'藍紋芝士醬', price:8 },
            ],
            combo_snack: [
                { id:'cs1', name_zh:'脆炸薯條 (M)', price:0 }, { id:'cs3', name_zh:'脆炸薯條 (L)', price:4 },
                { id:'cs2', name_zh:'蓮藕脆片 (M)', price:0 }, { id:'cs4', name_zh:'蓮藕脆片 (L)', price:4 },
                { id:'cs5', name_zh:'炸番薯條 (M)', price:6 }, { id:'cs6', name_zh:'炸番薯條 (L)', price:11 },
                { id:'cs7', name_zh:'煙燻雞翼 (3件)', price:6 },
            ],
            combo_drink: [
                { id:'cd1', name_zh:'可口可樂', price:0 }, { id:'cd1a', name_zh:'零系可口可樂', price:0 },
                { id:'cd2', name_zh:'忌廉哥冰', price:0 }, { id:'cd3', name_zh:'梳打水', price:2 },
                { id:'cd4', name_zh:'肉桂凍檸茶', price:3 }, { id:'cd5h', name_zh:'美式咖啡 (熱)', price:6 },
                { id:'cd5c', name_zh:'美式咖啡 (凍)', price:6 }, { id:'cd6h', name_zh:'鮮奶咖啡 (熱)', price:8 },
                { id:'cd6c', name_zh:'鮮奶咖啡 (凍)', price:8 }, { id:'cd7h', name_zh:'朱古力咖啡 (熱)', price:8 },
                { id:'cd7c', name_zh:'朱古力咖啡 (凍)', price:8 }, { id:'cd8h', name_zh:'朱古力 (熱)', price:8 },
                { id:'cd8c', name_zh:'朱古力 (凍)', price:8 }, { id:'cd9', name_zh:'燕麥牛油果沙冰', price:18 },
                { id:'cd10', name_zh:'雙重阿華田沙冰', price:20 },
            ],
        };

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        let token = '';
        let currentStore = localStorage.getItem(STORE_KEY) || 'Sai Ying Pun';
        let currentCat = 'beef';
        let fulfill = 'takeaway';
        let menuItems = [];
        let mods = { addon: [], sauce: [], combo_snack: [], combo_drink: [] };
        let comboBase = 19;
        let cart = [];
        let charging = false;
        let cfgItem = null;
        let cfg = {};
        let cfgEditIndex = -1;
        let lastTicket = null;

        function getToken() { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || token; }
        function saveToken(v) { token = v; localStorage.setItem(TOKEN_KEY, v); sessionStorage.setItem(TOKEN_KEY, v); }
        function itemImg(item) {
            return (item && (item.img || item.image_url)) || '';
        }
        function cloudinaryUrl(url, width) {
            if (!url || typeof url !== 'string') return '';
            const marker = '/image/upload/';
            const idx = url.indexOf(marker);
            if (idx === -1) return url;
            const prefix = url.slice(0, idx + marker.length);
            const parts = url.slice(idx + marker.length).split('/');
            let assetStart = 0;
            while (assetStart < parts.length - 1 && !/^v\d+$/.test(parts[assetStart])) assetStart += 1;
            const assetPath = parts.slice(assetStart).join('/');
            const w = Number(width);
            const tx = Number.isFinite(w) && w > 0 ? `c_limit,w_${Math.round(w)}/f_auto/q_auto` : 'f_auto/q_auto';
            return `${prefix}${tx}/${assetPath}`;
        }
        function thumbHtml(item) {
            const url = itemImg(item);
            if (!url) {
                return `<div class="pos-thumb flex items-center justify-center text-[10px] font-black text-yellow-400">MB</div>`;
            }
            const src = cloudinaryUrl(url, 320);
            return `<div class="pos-thumb"><img src="${src}" alt="" loading="lazy" decoding="async"></div>`;
        }
        function sizesOf(item) { return Array.isArray(item && item.sizes) ? item.sizes : []; }
        function isBurger(item) { return ['beef','others','veggie'].includes(item.category); }
        function isSpicy(item) { return Array.isArray(item.dietary) && item.dietary.some((d) => String(d).includes('🌶')); }
        function modsOf(kind) { return mods[kind] && mods[kind].length ? mods[kind] : FALLBACK[kind]; }
        function findMod(kind, id) { return modsOf(kind).find((m) => m.id === id); }
        function isSold(item) { return !!(item && item.is_sold_out); }

        async function posApi(payload) {
            const res = await fetch('/api/kitchen-menu', {
                method: 'POST',
                headers: { 'Content-Type':'application/json', Authorization:'Bearer ' + getToken() },
                body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            return data;
        }

        async function submitPosLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('pos-login-btn');
            const err = document.getElementById('pos-login-error');
            btn.disabled = true; err.classList.add('hidden');
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type':'application/json' },
                    body: JSON.stringify({ password: document.getElementById('pos-password').value }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || '密碼錯誤');
                saveToken(data.token);
                await bootPos();
            } catch (e) {
                err.textContent = e.message || '登入失敗';
                err.classList.remove('hidden');
            } finally { btn.disabled = false; }
            return false;
        }
        function logoutPos() { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); location.reload(); }

        function markStoreButtons() {
            document.querySelectorAll('[data-branch]').forEach((el) => {
                el.classList.toggle('is-active', el.dataset.branch === currentStore);
            });
        }
        async function selectStore(btn) {
            currentStore = btn.dataset.branch;
            localStorage.setItem(STORE_KEY, currentStore);
            markStoreButtons();
            await loadMenu();
        }
        function setFulfill(next) {
            fulfill = next;
            document.getElementById('fulfill-takeaway').classList.toggle('is-active', next === 'takeaway');
            document.getElementById('fulfill-dine').classList.toggle('is-active', next === 'dine_in');
        }

        function catalogItem(id) {
            return menuItems.find((i) => i && i.id === id) || null;
        }
        function unitOf(line) {
            const direct = Number(line && line.unit);
            if (Number.isFinite(direct) && direct > 0) return direct;
            const item = catalogItem(line && line.menuId);
            const price = Number(item && item.price);
            return Number.isFinite(price) && price > 0 ? price : 0;
        }
        function linePrice(line) {
            let n = unitOf(line);
            const sizes = sizesOf(catalogItem(line.menuId) || {});
            if (line.size) {
                const sz = sizes.find((s) => (s.label || s.value) === line.size);
                n += Number(sz && sz.upcharge) || 0;
            }
            for (const id of line.addonIds || []) n += Number((findMod('addon', id) || {}).price) || 0;
            for (const id of line.sauceIds || []) n += Number((findMod('sauce', id) || {}).price) || 0;
            if (line.comboSnackId && line.comboDrinkId) {
                n += comboBase;
                n += Number((findMod('combo_snack', line.comboSnackId) || {}).price) || 0;
                n += Number((findMod('combo_drink', line.comboDrinkId) || {}).price) || 0;
            }
            return n * (line.qty || 1);
        }
        function cartTotals() {
            const sub = cart.map(linePrice).reduce((a, b) => a + b, 0);
            const hasCombo = cart.some((l) => l.comboSnackId);
            let discount = 0;
            if (currentStore === 'Tsuen Wan (Takeaway Only)') discount = Math.floor(sub * 0.15);
            else if (sub >= 120 || hasCombo) discount = Math.floor(sub * 0.10);
            return { sub, discount, total: sub - discount };
        }

        function openCfg(id, editIndex, presets) {
            const item = menuItems.find((i) => i.id === id);
            if (!item || (isSold(item) && editIndex == null)) return;
            cfgItem = item;
            cfgEditIndex = editIndex == null ? -1 : editIndex;
            const existing = cfgEditIndex >= 0 ? cart[cfgEditIndex] : null;
            const sz = sizesOf(item);
            cfg = {
                size: existing ? existing.size : (sz.length ? (sz[0].label || sz[0].value) : null),
                bun: existing ? (String(existing.detailsEn || '').includes('Lettuce') ? 'Lettuce Wrap' : (isBurger(item) ? 'Nissin Bun' : null)) : (isBurger(item) ? 'Nissin Bun' : null),
                spice: existing && String(existing.detailsEn || '').includes('Mild') ? 'Mild' : (isSpicy(item) ? 'Normal' : null),
                temp: existing && String(existing.detailsEn || '').includes('Iced') ? 'Iced' : (item.has_temp ? 'Hot' : null),
                addonIds: existing && Array.isArray(existing.addonIds) ? existing.addonIds.slice() : [],
                sauceIds: existing && Array.isArray(existing.sauceIds) ? existing.sauceIds.slice() : [],
                combo: !!(existing && existing.comboSnackId),
                comboSnackId: (existing && existing.comboSnackId) || null,
                comboDrinkId: (existing && existing.comboDrinkId) || null,
                qty: existing ? existing.qty : 1,
            };
            if (existing && existing.detailsZh && existing.detailsZh.includes('生菜包')) cfg.bun = 'Lettuce Wrap';
            if (presets && typeof presets === 'object') {
                if (presets.qty) cfg.qty = presets.qty;
                if (presets.bun != null) cfg.bun = presets.bun;
                if (presets.spice != null) cfg.spice = presets.spice;
                if (presets.temp != null) cfg.temp = presets.temp;
                if (Array.isArray(presets.addonIds)) cfg.addonIds = presets.addonIds.slice();
                if (presets.combo != null) cfg.combo = !!presets.combo;
                if (presets.comboSnackId !== undefined) cfg.comboSnackId = presets.comboSnackId;
                if (presets.comboDrinkId !== undefined) cfg.comboDrinkId = presets.comboDrinkId;
            }
            document.getElementById('cfg-title').textContent = item.name_zh || item.name_en;
            renderCfg();
            document.getElementById('cfg-sheet').classList.add('is-open');
        }
        function closeCfg() { document.getElementById('cfg-sheet').classList.remove('is-open'); cfgItem = null; cfgEditIndex = -1; }
        function chipRow(title, html) {
            return `<div><div class="text-[11px] font-black text-neutral-500 mb-1">${title}</div><div class="flex flex-wrap gap-1">${html}</div></div>`;
        }
        function optChip(on, label, fn) {
            return `<button type="button" class="chip-btn ${on ? 'is-active' : ''}" onclick="${fn}">${escapeHtml(label)}</button>`;
        }
        function renderCfg() {
            if (!cfgItem) return;
            const item = cfgItem;
            const bits = [];
            bits.push(chipRow('數量', optChip(false,'−','cfg.qty=Math.max(1,(cfg.qty||1)-1);renderCfg()') + `<span class="font-black px-3 py-2">${cfg.qty||1}</span>` + optChip(false,'+','cfg.qty=(cfg.qty||1)+1;renderCfg()')));
            const sz = sizesOf(item);
            if (sz.length) {
                bits.push(chipRow('份量', sz.map((s) => {
                    const label = s.label || s.value;
                    return optChip(cfg.size === label, label + (s.upcharge ? ' +$' + s.upcharge : ''), `setCfg('size', '${escapeHtml(label)}')`);
                }).join('')));
            }
            if (isBurger(item)) {
                bits.push(chipRow('包', optChip(cfg.bun === 'Nissin Bun', '日清麵包', "setCfg('bun','Nissin Bun')") + optChip(cfg.bun === 'Lettuce Wrap', '生菜包', "setCfg('bun','Lettuce Wrap')")));
            }
            if (isSpicy(item)) {
                bits.push(chipRow('辣度', optChip(cfg.spice === 'Normal', '正常', "setCfg('spice','Normal')") + optChip(cfg.spice === 'Mild', '小辣', "setCfg('spice','Mild')")));
            }
            if (item.has_temp) {
                bits.push(chipRow('溫度', optChip(cfg.temp === 'Hot', '熱', "setCfg('temp','Hot')") + optChip(cfg.temp === 'Iced', '凍', "setCfg('temp','Iced')")));
            }
            if (isBurger(item)) {
                bits.push(chipRow('加料', modsOf('addon').map((a) => optChip(cfg.addonIds.includes(a.id), `${a.name_zh || a.name_en} +$${a.price}`, `toggleCfg('addonIds','${a.id}')`)).join('')));
                bits.push(chipRow('加醬', modsOf('sauce').map((a) => optChip(cfg.sauceIds.includes(a.id), `${a.name_zh || a.name_en} +$${a.price}`, `toggleCfg('sauceIds','${a.id}')`)).join('')));
                bits.push(chipRow('套餐 +$' + comboBase, optChip(!cfg.combo, '單點', "setCfg('combo', false)") + optChip(cfg.combo, '套餐', "setCfg('combo', true)")));
                if (cfg.combo) {
                    bits.push(chipRow('套餐小食（請揀）', modsOf('combo_snack').map((m) =>
                        optChip(cfg.comboSnackId === m.id, `${m.name_zh || m.name_en} +$${m.price}`, `setCfg('comboSnackId','${m.id}')`)
                    ).join('')));
                    bits.push(chipRow('套餐飲品（請揀）', modsOf('combo_drink').map((m) =>
                        optChip(cfg.comboDrinkId === m.id, `${m.name_zh || m.name_en} +$${m.price}`, `setCfg('comboDrinkId','${m.id}')`)
                    ).join('')));
                    if (!cfg.comboSnackId || !cfg.comboDrinkId) {
                        bits.push('<p class="text-sm font-bold text-red-300">套餐未揀齊。客人講咗先剔，冇講就要問：小食要咩、飲品要咩。</p>');
                    }
                }
            }
            document.getElementById('cfg-body').innerHTML = bits.join('');
            const preview = buildLineFromCfg();
            document.getElementById('cfg-price').textContent = '$' + linePrice(preview);
            const addBtn = document.getElementById('cfg-add');
            const comboNeed = isBurger(item) && cfg.combo && (!cfg.comboSnackId || !cfg.comboDrinkId);
            addBtn.disabled = comboNeed;
            addBtn.textContent = comboNeed
                ? '請揀套餐小食同飲品'
                : ((cfgEditIndex >= 0 ? '更新　$' : '加入　$') + linePrice(preview));
        }
        function setCfg(key, value) {
            cfg[key] = value;
            if (key === 'combo' && value === false) {
                cfg.comboSnackId = null;
                cfg.comboDrinkId = null;
            }
            renderCfg();
        }
        function toggleCfg(key, id) {
            const arr = cfg[key].slice();
            const i = arr.indexOf(id);
            if (i >= 0) arr.splice(i, 1); else arr.push(id);
            cfg[key] = arr;
            renderCfg();
        }
        function buildLineFromCfg() {
            const item = cfgItem;
            const detailsZh = [];
            const detailsEn = [];
            if (cfg.size) { detailsZh.push('份量: ' + cfg.size); detailsEn.push('Size: ' + cfg.size); }
            if (cfg.bun) {
                detailsZh.push(cfg.bun === 'Nissin Bun' ? '日清麵包' : '生菜包');
                detailsEn.push(cfg.bun);
            }
            if (cfg.spice) {
                detailsZh.push('辣度: ' + (cfg.spice === 'Mild' ? '小辣' : '正常'));
                detailsEn.push('Spice: ' + cfg.spice);
            }
            if (cfg.temp) {
                detailsZh.push(cfg.temp === 'Iced' ? '凍' : '熱');
                detailsEn.push(cfg.temp);
            }
            for (const id of cfg.addonIds) {
                const m = findMod('addon', id);
                if (m) { detailsZh.push(m.name_zh || m.name_en); detailsEn.push(m.name_en || m.name_zh); }
            }
            for (const id of cfg.sauceIds) {
                const m = findMod('sauce', id);
                if (m) { detailsZh.push(m.name_zh || m.name_en); detailsEn.push(m.name_en || m.name_zh); }
            }
            let comboSnackId = null, comboDrinkId = null;
            if (cfg.combo) {
                comboSnackId = cfg.comboSnackId;
                comboDrinkId = cfg.comboDrinkId;
                const s = findMod('combo_snack', comboSnackId);
                const d = findMod('combo_drink', comboDrinkId);
                detailsZh.push(`套餐 [${(s && s.name_zh) || ''}, ${(d && d.name_zh) || ''}]`);
                detailsEn.push(`Combo [${(s && s.name_en) || ''}, ${(d && d.name_en) || ''}]`);
            }
            return {
                menuId: item.id,
                nameEn: item.name_en,
                nameZh: item.name_zh,
                size: cfg.size,
                qty: Math.max(1, Number(cfg.qty) || 1),
                addonIds: cfg.addonIds.slice(),
                sauceIds: cfg.sauceIds.slice(),
                comboSnackId,
                comboDrinkId,
                detailsEn: detailsEn.join(' • '),
                detailsZh: detailsZh.join(' • '),
                unit: Number(item.price) || 0,
            };
        }
        function confirmCfg() {
            if (!cfgItem) return;
            if (sizesOf(cfgItem).length && !cfg.size) return alert('請揀份量');
            if (isBurger(cfgItem) && cfg.combo && (!cfg.comboSnackId || !cfg.comboDrinkId)) {
                return alert('套餐請揀小食同飲品。');
            }
            const line = buildLineFromCfg();
            line.unit = unitOf({ menuId: cfgItem.id, unit: Number(cfgItem.price) || 0 });
            if (cfgEditIndex >= 0) cart[cfgEditIndex] = line;
            else cart.push(line);
            closeCfg();
            renderCart();
        }
        function changeQty(i, delta) {
            cart[i].qty += delta;
            if (cart[i].qty <= 0) cart.splice(i, 1);
            renderCart();
        }
        function removeLine(i) { cart.splice(i, 1); renderCart(); }
        function clearCart() { cart = []; renderCart(); }

        async function loadMenu() {
            const data = await posApi({ action: 'list', store_name: currentStore });
            menuItems = data.items || [];

            for (const m of data.modifiers || []) {

            }
            mods = grouped;
            if (Number.isFinite(Number(data.combo_base))) comboBase = Number(data.combo_base);

        let voiceRec = null;
        let voiceWanted = false;

        let voiceResumeToken = 0;
        let toastTimer = null;

        function speechEngine() {
            return window.SpeechRecognition || window.webkitSpeechRecognition || null;
        }
        function voiceHeardText() {
            const primary = (voiceFinal + (voiceInterim ? ' ' + voiceInterim : '')).trim();
            if (primary) return primary;
            return voiceAlts.map((s) => String(s || '').trim()).filter(Boolean)[0] || '';
        }
        function clearVoiceBuffer() {
            voiceFinal = '';
            voiceInterim = '';
            voiceAlts = [];
            updateVoiceLive();
        }
        function updateVoiceLive() {
            const live = document.getElementById('voice-live');
            if (!live) return;
            const text = (voiceFinal + (voiceInterim ? ' ' + voiceInterim : '')).trim();
            live.textContent = text || '聽緊咪高峰…你可以慢慢講。';
        }
        function pauseListen() {
            voiceWanted = false;
            try { if (voiceRec) voiceRec.stop(); } catch (_) {}
            voiceRec = null;
        }
        function resumeListen(msg) {
            if (!document.getElementById('voice-sheet').classList.contains('is-open')) return;
            clearVoiceBuffer();
            const live = document.getElementById('voice-live');
            if (live) live.textContent = msg || '而家輪到你講。講完撳大紅掣。';
            voiceWanted = true;
            const btn = document.getElementById('mic-btn');
            if (btn) {
                btn.classList.add('is-on');
                btn.textContent = '聽緊… 講完入去撳「講完呢句」';
            }
            beginRec();
        }
        function scheduleResumeListen(ms, msg) {
            const token = ++voiceResumeToken;
            setTimeout(() => {
                if (token !== voiceResumeToken) return;
                resumeListen(msg);
            }, ms);
        }
        function stopVoiceEngine() {
            voiceResumeToken += 1;
            pauseListen();
            const btn = document.getElementById('mic-btn');
            if (btn) {
                btn.classList.remove('is-on');
                btn.textContent = '講單';
            }
            try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}
        }
        function speakAskThenListen(text) {
            pauseListen();
            const live = document.getElementById('voice-live');
            if (live) live.textContent = '問緊你，請等我講完再答。';
            let settled = false;
            const done = () => {
                if (settled) return;
                settled = true;
                scheduleResumeListen(500, '而家輪到你講。講完撳大紅掣。');
            };
            try {
                if (!window.speechSynthesis) {
                    done();
                    return;
                }
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-HK';
                u.rate = 1.02;
                u.onend = done;
                u.onerror = done;
                window.speechSynthesis.speak(u);
                setTimeout(done, 9000);
            } catch (_) {
                done();
            }
        }
        function beginRec() {
            const SR = speechEngine();
            if (!SR || !voiceWanted) return;
            if (voiceRec) return;
            const rec = new SR();
            voiceRec = rec;
            rec.lang = 'zh-HK';
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 5;
            rec.onresult = (ev) => {
                if (!voiceWanted) return;
                let interim = '';
                for (let i = ev.resultIndex; i < ev.results.length; i++) {
                    const row = ev.results[i];
                    const piece = row[0] && row[0].transcript;
                    if (!piece) continue;
                    if (row.isFinal) {
                        voiceFinal += (voiceFinal && !voiceFinal.endsWith(' ') ? ' ' : '') + piece;
                        for (let a = 0; a < row.length; a++) {
                            const alt = row[a] && row[a].transcript;
                            if (alt) voiceAlts.push(alt);
                        }
                    } else interim += piece;
                }
                voiceInterim = interim;
                updateVoiceLive();
            };
            rec.onerror = (ev) => {
                if (!voiceWanted) return;
                if (ev.error === 'no-speech' || ev.error === 'aborted' || ev.error === 'network') return;
                if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
                    stopVoiceEngine();
                    alert('請允許咪高峰。iPhone 要用 Safari 打開本頁；商米用 Chrome。');
                }
            };
            rec.onend = () => {
                if (voiceRec === rec) voiceRec = null;
                if (voiceWanted && !voiceRec) setTimeout(beginRec, 160);
            };
            try {
                rec.start();
            } catch (_) {
                voiceRec = null;
                if (voiceWanted) setTimeout(beginRec, 280);
            }
        }
        function resetVoiceAskUi() {
            document.getElementById('voice-ask').textContent = '第一步：漢堡要邊款？';
            document.getElementById('voice-summary').classList.add('hidden');
            document.getElementById('voice-summary').innerHTML = '';
            document.getElementById('voice-done-btn').textContent = '我講完，跟住問';
            document.getElementById('voice-hint').textContent = '唔知講咩就唔使講，直接撳上面黃色建議。';
            renderVoiceChoices(nextAsk(null).choices);
        }
        function startVoiceSession() {
            const SR = speechEngine();
            if (!SR) {
                alert('呢部機嘅瀏覽器唔支援語音。商米／Android 請用 Chrome 打開本頁。');
                return;
            }
            clearTimeout(voiceFinishTimer);
            voiceFinishTimer = null;
            voiceBusy = false;
            voiceJob = null;
            voiceResumeToken += 1;
            clearVoiceBuffer();
            resetVoiceAskUi();
            document.getElementById('voice-sheet').classList.add('is-open');
            resumeListen('聽緊。講完成句就撳「講完呢句」。');
        }
        function finishVoice() {
            if (voiceBusy) return;
            if (!document.getElementById('voice-sheet').classList.contains('is-open')) return;
            voiceBusy = true;
            const snap = voiceHeardText();
            const live = document.getElementById('voice-live');
            if (live) live.textContent = snap || '截緊最後一句…';
            pauseListen();
            clearTimeout(voiceFinishTimer);
            voiceFinishTimer = setTimeout(() => {
                voiceFinishTimer = null;
                let text = (snap + ' ' + voiceHeardText()).trim();
                if (looksLikePromptEcho(text)) text = '';
                clearVoiceBuffer();
                try {
                    handleVoiceTurn(text);
                } catch (err) {
                    document.getElementById('voice-live').textContent = '處理失敗：' + ((err && err.message) || err);
                    scheduleResumeListen(400);
                } finally {
                    voiceBusy = false;
                }
            }, 480);
        }
        function closeVoice() {
            clearTimeout(voiceFinishTimer);
            voiceFinishTimer = null;
            voiceBusy = false;
            voiceJob = null;
            stopVoiceEngine();
            document.getElementById('voice-sheet').classList.remove('is-open');
            resetVoiceAskUi();
        }
        function showToast(msg) {
            const el = document.getElementById('pos-toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('is-on');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('is-on'), 3200);
        }
        function flashCart() {
            const el = document.getElementById('pos-cart');
            if (!el) return;
            el.classList.add('is-flash');
            try { el.scrollIntoView({ behavior: 'smooth', block: 'end' }); } catch (_) {}
            const list = document.getElementById('cart-list');
            if (list) try { list.scrollTop = list.scrollHeight; } catch (_) {}
            setTimeout(() => el.classList.remove('is-flash'), 1600);
        }

        function compact(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }
        function foldZh(s) {
            return compact(String(s || '').normalize('NFKC'))
                .replace(/[\u200B-\u200D\uFEFF]/g, '')
                .replace(/[^\u4e00-\u9fff0-9a-z]/g, '')
                .replace(/我要|我想要|要一個|一個|嘅|的|啦|呀|喎|咁|同埋|跟住|然後|然后/g, '')
                .replace(/汉堡|漢飽|漢保|漢寶|漢堡包/g, '漢堡')
                .replace(/薯条/g, '薯條')
                .replace(/可乐|可樂/g, '可樂')
                .replace(/经典|金典|經點/g, '經典')
                .replace(/三點二一|三二一|threetwoone/g, '321')
                .replace(/套餐|setmeal|combo/g, '套餐')
                .replace(/cheeseburger|芝士漢堡/g, '經典芝士牛肉')
                .replace(/classicbeef|經典牛/g, '經典芝士牛肉');
        }
        function qtyWord(n) {
            const map = { '一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
            if (map[n]) return map[n];
            const x = Number(n);
            return Number.isFinite(x) && x > 0 ? x : 1;
        }
        function parseQty(text) {
            const t = String(text || '');
            const m = t.match(/([一二兩三四五六七八九十两]|[1-9]|10)\s*(份|個|个|隻|只|客)/);
            return m ? qtyWord(m[1]) : 1;
        }
        function aliasesFor(item) {
            const extra = {
                b1: ['經典芝士牛肉漢堡','經典芝士牛肉','經典芝士','經典牛肉','芝士牛肉','經典漢堡','芝士漢堡','cheeseburger','classicbeef'],
                b3: ['墨辣芝士牛肉','墨辣牛肉','墨辣漢堡','hottestbeef'],
                b4: ['墨辣藍紋芝士牛肉','墨辣藍紋','藍紋芝士牛肉'],
                b2: ['和牛','wagyu','321','三二一','3.2.1'],
                c1: ['水牛城脆雞','水牛城','脆雞'],
                v2: ['煙三文魚','三文魚'],
                v1: ['素食','素漢堡','啡菇'],
            };
            return [item.name_zh, item.name_en, item.id].concat(extra[item.id] || []).filter(Boolean);
        }
        function scoreItem(item, t) {
            let best = 0;
            for (const raw of aliasesFor(item)) {
                const name = foldZh(raw);
                if (!name || name.length < 2) continue;
                if (t.includes(name)) {
                    best = Math.max(best, 100 + name.length);
                    continue;
                }
                let hit = 0;
                for (const ch of name) if (t.includes(ch)) hit += 1;
                if (name.length && hit / name.length >= 0.7) best = Math.max(best, Math.round((hit / name.length) * 50) + name.length);
            }
            return best;
        }
        function pickAddons(text) {
            const t = compact(text);
            const hits = [];
            const rules = [
                ['a4', /煎蛋|加蛋|荷包蛋/],
                ['a5', /煙肉|烟肉|bacon/],
                ['a6', /牛油果/],
                ['a7', /藍芝士|蓝芝士|藍紋加/],
                ['a3', /加芝士|美國芝士|加片芝士/],
                ['a1', /酸瓜/],
                ['a2', /jalapeno|辣椒圈|墨西哥辣椒/],
                ['a8', /素雞|炸素/],
                ['a9', /加扒|多塊肉|加牛肉扒/],
            ];
            for (const [id, re] of rules) {
                if (re.test(t)) hits.push(id);
            }
            return hits;
        }
        function snackNeedsSize(kind) { return kind && kind !== 'wings'; }
        function drinkNeedsTemp(kind) { return ['americano', 'latte', 'mocha', 'choco'].includes(kind); }
        function parseSnackKind(text) {
            const t = foldZh(text);
            if (/番薯/.test(t)) return 'sweet';
            if (/蓮藕/.test(t)) return 'lotus';
            if (/雞翼|鸡翼|煙燻翼/.test(t)) return 'wings';
            if (/薯條|薯条|fries/.test(t)) return 'fries';
            return null;
        }
        function parseSnackSize(text, kind) {
            const raw = compact(String(text || '').normalize('NFKC'));
            const t = foldZh(text);
            if (/大薯條|薯條大|大蓮藕|蓮藕大|大番薯|番薯大|大份|大號|要大|large/.test(t)) return 'L';
            if (/^(l|el)$/.test(raw) || (/(^|[^a-z])l([^a-z]|$)/.test(raw) && !/mild|latte/.test(raw))) return 'L';
            if (/^(m|em)$/.test(raw) || /中份|中號|medium/.test(t) || /(^|[^a-z])m([^a-z]|$)/.test(raw)) return 'M';
            if (kind && /中/.test(t)) return 'M';
            if (kind && /大/.test(t) && !/小辣|微辣/.test(t)) return 'L';
            if (kind && /(細|小份|細份)/.test(t) && !/小辣|微辣/.test(t)) return 'M';
            return null;
        }
        function parseDrinkKind(text) {
            const t = foldZh(text);
            if (/零糖|無糖|无糖|zero/.test(t)) return 'zero';
            if (/忌廉/.test(t)) return 'cream';
            if (/檸茶|柠茶/.test(t)) return 'lemon';
            if (/梳打/.test(t)) return 'soda';
            if (/美式/.test(t)) return 'americano';
            if (/拿鐵|鮮奶咖啡|鲜奶咖啡|latte/.test(t)) return 'latte';
            if (/朱古力咖啡|mocha/.test(t)) return 'mocha';
            if (/燕麥|牛油果沙冰/.test(t)) return 'avo';
            if (/阿華田/.test(t)) return 'ovaltine';
            if (/朱古力/.test(t)) return 'choco';
            if (/可樂|可乐|coke/.test(t)) return 'coke';
            return null;
        }
        function parseDrinkTemp(text) {
            const t = foldZh(text);
            if (/凍|冻|冰|iced|cold/.test(t)) return 'Iced';
            if (/熱|热|hot/.test(t)) return 'Hot';
            return null;
        }
        function snackIdOf(kind, size) {
            const spec = SNACK_KIND[kind];
            if (!spec) return null;
            if (spec.id) return spec.id;
            if (!size) return null;
            return size === 'L' ? spec.l : spec.m;
        }
        function drinkIdOf(kind, temp) {
            const spec = DRINK_KIND[kind];
            if (!spec) return null;
            if (spec.id) return spec.id;
            if (!temp) return null;
            return temp === 'Iced' ? spec.iced : spec.hot;
        }
        function findLiveItem(id) {
            return menuItems.find((i) => i.id === id && !isSold(i)) || null;
        }
        function guessItemByKeywords(text) {
            const t = foldZh(text);
            const rules = [
                ['b4', /墨辣.*(藍|蓝)|藍紋|蓝纹/],
                ['b3', /墨辣|hottest/],
                ['b2', /和牛|wagyu|321/],
                ['b1', /經典|classic|芝士牛|芝士漢堡|cheeseburger/],
                ['c1', /水牛城|脆雞|chicken/],
                ['v2', /三文魚|三文鱼|salmon/],
            ];
            for (const [id, re] of rules) {
                const item = findLiveItem(id);
                if (item && re.test(t)) return item;
            }
            if (/漢堡|burger/.test(t) && !/墨辣|和牛|雞|鸡|素/.test(t)) return findLiveItem('b1');
            if (/321/.test(t) || /三二一|三點二/.test(t)) return findLiveItem('b2');
            return menuItems.find((i) => !isSold(i) && foldZh(i.name_zh || '').length >= 2 && t.includes(foldZh(i.name_zh))) || null;
        }
        function parseVoiceOrder(text) {
            const original = String(text || '').trim();
            const remaining = foldZh(original);
            const wantCombo = /套餐|combo/.test(remaining);
            const bun = /生菜/.test(remaining) ? 'Lettuce Wrap' : 'Nissin Bun';
            const spice = /小辣|微辣/.test(remaining) ? 'Mild' : 'Normal';
            const qty = parseQty(original);
            const live = menuItems.filter((i) => !isSold(i));
            const ranked = live.map((item) => ({ item, score: scoreItem(item, remaining) })).sort((a, b) => b.score - a.score);
            let picked = ranked[0] && ranked[0].score >= 100 ? ranked[0].item : null;
            if (!picked) picked = guessItemByKeywords(original);
            const snackKind = wantCombo ? parseSnackKind(original) : null;
            const drinkKind = wantCombo ? parseDrinkKind(original) : null;
            return {
                original,
                item: picked,
                qty: qty || 1,
                bun,
                spice,
                addonIds: pickAddons(original),
                combo: !!(wantCombo && picked && isBurger(picked)),
                snackKind,
                snackSize: snackKind ? parseSnackSize(original, snackKind) : null,
                drinkKind,
                drinkTemp: drinkKind ? parseDrinkTemp(original) : null,
            };
        }
        function mergeVoiceAnswer(job, text) {
            if (!job || !text) return;
            const snack = parseSnackKind(text);
            const drink = parseDrinkKind(text);
            const bunLettuce = /生菜/.test(foldZh(text));
            const addons = pickAddons(text);
            if (snack) job.snackKind = snack;
            const size = parseSnackSize(text, job.snackKind);
            if (size && snackNeedsSize(job.snackKind)) job.snackSize = size;
            if (drink) job.drinkKind = drink;
            const temp = parseDrinkTemp(text);
            if (temp && drinkNeedsTemp(job.drinkKind)) job.drinkTemp = temp;
            if (bunLettuce) job.bun = 'Lettuce Wrap';
            if (addons.length) {
                const set = new Set(job.addonIds || []);
                addons.forEach((id) => set.add(id));
                job.addonIds = Array.from(set);
            }
        }
        function snackChoices() {
            return [
                { label: '薯條', say: '薯條', group: '小食' },
                { label: '蓮藕', say: '蓮藕', group: '小食' },
                { label: '番薯', say: '番薯', group: '小食' },
                { label: '雞翼', say: '雞翼', group: '小食' },
            ];
        }
        function drinkChoices() {
            return [
                { label: '可樂', say: '可樂', group: '嘢飲' },
                { label: '零糖', say: '零糖可樂', group: '嘢飲' },
                { label: '忌廉', say: '忌廉', group: '嘢飲' },
                { label: '凍檸茶', say: '檸茶', group: '嘢飲' },
                { label: '梳打', say: '梳打', group: '嘢飲' },
                { label: '美式', say: '美式', group: '嘢飲' },
                { label: '拿鐵', say: '拿鐵', group: '嘢飲' },
                { label: '朱古力', say: '朱古力', group: '嘢飲' },
            ];
        }
        function nextAsk(job) {
            if (!job || !job.item) {
                return {
                    step: 'item',
                    prompt: '漢堡要邊款？',
                    choices: [
                        { label: '經典芝士套餐', say: '經典芝士牛肉套餐' },
                        { label: '三二一套餐', say: '321套餐' },
                        { label: '墨辣套餐', say: '墨辣芝士牛肉套餐' },
                        { label: '經典芝士（單點）', say: '經典芝士牛肉' },
                    ],
                };
            }
            if (job.combo) {
                const needSnack = !job.snackKind;
                const needSize = !needSnack && snackNeedsSize(job.snackKind) && !job.snackSize;
                const needDrink = !job.drinkKind;
                const needTemp = !needDrink && drinkNeedsTemp(job.drinkKind) && !job.drinkTemp;
                if (needSnack && needDrink) {
                    return { step: 'sides', prompt: '小食同嘢飲呢？', choices: snackChoices().concat(drinkChoices()) };
                }
                if (needSnack) {
                    return { step: 'snack_kind', prompt: '小食呢？', choices: snackChoices() };
                }
                if (needSize) {
                    return {
                        step: 'snack_size',
                        prompt: '要中定大？',
                        choices: [
                            { label: '中', say: '中' },
                            { label: '大', say: '大' },
                        ],
                    };
                }
                if (needDrink) {
                    return { step: 'drink_kind', prompt: '嘢飲呢？', choices: drinkChoices() };
                }
                if (needTemp) {
                    return {
                        step: 'drink_temp',
                        prompt: '熱定凍？',
                        choices: [
                            { label: '熱', say: '熱' },
                            { label: '凍', say: '凍' },
                        ],
                    };
                }
            }
            return { step: 'done', prompt: '', choices: [] };
        }
        function renderVoiceChoices(choices) {
            const box = document.getElementById('voice-choices');
            if (!box) return;
            const list = Array.isArray(choices) ? choices : [];
            const groups = [];
            for (const c of list) {
                const name = c.group || '';
                if (!groups.length || groups[groups.length - 1].name !== name) groups.push({ name, items: [] });
                groups[groups.length - 1].items.push(c);
            }
            box.innerHTML = groups.map((g) => {
                const head = g.name
                    ? `<div style="grid-column:1/-1" class="text-[11px] font-black text-neutral-500 mt-1">${escapeHtml(g.name)}</div>`
                    : '';
                const btns = g.items.map((c) =>
                    `<button type="button" class="voice-choice" data-say="${escapeHtml(c.say)}" onclick="pickVoiceChoice(this.dataset.say)">${escapeHtml(c.label)}</button>`
                ).join('');
                return head + btns;
            }).join('');
        }
        function pickVoiceChoice(say) {
            voiceResumeToken += 1;
            voiceBusy = false;
            try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}
            pauseListen();
            clearVoiceBuffer();
            const live = document.getElementById('voice-live');
            if (live) live.textContent = '揀咗：' + say;
            handleVoiceTurn(say);
        }
        function voiceSummaryHtml(job) {
            if (!job || !job.item) return '';
            const bits = [`${job.qty}× ${job.item.name_zh || job.item.name_en}`];
            bits.push(job.combo ? '套餐' : '單點');
            if (job.combo) {
                const snack = job.snackKind
                    ? (SNACK_KIND[job.snackKind].zh + (job.snackSize ? ' ' + (job.snackSize === 'L' ? '大' : '中') : (snackNeedsSize(job.snackKind) ? '（未揀中／大）' : '')))
                    : '小食未揀';
                const drink = job.drinkKind
                    ? (DRINK_KIND[job.drinkKind].zh + (job.drinkTemp ? (job.drinkTemp === 'Iced' ? ' 凍' : ' 熱') : (drinkNeedsTemp(job.drinkKind) ? '（未揀熱凍）' : '')))
                    : '飲品未揀';
                bits.push(snack);
                bits.push(drink);
            }
            if (job.bun === 'Lettuce Wrap') bits.push('生菜包');
            return bits.map((b) => `<div>${escapeHtml(b)}</div>`).join('');
        }
        function renderVoiceAsk(ask) {
            document.getElementById('voice-ask').textContent = ask.prompt || '而家可以講';
            const box = document.getElementById('voice-summary');
            if (voiceJob && voiceJob.item) {
                box.classList.remove('hidden');
                box.innerHTML = voiceSummaryHtml(voiceJob);
            }
            renderVoiceChoices(ask.choices);
            document.getElementById('voice-hint').textContent = '最穩係撳黃色建議。要講就講完再撳大紅掣。';
            document.getElementById('voice-done-btn').textContent = '我講完，跟住問';
        }
        function looksLikePromptEcho(text) {
            const t = foldZh(text);
            if (!t) return false;
            const snackHits = [/薯條/, /蓮藕/, /番薯/, /雞翼/].filter((re) => re.test(t)).length;
            const drinkHits = [/可樂/, /忌廉/, /美式/, /拿鐵/, /朱古力/, /檸茶/, /梳打/].filter((re) => re.test(t)).length;
            return snackHits >= 2 || drinkHits >= 2 || (t.includes('套餐小食') || t.includes('飲品要'));
        }
        function jobFingerprint(job) {
            if (!job) return '';
            return [job.item && job.item.id, job.combo, job.snackKind, job.snackSize, job.drinkKind, job.drinkTemp, job.qty].join('|');
        }
        function handleVoiceTurn(text) {
            if (!text || looksLikePromptEcho(text)) {
                document.getElementById('voice-live').textContent = text && looksLikePromptEcho(text)
                    ? '聽到嘅係問題本身。唔使講，直接撳黃色建議。'
                    : '冇聽到內容。唔使估，直接撳上面黃色建議。';
                scheduleResumeListen(300);
                return;
            }
            if (!voiceJob || !voiceJob.item) {
                voiceJob = parseVoiceOrder(text);
                if (!voiceJob.item) {
                    renderVoiceAsk(nextAsk(null));
                    document.getElementById('voice-live').textContent = '聽到「' + text + '」，認唔到。撳黃色建議就得。';
                    scheduleResumeListen(300);
                    return;
                }
            } else {
                const before = jobFingerprint(voiceJob);
                mergeVoiceAnswer(voiceJob, text);
                if (jobFingerprint(voiceJob) === before) {
                    const ask = nextAsk(voiceJob);
                    document.getElementById('voice-live').textContent = '聽到「' + text + '」，認唔到。撳黃色建議就得。';
                    renderVoiceAsk(ask);
                    scheduleResumeListen(400);
                    return;
                }
            }
            const ask = nextAsk(voiceJob);
            if (ask.step === 'done') {
                commitVoiceJob();
                return;
            }
            renderVoiceAsk(ask);
            speakAskThenListen(ask.prompt);
        }
        function commitVoiceJob() {
            const job = voiceJob;
            if (!job || !job.item) return;
            if (job.combo) {
                job.comboSnackId = snackIdOf(job.snackKind, job.snackSize);
                job.comboDrinkId = drinkIdOf(job.drinkKind, job.drinkTemp);
                if (!job.comboSnackId || !job.comboDrinkId) {
                    const ask = nextAsk(job);
                    renderVoiceAsk(ask);
                    speakAskThenListen(ask.prompt);
                    return;
                }
            }
            const prevItem = cfgItem;
            const prevCfg = cfg;
            cfgItem = job.item;
            const sz = sizesOf(job.item);
            cfg = {
                size: sz.length ? (sz[0].label || sz[0].value) : null,
                bun: isBurger(job.item) ? (job.bun || 'Nissin Bun') : null,
                spice: isSpicy(job.item) ? (job.spice || 'Normal') : null,
                temp: job.item.has_temp ? 'Hot' : null,
                addonIds: Array.isArray(job.addonIds) ? job.addonIds.slice() : [],
                sauceIds: [],
                combo: !!job.combo,
                comboSnackId: job.comboSnackId || null,
                comboDrinkId: job.comboDrinkId || null,
                qty: job.qty || 1,
            };
            const line = buildLineFromCfg();
            line.unit = unitOf({ menuId: job.item.id, unit: Number(job.item.price) || 0 });
            cfgItem = prevItem;
            cfg = prevCfg;
            cart.push(line);
            closeVoice();
            renderCart();
            flashCart();
            const t = cartTotals();
            showToast('已加入 ' + (line.qty || 1) + '× ' + (line.nameZh || line.nameEn) + '。小計 $' + t.sub + '，實收 $' + t.total);
        }

        async function charge(payMethod, skipConfirm) {
            if (charging || !cart.length) return;
            const t = cartTotals();
            if (!skipConfirm && !confirm(`收 ${PAY_LABEL[payMethod]} $${t.total}？`)) return;
            charging = true;
            const snapshot = cart.slice();
            try {
                const items = snapshot.map((line) => ({
                    menuId: line.menuId,
                    nameEn: line.nameEn,
                    nameZh: line.nameZh,
                    size: line.size || null,
                    qty: line.qty,
                    addonIds: line.addonIds || [],
                    sauceIds: line.sauceIds || [],
                    comboSnackId: line.comboSnackId || null,
                    comboDrinkId: line.comboDrinkId || null,
                    detailsEn: line.detailsEn,
                    detailsZh: line.detailsZh,
                }));
                const data = await posApi({
                    action: 'create_pos_order',
                    store_name: currentStore,
                    pay_method: payMethod,
                    fulfill,
                    customer_name: document.getElementById('guest-name').value.trim(),
                    note: document.getElementById('order-note').value.trim(),
                    items,
                });
                clearCart();
                document.getElementById('guest-name').value = '';
                document.getElementById('order-note').value = '';
                showTicket(data, items);
            } catch (err) {
                alert('入單失敗：' + (err.message || err));
            } finally { charging = false; }
        }

        async function bootPos() {
            document.getElementById('pos-lock').classList.add('hidden');
            document.getElementById('pos-app').classList.remove('hidden');
            markStoreButtons();
            await loadMenu();
        }
        window.onload = async () => {
            const existing = getToken();
            if (!existing) { markStoreButtons(); return; }
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type':'application/json' },
                    body: JSON.stringify({ token: existing }),
                });
                if (!res.ok) return;
                const data = await res.json().catch(() => ({}));
                if (data.token) saveToken(data.token);
                await bootPos();
            } catch (_) {}
        };
    </script>
