<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MB POS">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="noindex,nofollow">
    <link rel="manifest" href="/pos-manifest.json">

    <title>Mirror Burger | 測試 POS</title>
    <link href="./output.css?v=2.0" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background:#0a0a0a; color:#f5f5f5; font-family:"Avenir Next","Helvetica Neue","PingFang HK","Noto Sans TC",sans-serif; min-height:100dvh; }
        .chip-btn { min-height:44px; font-weight:800; font-size:13px; padding:0 12px; border-radius:10px; border:1px solid #333; background:#1a1a1a; color:#e5e5e5; }
        .chip-btn.is-active { background:#FFD131; color:#0a0a0a; border-color:#FFD131; }
        .item-btn { text-align:left; border:1px solid #333; background:#171717; border-radius:14px; padding:10px 12px; cursor:pointer; min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .pos-thumb { aspect-ratio: 1 / 1; width: 100%; max-height: 180px; background:#111; overflow:hidden; border-radius:10px; margin-bottom:8px; }
        .pos-thumb img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; }
        .pay-btn { min-height:52px; font-weight:900; border-radius:14px; font-size:15px; }
        #voice-live-bar { display:none; }
        #voice-live-bar.is-on { display:block; }
        .chip-btn:disabled { opacity:.35; pointer-events:none; }
        #pos-queue-bar { background:#78350f; color:#ffedd5; border-bottom:1px solid #b45309; }
        .mic-btn.is-on { background:#b91c1c; color:#fff; border-color:#b91c1c; }
        #pos-cart.is-flash { box-shadow: inset 0 0 0 2px #FFD131; }
        #pos-toast { position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); z-index:95; display:none; background:#14532d; border:1px solid #22c55e; color:#ecfccb; border-radius:14px; padding:12px 14px; font-weight:800; }
        #pos-toast.is-on { display:block; }
        #print-status.is-on { color:#0a0a0a; background:#86efac; border-color:#86efac; }
        .sheet { position:fixed; inset:0; z-index:80; display:none; background:#00000088; }
        .sheet.is-open { display:block; }
        .sheet-panel { position:absolute; left:0; right:0; bottom:0; max-height:90dvh; overflow:auto; background:#111; border-radius:20px 20px 0 0; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
        .ticket-no { font-size:clamp(42px, 12vw, 88px); line-height:1; font-weight:900; letter-spacing:-.04em; }
        @media (max-width: 767px) {
            #pos-cart {
                max-height: 48vh;
                overflow: hidden;
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
            #pos-menu { padding-bottom: 8px; }
            #cart-list { min-height: 0; }
        }
    </style>
</head>
<body class="antialiased">
    <div id="pos-toast" role="status"></div>
    <div id="pos-lock" class="fixed inset-0 z-[100] bg-black flex items-center justify-center px-6">
        <form class="w-full max-w-sm space-y-5" method="post" action="#" onsubmit="submitPosLogin(event); return false;">
            <div class="text-center space-y-2">
                <p class="text-[11px] font-black tracking-widest text-amber-400 uppercase">Test POS · v2026.08.20h</p>
                <h1 class="text-2xl font-black text-yellow-400">店內收銀</h1>
                <p class="text-sm font-bold text-neutral-400">用分店密碼登入；Master 可以切換所有分店。</p>
            </div>
            <select id="pos-login-store"
                class="w-full rounded-2xl bg-neutral-900 border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-yellow-400">
                <option value="Sai Ying Pun">西營盤</option>
                <option value="Fortress Hill">天后</option>
                <option value="Tsuen Wan (Takeaway Only)">荃灣</option>
                <option value="__master__">Master 全部分店</option>
            </select>
            <input id="pos-password" type="password" autocomplete="current-password" required placeholder="廚房密碼"
                class="w-full rounded-2xl bg-neutral-900 border-2 border-neutral-700 px-4 py-4 text-lg font-bold text-white outline-none focus:border-yellow-400">
            <p id="pos-login-error" class="hidden text-sm font-bold text-red-400 text-center"></p>
            <button type="submit" id="pos-login-btn" class="w-full rounded-2xl bg-yellow-400 text-black py-4 text-base font-black">進入 POS</button>
        </form>
    </div>

    <div id="pos-app" class="hidden h-dvh flex flex-col overflow-hidden">
        <header class="sticky top-0 z-40 bg-black/95 border-b border-neutral-800 px-3 py-2">
            <div class="flex items-center gap-2">
                <div class="min-w-0 flex-1">
                    <div id="pos-title" class="text-sm font-black text-yellow-400">測試 POS</div>
                    <p id="last-ticket" class="text-[11px] font-bold text-neutral-500 truncate">未有店內單</p>
                </div>
                <div class="text-right shrink-0 px-2">
                    <div class="text-[10px] font-bold text-neutral-500">購物車</div>
                    <div id="hdr-total" class="text-2xl font-black text-yellow-400 leading-none">$0</div>
                </div>
                <button type="button" class="chip-btn" onclick="openToday()">今日單</button>
                <button type="button" class="chip-btn" id="hold-btn" onclick="openHolds()">掛單</button>
                <button type="button" class="chip-btn" id="table-unpaid-btn" onclick="openTableUnpaid()">枱單</button>
                <button type="button" id="print-status" class="chip-btn" onclick="PosPrint.connect({ launch: true })">出單機</button>
                <button type="button" onclick="logoutPos()" class="chip-btn">登出</button>
            </div>
            <div id="pos-queue-bar" class="hidden px-3 py-2 text-xs font-black">
                斷網排隊 <span id="pos-queue-count">0</span> 單 · 網絡一回復就自動上雲，唔使再撳
            </div>
            <div id="pos-store-row" class="mt-2 grid grid-cols-3 gap-1 hidden">
                <button type="button" class="chip-btn" data-branch="Sai Ying Pun" onclick="selectStore(this)">西營盤</button>
                <button type="button" class="chip-btn" data-branch="Fortress Hill" onclick="selectStore(this)">天后</button>
                <button type="button" class="chip-btn" data-branch="Tsuen Wan (Takeaway Only)" onclick="selectStore(this)">荃灣</button>
            </div>
            <!-- Voice ordering kept in code; hidden until VOICE_ORDERING_ENABLED is true. -->
            <div id="pos-voice-ui" class="hidden">
            <button type="button" id="mic-btn" class="mt-2 w-full min-h-[56px] rounded-xl bg-red-700 font-black text-lg mic-btn" onclick="toggleVoice()">講單</button>
            <div id="voice-live-bar" class="mt-2 rounded-xl border border-red-800 bg-neutral-900 p-3">
                <p id="voice-live" class="text-base font-bold text-yellow-300">聽緊…一次過講晒要咩。</p>
                <p class="mt-1 text-xs font-bold text-neutral-500">停講大約兩秒會自動入購物車。唔想用就撳取消，改用手撳餸。</p>

                    <button type="button" id="voice-lang-cn" class="chip-btn" onclick="setVoiceLang('zh-CN')">普通話</button>

            </div>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 md:grid-cols-[1fr_340px] min-h-0">
            <section id="pos-menu" class="p-3 min-h-0 overflow-auto">

                <div id="cat-tabs" class="flex gap-1 overflow-x-auto pb-2"></div>
                <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
            </section>
            <aside id="pos-cart" class="sticky bottom-0 z-30 border-t md:border-t-0 md:border-l border-neutral-800 p-3 flex flex-col gap-2 bg-neutral-950 md:static overflow-hidden md:overflow-auto">
                <div class="grid grid-cols-3 gap-1 shrink-0">
                    <button type="button" id="fulfill-takeaway" class="chip-btn is-active" onclick="setFulfill('takeaway')">即取</button>
                    <button type="button" id="fulfill-dine" class="chip-btn" onclick="setFulfill('dine_in')">堂食</button>

                </div>
                <div id="table-no-wrap" class="hidden">

                </div>
                <input id="guest-name" type="text" maxlength="40" placeholder="客人名（選填）"
                    class="w-full shrink-0 rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm font-bold outline-none">
                <input id="order-note" type="text" maxlength="40" placeholder="備註（選填）"
                    class="w-full shrink-0 rounded-xl bg-neutral-900 border border-neutral-700 px-3 py-2 text-sm font-bold outline-none">
                <div id="cart-list" class="flex-1 min-h-0 space-y-2 overflow-y-auto"></div>
                <div class="shrink-0 space-y-2 pt-1 bg-neutral-950">
                    <div class="text-sm font-bold text-neutral-400" id="price-break">小計 $0</div>
                    <div class="text-2xl font-black text-yellow-400" id="cart-total">$0</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="pay-btn bg-emerald-600" onclick="beginCharge('cash')">現金</button>
                        <button type="button" class="pay-btn bg-neutral-200 text-black" onclick="beginCharge('card')">卡機</button>
                        <button type="button" class="pay-btn bg-sky-600" onclick="beginCharge('fps')">轉數快</button>
                        <button type="button" class="pay-btn bg-pink-500 text-white" onclick="beginCharge('payme')">PayMe</button>

    <div id="ticket-sheet" class="sheet" onclick="if(event.target===this) closeTicket()">

            <div id="ticket-no" class="ticket-no text-yellow-400 my-3"></div>

            <p id="ticket-pay" class="text-sm font-bold text-neutral-400 mt-1"></p>
            <div id="ticket-items" class="text-left mt-4 space-y-1 text-sm font-bold"></div>

                <button type="button" class="chip-btn min-h-[48px]" onclick="reprintTicket()">重印</button>
                <button type="button" class="pay-btn bg-yellow-400 text-black" onclick="closeTicket()">完成</button>

        </div>

            <div class="flex items-center justify-between mb-3">

        const STORE_KEY = 'mb_pos_store';
        const HOLD_KEY = 'mb_pos_holds';
        const QUEUE_KEY = 'mb_pos_offline_queue_v1';
        const MAX_ADDONS = 3;
        const VOICE_ORDERING_ENABLED = false;

            { id: 'snacks', label: '小食' }, { id: 'drinks', label: '飲品' }, { id: 'sauces', label: '醬汁' },
        ];
        const PAY_LABEL = { cash: '現金', fps: '轉數快', payme: 'PayMe', card: '卡機' };
        const FALLBACK = {
            addon: [

                { id:'a5', name_zh:'煙肉', price:12 }, { id:'a6', name_zh:'牛油果片', price:12 },
                { id:'a7', name_zh:'丹麥藍芝士', price:16 }, { id:'a8', name_zh:'炸素雞排', price:23 },

                { id:'sc3', name_zh:'水牛城辣醬', price:8 }, { id:'sc4', name_zh:'秘製他他醬', price:8 },
                { id:'sc5', name_zh:'藍紋芝士醬', price:8 },
            ],
            combo_snack: [
                { id:'cs1', name_zh:'脆炸薯條 (M)', price:0 }, { id:'cs3', name_zh:'脆炸薯條 (L)', price:4 },
                { id:'cs2', name_zh:'蓮藕脆片 (M)', price:0 }, { id:'cs4', name_zh:'蓮藕脆片 (L)', price:4 },
                { id:'cs5', name_zh:'炸番薯條 (M)', price:6 }, { id:'cs6', name_zh:'炸番薯條 (L)', price:11 },

                { id:'cd2', name_zh:'忌廉哥冰', price:0 }, { id:'cd3', name_zh:'梳打水', price:2 },
                { id:'cd4', name_zh:'肉桂凍檸茶', price:3 }, { id:'cd5h', name_zh:'美式咖啡 (熱)', price:6 },
                { id:'cd5c', name_zh:'美式咖啡 (凍)', price:6 }, { id:'cd6h', name_zh:'鮮奶咖啡 (熱)', price:8 },
                { id:'cd6c', name_zh:'鮮奶咖啡 (凍)', price:8 }, { id:'cd7h', name_zh:'朱古力咖啡 (熱)', price:8 },
                { id:'cd7c', name_zh:'朱古力咖啡 (凍)', price:8 }, { id:'cd8h', name_zh:'朱古力 (熱)', price:8 },
                { id:'cd8c', name_zh:'朱古力 (凍)', price:8 }, { id:'cd9', name_zh:'燕麥牛油果沙冰', price:18 },
                { id:'cd10', name_zh:'雙重阿華田沙冰', price:20 },
            ],
        };

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        let token = '';
        let currentStore = localStorage.getItem(STORE_KEY) || 'Sai Ying Pun';
        let sessionScope = 'single_store';
        let sessionStore = '';
        let currentCat = 'beef';
        let fulfill = 'takeaway';
        let menuItems = [];
        let mods = { addon: [], sauce: [], combo_snack: [], combo_drink: [] };
        let comboBase = 19;
        let cart = [];
        let charging = false;
        let flushingQueue = false;
        let menuPollTimer = null;
        let queueFlushTimer = null;
        let cfgItem = null;
        let cfg = {};
        let cfgEditIndex = -1;
        let lastTicket = null;

        function getToken() { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || token; }
        function saveToken(v) { token = v; localStorage.setItem(TOKEN_KEY, v); sessionStorage.setItem(TOKEN_KEY, v); }
        function applySessionAuth(data = {}) {
            sessionScope = data.scope === 'all_stores' ? 'all_stores' : 'single_store';
            sessionStore = data.store_name || '';
            if (sessionScope !== 'all_stores' && sessionStore) {
                currentStore = sessionStore;
                localStorage.setItem(STORE_KEY, currentStore);
            }
        }
        function canSwitchStores() {
            return sessionScope === 'all_stores';
        }
        function storeLabel(name) {
            if (name === 'Fortress Hill') return '天后';
            if (name === 'Tsuen Wan (Takeaway Only)') return '荃灣';
            return '西營盤';
        }
        function selectedLoginStore() {
            const el = document.getElementById('pos-login-store');
            const value = (el && el.value) ? el.value : '';
            return value === '__master__' ? '' : value;
        }
        function itemImg(item) {
            return (item && (item.img || item.image_url)) || '';
        }
        function cloudinaryUrl(url, width) {
            if (!url || typeof url !== 'string') return '';
            const marker = '/image/upload/';
            const idx = url.indexOf(marker);
            if (idx === -1) return url;
            const prefix = url.slice(0, idx + marker.length);
            const parts = url.slice(idx + marker.length).split('/');
            let assetStart = 0;
            while (assetStart < parts.length - 1 && !/^v\d+$/.test(parts[assetStart])) assetStart += 1;
            const assetPath = parts.slice(assetStart).join('/');
            const w = Number(width);
            const tx = Number.isFinite(w) && w > 0 ? `c_limit,w_${Math.round(w)}/f_auto/q_auto` : 'f_auto/q_auto';
            return `${prefix}${tx}/${assetPath}`;
        }
        function thumbHtml(item) {
            const url = itemImg(item);
            if (!url) {
                return `<div class="pos-thumb flex items-center justify-center text-[10px] font-black text-yellow-400">MB</div>`;
            }
            const src = cloudinaryUrl(url, 320);
            return `<div class="pos-thumb"><img src="${src}" alt="" loading="lazy" decoding="async"></div>`;
        }
        function sizesOf(item) {
            if (Array.isArray(item && item.sizes) && item.sizes.length) return item.sizes;
            return ({

        function tableNoValue() {

        function catalogItem(id) {

        function unitOf(line) {
            const direct = Number(line && line.unit);
            if (Number.isFinite(direct) && direct > 0) return direct;
            const item = catalogItem(line && line.menuId);

        function linePrice(line) {
            let n = unitOf(line);
            if (line.size) n += sizeUpcharge(catalogItem(line.menuId) || { id: line.menuId }, line.size);
            for (const id of line.addonIds || []) n += Number((findMod('addon', id) || {}).price) || 0;
            for (const id of line.sauceIds || []) n += Number((findMod('sauce', id) || {}).price) || 0;
            if (line.comboSnackId && line.comboDrinkId) {
                n += comboBase;

        function cartTotals() {

        function openCfg(id, editIndex, presets) {

                bun: existing ? (String(existing.detailsEn || '').includes('Lettuce') ? 'Lettuce Wrap' : (isBurger(item) ? 'Nissin Bun' : null)) : (isBurger(item) ? 'Nissin Bun' : null),
                spice: existing && String(existing.detailsEn || '').includes('Mild') ? 'Mild' : (isSpicy(item) ? 'Normal' : null),
                temp: existing && String(existing.detailsEn || '').includes('Iced') ? 'Iced' : (itemNeedsTemp(item) ? 'Hot' : null),
                addonIds: existing && Array.isArray(existing.addonIds) ? existing.addonIds.slice() : [],

                comboDrinkId: (existing && existing.comboDrinkId) || null,

            if (presets && typeof presets === 'object') {

                if (presets.bun != null) cfg.bun = presets.bun;
                if (presets.spice != null) cfg.spice = presets.spice;
                if (presets.temp != null) cfg.temp = presets.temp;

                if (presets.combo != null) cfg.combo = !!presets.combo;

        function closeCfg() { document.getElementById('cfg-sheet').classList.remove('is-open'); cfgItem = null; cfgEditIndex = -1; }
        function chipRow(title, html) {
            return `<div><div class="text-[11px] font-black text-neutral-500 mb-1">${title}</div><div class="flex flex-wrap gap-1">${html}</div></div>`;
        }
        function optChip(on, label, fn, disabled) {
            return `<button type="button" class="chip-btn ${on ? 'is-active' : ''}" ${disabled ? 'disabled' : ''} onclick="${disabled ? '' : fn}">${escapeHtml(label)}</button>`;
        }
        function renderCfg() {
            if (!cfgItem) return;
            const item = cfgItem;
            const bits = [];
            bits.push(chipRow('數量', optChip(false,'−','cfg.qty=Math.max(1,(cfg.qty||1)-1);renderCfg()') + `<span class="font-black px-3 py-2">${cfg.qty||1}</span>` + optChip(false,'+','cfg.qty=(cfg.qty||1)+1;renderCfg()')));
            const sz = sizesOf(item);
            if (sz.length) {
                bits.push(chipRow('份量', sz.map((s) => {
                    const label = s.label || s.value;
                    return optChip(cfg.size === label, sizeChipLabel(s), `setCfg('size', '${escapeHtml(label)}')`);
                }).join('')));
            }
            if (isBurger(item)) {
                bits.push(chipRow('包', optChip(cfg.bun === 'Nissin Bun', '日清麵包', "setCfg('bun','Nissin Bun')") + optChip(cfg.bun === 'Lettuce Wrap', '生菜包', "setCfg('bun','Lettuce Wrap')")));
            }
            if (isSpicy(item)) {
                bits.push(chipRow('辣度', optChip(cfg.spice === 'Normal', '正常', "setCfg('spice','Normal')") + optChip(cfg.spice === 'Mild', '小辣', "setCfg('spice','Mild')")));

            if (itemNeedsTemp(item)) {
                bits.push(chipRow('溫度', optChip(cfg.temp === 'Hot', '熱', "setCfg('temp','Hot')") + optChip(cfg.temp === 'Iced', '凍', "setCfg('temp','Iced')")));
            }
            if (isBurger(item)) {
                const addons = visibleAddons();
                const addonMaxed = (cfg.addonIds || []).length >= MAX_ADDONS;
                bits.push(chipRow('加料（最多 ' + MAX_ADDONS + ' 款）', addons.map((a) => {
                    const on = cfg.addonIds.includes(a.id);
                    return optChip(on, `${a.name_zh || a.name_en} +$${a.price}`, `toggleCfg('addonIds','${a.id}')`, !on && addonMaxed);
                }).join('')));
                if (addonMaxed) bits.push('<p class="text-xs font-bold text-amber-300">已揀滿 ' + MAX_ADDONS + ' 款配料</p>');
                bits.push(chipRow('加醬', modsOf('sauce').map((a) => optChip(cfg.sauceIds.includes(a.id), `${a.name_zh || a.name_en} +$${a.price}`, `toggleCfg('sauceIds','${a.id}')`)).join('')));
                bits.push(chipRow('套餐 +$' + comboBase, optChip(!cfg.combo, '單點', "setCfg('combo', false)") + optChip(cfg.combo, '套餐', "setCfg('combo', true)")));
                if (cfg.combo) {
                    bits.push(chipRow('套餐小食（請揀）', modsOf('combo_snack').map((m) =>
                        optChip(cfg.comboSnackId === m.id, `${m.name_zh || m.name_en} +$${m.price}`, `setCfg('comboSnackId','${m.id}')`)

        function setCfg(key, value) {

            if (key === 'temp') {
                const drink = findMod('combo_drink', cfg.comboDrinkId) || {};
                if (value === 'Hot' && isIcedDrinkMod(drink)) cfg.comboDrinkId = null;
                if (value === 'Iced' && isHotDrinkMod(drink)) cfg.comboDrinkId = null;
                cfg.addonIds = (cfg.addonIds || []).filter((id) => !isIceAdjMod(findMod('addon', id) || { id }));
            }

        function toggleCfg(key, id) {
            const arr = cfg[key].slice();
            const i = arr.indexOf(id);
            if (i >= 0) arr.splice(i, 1);

            else arr.push(id);
            cfg[key] = arr;

        function buildLineFromCfg() {
            const item = cfgItem;
            const detailsZh = [];
            const detailsEn = [];

                const zh = cfg.size === 'M' ? '中' : (cfg.size === 'L' ? '大' : cfg.size);
                detailsZh.push('份量: ' + zh);
                detailsEn.push('Size: ' + cfg.size);
            }
            if (cfg.bun) {
                detailsZh.push(cfg.bun === 'Nissin Bun' ? '日清麵包' : '生菜包');
                detailsEn.push(cfg.bun);
            }
            if (cfg.spice) {
                detailsZh.push('辣度: ' + (cfg.spice === 'Mild' ? '小辣' : '正常'));
                detailsEn.push('Spice: ' + cfg.spice);
            }
            if (cfg.temp) {
                detailsZh.push(cfg.temp === 'Iced' ? '凍' : '熱');
                detailsEn.push(cfg.temp);
            }
            for (const id of cfg.addonIds) {
                const m = findMod('addon', id);
                if (m) { detailsZh.push(m.name_zh || m.name_en); detailsEn.push(m.name_en || m.name_zh); }
            }
            for (const id of cfg.sauceIds) {

            let comboSnackId = null, comboDrinkId = null;

                detailsEn.push(`Combo [${(s && s.name_en) || ''}, ${(d && d.name_en) || ''}]`);

            return {
                menuId: item.id,
                nameEn: item.name_en,
                nameZh: item.name_zh,

                qty: Math.max(1, Number(cfg.qty) || 1),

                sauceIds: cfg.sauceIds.slice(),

        function confirmCfg() {

        function removeLine(i) { cart.splice(i, 1); renderCart(); }

        function renderCart() {

            else list.innerHTML = cart.map((line, i) => `

            cfgItem = item;
            const sz = sizesOf(item);
            let size = parsed.size || null;
            if (!size && sz.length) size = sz[0].label || sz[0].value;

                sauceIds: Array.isArray(parsed.sauceIds) ? parsed.sauceIds.slice() : [],

                comboSnackId: parsed.comboSnackId || null,
                comboDrinkId: parsed.comboDrinkId || null,
                qty: Math.max(1, Number(parsed.qty) || 1),
            };

                const note = String(parsed.notesZh || parsed.notesEn || '');
                cfg.temp = /凍|冰|iced/i.test(note) ? 'Iced' : 'Hot';

            if (isBurger(item) && cfg.combo && (!cfg.comboSnackId || !cfg.comboDrinkId)) {

                            'Content-Type': 'application/json',
                            Authorization: 'Bearer ' + getToken(),
                        },
                        body: JSON.stringify({
                            speechText: text,
                            menuItems: catalog.menuItems,
                            modifiers: catalog.modifiers,
                        }),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                    const parsedItems = Array.isArray(data.items) ? data.items : [];
                    const warning = aiWarnings(data);
                    const added = [];
                    for (const parsed of parsedItems) {
                        const line = cartLineFromAi(parsed);
                        if (!line) continue;
                        cart.push(line);
                        added.push((line.qty || 1) + '× ' + (line.nameZh || line.nameEn));
                    }
                    if (!added.length) {
                        showToast(warning || '認唔到餸。再講清楚，或者直接用手撳。');
                        if (live) live.textContent = warning ? ('聽成：「' + text + '」。' + warning) : ('聽成：「' + text + '」。認唔到餸。');
                        voiceBusy = false;
                        setMicLabel(true, '聽緊… 再撳一次入車');
                        scheduleResumeListen(400, '認唔到。請再講一次，或者取消改用手撳。');
                        return;
                    }
                    closeVoice();
                    renderCart();
                    flashCart();
                    const t = cartTotals();
                    showToast('已加入 ' + added.join('、') + '。小計 $' + t.sub + '，實收 $' + t.total + (warning ? '。' + warning : ''));
                } catch (err) {
                    closeVoice();
                    const raw = String((err && err.message) || err || '');
                    const friendly = /high demand|rate limit|too many requests|429|503|繁忙|用量/i.test(raw)
                        ? '講單繁忙，請稍後再試，或者改用手撳餸。'
                        : /quota|exceeded your current quota|free_tier_requests/i.test(raw)
                            ? '講單配額用完，請稍後再試，或者改用手撳餸。'
                        : /no longer available|not found|Gemini|GEMINI|model|Server missing/i.test(raw)
                            ? '講單服務暫時用唔到，請改用手撳餸。'
                            : '講單失敗，請改用手撳餸。';
                    showToast(friendly);
                    return;
                }
                voiceBusy = false;
            }, 480);
        }

        async function finishChargedOrder(data, items, payMethod, extra, guest) {
            extra = extra || {};
            if (payMethod === 'cash') {
                data.cash_received = extra.received;
                data.cash_change = extra.change;
            }
            clearCart();
            document.getElementById('guest-name').value = '';
            document.getElementById('order-note').value = '';
            closeCashSheet();
            showTicket(data, items);
            try {
                await PosPrint.printTicket({
                    ...data,
                    store_name: currentStore,
                    customer_name: guest,
                    queued: !!data.queued,
                }, items, { openDrawer: payMethod === 'cash' });
            } catch (printErr) {
                console.warn('print failed', printErr);
            }
        }

        async function flushPosQueue() {
            if (flushingQueue || charging) return;
            if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
            const rows = readQueue();
            if (!rows.length) return;
            flushingQueue = true;
            const keep = [];
            let synced = 0;
            try {
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    try {
                        const payload = Object.assign({}, row.payload, {
                            allow_sold_out: true,
                            client_id: row.clientId,
                        });
                        const data = await posApi(payload);
                        synced += 1;
                        if (lastTicket && lastTicket.queued && queueTicketNo(row.clientId) === lastTicket.orderNo) {
                            lastTicket.orderNo = data.orderNo;
                            lastTicket.queued = false;
                            const noEl = document.getElementById('ticket-no');
                            if (noEl) noEl.textContent = '#' + data.orderNo;
                            const lastEl = document.getElementById('last-ticket');
                            if (lastEl) lastEl.textContent = `#${data.orderNo} · ${PAY_LABEL[data.pay_method] || data.pay_method} · $${data.total}`;
                        }
                    } catch (err) {
                        const msg = String((err && err.message) || err || '');
                        if (isRetryableNetworkError(err) || /401|403|unauthor|token|密碼/i.test(msg)) {
                            keep.push.apply(keep, rows.slice(i));
                            break;
                        }
                        row.attempts = (row.attempts || 0) + 1;
                        row.lastError = msg;
                        if (row.attempts < 8) keep.push(row);
                    }
                }
                writeQueue(keep);
                if (synced) showToast('已將 ' + synced + ' 張排隊單上雲');
            } finally {
                flushingQueue = false;
            }
        }

        let posSyncStarted = false;
        function startPosBackgroundSync() {
            renderQueueBar();
            if (menuPollTimer) clearInterval(menuPollTimer);
            menuPollTimer = setInterval(function () {
                const app = document.getElementById('pos-app');
                if (!app || app.classList.contains('hidden')) return;
                loadMenu().catch(function () {});
            }, 1500);
            if (queueFlushTimer) clearInterval(queueFlushTimer);
            queueFlushTimer = setInterval(function () { flushPosQueue(); }, 6000);
            if (!posSyncStarted) {
                window.addEventListener('online', function () { flushPosQueue(); });
                posSyncStarted = true;
            }
            flushPosQueue();
        }

        async function charge(payMethod, extra) {
            extra = extra || {};
            if (charging || !cart.length) return;
            if (fulfill === 'dine_in' && !tableNoValue()) {
                alert('堂食請填枱號');
                return;
            }
            charging = true;
            document.querySelectorAll('#pos-cart .pay-btn').forEach((b) => { b.disabled = true; });
            const snapshot = cart.slice();
            const guest = document.getElementById('guest-name').value.trim();
            const note = document.getElementById('order-note').value.trim();
            const tableNo = tableNoValue();
            const clientId = newClientId();
            const totals = cartTotals();
            try {
                const items = snapshot.map((line) => ({
                    menuId: line.menuId,
                    nameEn: line.nameEn,
                    nameZh: line.nameZh,
                    size: line.size || null,
                    qty: line.qty,
                    addonIds: line.addonIds || [],
                    sauceIds: line.sauceIds || [],
                    comboSnackId: line.comboSnackId || null,
                    comboDrinkId: line.comboDrinkId || null,
                    detailsEn: line.detailsEn,
                    detailsZh: line.detailsZh,
                }));
                const payload = {
                    action: 'create_pos_order',
                    store_name: currentStore,
                    pay_method: payMethod,
                    fulfill,
                    table_no: tableNo,
                    customer_name: guest,
                    note,
                    items,
                    client_id: clientId,
                };
                try {
                    const data = await posApi(payload);
                    await finishChargedOrder(data, items, payMethod, extra, guest);
                } catch (err) {
                    if (!isRetryableNetworkError(err)) throw err;
                    const queuedRows = readQueue();
                    if (!queuedRows.some(function (r) { return r.clientId === clientId; })) {
                        queuedRows.push({
                            clientId,
                            store: currentStore,
                            payload,
                            items,
                            payMethod,
                            extra,
                            guest,
                            createdAt: Date.now(),
                        });
                        writeQueue(queuedRows);
                    } else {
                        renderQueueBar();
                    }
                    const pickupBits = [fulfill === 'dine_in' ? '堂食' : '即取'];
                    if (tableNo) pickupBits.push(tableNo + '號枱');
                    if (note) pickupBits.push(note);
                    pickupBits.push('排隊上雲');
                    await finishChargedOrder({
                        orderNo: queueTicketNo(clientId),
                        total: totals.total,
                        subtotal: totals.sub,
                        discount: totals.discount,
                        pay_method: payMethod,
                        pickup_time: pickupBits.join(' · '),
                        queued: true,
                    }, items, payMethod, extra, guest);
                    showToast('網絡斷咗，單已暫存。恢復後會自動上雲，唔使再撳一次。');
                }
            } catch (err) {
                alert('入單失敗：' + (err.message || err));
            } finally {
                charging = false;
                document.querySelectorAll('#pos-cart .pay-btn').forEach((b) => { b.disabled = false; });
            }
        }

        function beginCharge(payMethod) {
            if (charging || !cart.length) return;
            if (fulfill === 'dine_in' && !tableNoValue()) {
                alert('堂食請填枱號');
                return;
            }
            if (payMethod === 'cash') {
                openCashSheet();
                return;
            }
            charge(payMethod);
        }

        function cashPresetAmounts(total) {
            var set = {};
            var add = function (n) {
                n = Math.round(n);
                if (n >= total) set[n] = true;
            };
            add(total);
            add(Math.ceil(total / 10) * 10);
            add(Math.ceil(total / 50) * 50);
            add(Math.ceil(total / 100) * 100);
            add(500);
            return Object.keys(set).map(Number).sort(function (a, b) { return a - b; }).slice(0, 6);
        }
        function openCashSheet() {
            var total = cartTotals().total;
            document.getElementById('cash-due').textContent = '$' + total;
            document.getElementById('cash-received').value = '';
            document.getElementById('cash-error').classList.add('hidden');
            document.getElementById('cash-presets').innerHTML = cashPresetAmounts(total).map(function (n) {
                var label = n === total ? ('剛好 $' + n) : ('$' + n);
                return '<button type="button" class="chip-btn" onclick="setCashReceived(' + n + ')">' + label + '</button>';
            }).join('');
            updateCashChange();
            document.getElementById('cash-sheet').classList.add('is-open');
            var input = document.getElementById('cash-received');
            if (input) setTimeout(function () { input.focus(); }, 50);
        }
        function closeCashSheet() {
            var sheet = document.getElementById('cash-sheet');
            if (sheet) sheet.classList.remove('is-open');
        }
        function setCashReceived(n) {
            document.getElementById('cash-received').value = String(n);
            updateCashChange();
        }
        function updateCashChange() {
            var total = cartTotals().total;
            var received = Number(document.getElementById('cash-received').value);
            var err = document.getElementById('cash-error');
            var changeEl = document.getElementById('cash-change');
            if (!Number.isFinite(received) || received <= 0) {
                changeEl.textContent = '$0';
                err.classList.add('hidden');
                return 0;
            }
            var change = Math.round(received - total);
            if (change < 0) {
                changeEl.textContent = '不足 $' + Math.abs(change);
                err.textContent = '實收少過應付';
                err.classList.remove('hidden');
                return change;
            }
            changeEl.textContent = '$' + change;
            err.classList.add('hidden');
            return change;
        }
        function confirmCash() {
            var total = cartTotals().total;
            var received = Number(document.getElementById('cash-received').value);
            var err = document.getElementById('cash-error');
            if (!Number.isFinite(received) || received < total) {
                err.textContent = '實收唔夠，請再入金額';
                err.classList.remove('hidden');
                return;
            }
            charge('cash', { received: received, change: Math.round(received - total) });
        }

        function readHolds() {
            try {
                var raw = JSON.parse(localStorage.getItem(HOLD_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
            } catch (e) {
                return [];
            }
        }
        function writeHolds(rows) {
            localStorage.setItem(HOLD_KEY, JSON.stringify((rows || []).slice(0, 8)));
            renderHoldBadge();
        }
        function storeHolds() {
            return readHolds().filter(function (row) { return row && row.store === currentStore; });
        }
        function renderHoldBadge() {
            var btn = document.getElementById('hold-btn');
            if (!btn) return;
            var n = storeHolds().length;
            btn.textContent = n ? ('掛單 ' + n) : '掛單';
            btn.classList.toggle('is-active', n > 0);
        }
        function cartSnapshot() {
            return {
                store: currentStore,
                cart: cart.slice(),
                fulfill: fulfill,
                tableNo: tableNoValue(),
                guest: document.getElementById('guest-name').value.trim(),
                note: document.getElementById('order-note').value.trim(),
                savedAt: Date.now(),
            };
        }
        function applyCartSnapshot(row) {
            cart = Array.isArray(row.cart) ? row.cart.slice() : [];
            setFulfill(row.fulfill === 'dine_in' ? 'dine_in' : 'takeaway');
            var tableEl = document.getElementById('table-no');
            if (tableEl) tableEl.value = row.tableNo || '';
            document.getElementById('guest-name').value = row.guest || '';
            document.getElementById('order-note').value = row.note || '';
            renderCart();
        }
        function holdCurrentCart() {
            if (!cart.length) {
                alert('購物車係空嘅');
                return;
            }
            var rows = readHolds();
            var snap = cartSnapshot();
            snap.id = String(Date.now());
            rows.unshift(snap);
            writeHolds(rows);
            clearCart();
            document.getElementById('guest-name').value = '';
            document.getElementById('order-note').value = '';
            renderHoldList();
            showToast('已掛單，可以接下一位');
        }
        function openHolds() {
            renderHoldList();
            document.getElementById('hold-sheet').classList.add('is-open');
        }
        function closeHolds() {
            var sheet = document.getElementById('hold-sheet');
            if (sheet) sheet.classList.remove('is-open');
        }
        function renderHoldList() {
            var list = document.getElementById('hold-list');
            var saveBtn = document.getElementById('hold-save-btn');
            if (saveBtn) saveBtn.disabled = !cart.length;
            var rows = storeHolds();
            if (!list) return;
            if (!rows.length) {
                list.innerHTML = '<p class="font-bold text-neutral-500">未有掛單</p>';
                return;
            }
            list.innerHTML = rows.map(function (row) {
                var t = 0;
                (row.cart || []).forEach(function (line) { t += linePrice(line); });
                var when = new Date(row.savedAt || Date.now());
                var hh = when.getHours();
                var mm = when.getMinutes();
                hh = (hh < 10 ? '0' : '') + hh;
                mm = (mm < 10 ? '0' : '') + mm;
                var label = (row.fulfill === 'dine_in' ? ('堂食' + (row.tableNo ? (' ' + row.tableNo + '號枱') : '')) : '即取');
                if (row.guest) label += ' · ' + row.guest;
                return '<div class="rounded-xl border border-neutral-800 bg-neutral-900 p-3 space-y-2">'
                    + '<div class="font-black">' + escapeHtml(label) + ' · $' + t + '</div>'
                    + '<div class="text-[11px] font-bold text-neutral-500">' + hh + ':' + mm + ' · ' + (row.cart || []).length + ' 項</div>'
                    + '<div class="grid grid-cols-2 gap-2">'
                    + '<button type="button" class="chip-btn" onclick="restoreHold(\'' + row.id + '\')">取回</button>'
                    + '<button type="button" class="chip-btn text-red-300" onclick="dropHold(\'' + row.id + '\')">刪除</button>'
                    + '</div></div>';
            }).join('');
        }
        function restoreHold(id) {
            var row = storeHolds().filter(function (h) { return h.id === id; })[0];
            if (!row) return;
            if (cart.length && !confirm('而家購物車有嘢，取回掛單會覆蓋。繼續？')) return;
            applyCartSnapshot(row);
            writeHolds(readHolds().filter(function (h) { return h.id !== id; }));
            closeHolds();
        }
        function dropHold(id) {
            writeHolds(readHolds().filter(function (h) { return h.id !== id; }));
            renderHoldList();
        }

        async function bootPos() {
            document.getElementById('pos-lock').classList.add('hidden');
            document.getElementById('pos-app').classList.remove('hidden');
            markStoreButtons();
            renderHoldBadge();
            renderQueueBar();
            await loadMenu();
            startTableUnpaidPoll();
            startPosBackgroundSync();
            try { await PosPrint.connect({ launch: false }); } catch (_) {}
        }
        window.onload = async () => {
            try { if (navigator.serviceWorker) navigator.serviceWorker.register('/sw.js'); } catch (_) {}
            const existing = getToken();
            if (!existing) { markStoreButtons(); return; }
            try {
                const res = await fetch('/api/kitchen-login', {
                    method: 'POST',
                    headers: { 'Content-Type':'application/json' },
                    body: JSON.stringify({ token: existing }),
                });
                if (!res.ok) return;
                const data = await res.json().catch(() => ({}));
                if (data.token) saveToken(data.token);
                applySessionAuth(data);
                await bootPos();
            } catch (_) {}
        };
    </script>
